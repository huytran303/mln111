 viết vào năm nào?","Năm 1850"],"a":2},{"n":746,"q":"Tác phẩm \"Chống Đuyrinh\" được Ph. Ăng ghen viết vào thời gian nào?","o":["Từ 1876 - 1877","Từ 1875 - 1878","Từ 1876 - 1878"],"a":2},{"n":747,"q":"Trong số ba phát minh dưới đây, phát minh nào là thuộc về triết học Mác?","o":["Phát minh ra “giai cấp”.","Phát minh ra các quy luật cơ bản của phép biện chứng.","Phát minh ra rằng: đấu tranh giai cấp là động lực phát triển trong các xã hội có giai cấp."],"a":2},{"n":748,"q":"Hãy xác định mệnh đề đúng trong ba mệnh đề dưới đây:","o":["Triết học macxit là một học thuyết đã hoàn chỉnh, xong xuôi.","Triết học macxit chưa hoàn chỉnh, xong xuôi và cần phải bổ sung để phát triển.","Triết học macxit là “khoa học của mọi khoa học”."],"a":1},{"n":749,"q":"","o":["Bản tính của phép biện chứng là phê phán, cách mạng và không hề biết sợ.","Bản tính của phép biện chứng là hướng đến cái tuyệt đối.","Bản tính của phép biện chứng"],"a":0},{"n":750,"q":"Hãy chỉ ra phương án đúng trong ba nhận xét dưới đây về mối quan hệ giữa sản xuất và tiêu dùng:","o":["Sản xuất đối lập hoàn toàn với tiêu dùng, vì sản xuất là sáng tạo còn tiêu dùng là phá huỷ.","Sản xuất cũng là tiêu dùng.","Sản xuất là cái có trước và quy định tiêu dùng."],"a":1},{"n":751,"q":"Vì sao","o":["Vì chỉ đến nước Anh,","Vì các học thuyết kinh tế lớn mà","Mác đến nước Anh để thu thập tư liệu cho bộ Tư bản nổi tiếng của mình?"],"a":2},{"n":752,"q":"","o":["\"Phê phát triết học pháp quyền của Hê ghen\"","\"Tuyên ngôn của Đảng Cộng sản\"","Mác viết: \"Phương pháp biện chứng của tôi không những khác phương pháp của Hê ghen về căn bản, mà còn đối lập hẳn với phương pháp ấy nữa\". Câu đó"],"a":2},{"n":753,"q":"Cống hiến vĩ đại nhất của","o":["Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật lịch sử","Mác về triết học là gì?"],"a":1},{"n":754,"q":"Định nghĩa của V.I. Lênin về vật chất được nêu ra trong tác phẩm nào?","o":["Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán.","Bút ký triết học","Nhà nước và cách mạng."],"a":0},{"n":755,"q":"Thuộc tính cơ bản để phân biệt vật chất với ý thức?","o":["Thực tại khách quan","Vận động","Không gian và thời gian."],"a":0},{"n":756,"q":"Các hình thức tồn tại cơ bản của vật chất.","o":["Vận động","Tồn tại khách quan","Không gian và thời gian","Cả A và C"],"a":3},{"n":757,"q":"Thuộc tính chung nhất của vận động là gì?","o":["Thay đổi vị trí trong không gian","Sự thay đổi về chất","Sự biến đổi nói chung"],"a":2},{"n":758,"q":"Đứng im có tách rời vận động không?","o":["Tách rời vận động","Có quan hệ với vận động","Bao hàm vận động"],"a":2},{"n":759,"q":"Bài học kinh nghiệm mà Đảng ta đã rút ra trong công cuộc đổi mới là gì?","o":["Đổi mới kinh tế trước, đổi mới chính trị sau.","Đổi mới chính trị trước, đổi mới kinh tế sau.","Kết hợp đổi mới kinh tế với đổi mới chính trị."],"a":2},{"n":760,"q":"Tư tưởng nào là của Đại hội Đảng toàn quốc lần thứ IX đề ra:","o":["Chủ động hội nhập kinh tế quốc tế và khu vực.","Tích cực hội nhập kinh tế quốc tế và khu vực.","Đẩy nhanh tiến trình hội nhập kinh tế quốc tế và khu vực."],"a":0},{"n":761,"q":"Câu nói sau đây của","o":["Lời nói đầu góp phần phê phán kinh tế chính trị.","Sự khốn cùng của triết học","Mác là trong tác phẩm nào: \"Cái cối xay quay bằng tay đưa lại xã hội có lãnh chúa phong kiến, cái cối xay chạy bằng hơi nước đưa lại xã hội có nhà tư bản công nghiệp\"."],"a":1},{"n":762,"q":"Câu nói sau đây của","o":["Tư bản","Lời nói đầu góp phần phê phán kinh tế chính trị","Mác là trong tác phẩm nào: \"Sự phát triển của các hình thái kinh tế - xã hội là một quá trình lịch sử - tự nhiên\"."],"a":0},{"n":763,"q":"Câu nói sau đây của V.I.Lênin là trong tác phẩm nào: \"Chỉ có đem quy những quan hệ xã hội vào những quan hệ sản xuất, và đem quy những quan hệ sản xuất vào trình độ của những lực lượng sản xuất thì người ta mới có được cơ sở vững chắc để quan niệm sự phát triển của những hình thái xã hội là một quá trình lịch sử - tự nhiên\".","o":["Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ - xã hội ra sao.","Nhà nước và cách mạng xã hội.","Bệnh ấu trĩ tả khuynh và tính tiểu tư sản."],"a":0},{"n":764,"q":"Trình độ của lực lượng sản xuất thể hiện ở?","o":["Trình độ công cụ lao động và con người lao động","Trình độ tổ chức và phân công lao động xã hội.","Trình độ ứng dụng khoa học vào sản xuất.","Tất cả ý trên"],"a":3},{"n":765,"q":"Tiêu chuẩn khách quan để phân biệt các hình thái kinh tế - xã hội là:","o":["Lực lượng sản xuất","Quan hệ sản xuất","Chính trị, tư tưởng"],"a":1},{"n":766,"q":"Trong sự nghiệp xây dựng chủ nghĩa xã hội ở nước ta, chúng ta phải.","o":["Chủ động xây dựng quan hệ sản xuất trước, sau đó xây dựng lực lượng sản xuất phù hợp.","Chủ động xây dựng lực lượng sản xuất trước, sau đó xây dựng quan hệ sản xuất phù hợp.","Kết hợp đồng thời xây dựng lực lượng sản xuất với xác lập quan hệ sản xuất phù hợp."],"a":2},{"n":767,"q":"Tiến lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là:","o":["Phù hợp với quá trình lịch sử - tự nhiên.","Không phù hợp với quá trình lịch sử - tự nhiên.","Vận dụng sáng tạo của Đảng ta.","Cả A và C"],"a":3},{"n":768,"q":"Triết học ra đời từ thực tiễn, nó có các nguồn gốc:","o":["Nguồn gốc nhận thức và nguồn gốc xã hội","Nguồn gốc nhận thức, nguồn gốc xã hội và giai cấp","Nguồn gốc tự nhiên, xã hội và tư duy","Nguồn gốc tự nhiên và nhận thức"],"a":0},{"n":769,"q":"Đối tượng nghiên cứu của triết học là:","o":["Những quy luật của thế giới khách quan","Những quy luật chung nhất của tự nhiên, xã hội và tư duy","Những vấn đề chung nhất của tự nhiên, xã hội, con người; quan hệ của con người nói chung, tư duy của con người nói riêng với thế giới xung quanh","Những vấn đề của xã hội, tự nhiên"],"a":2},{"n":770,"q":"Triết học có vai trò là:","o":["Toàn bộ thế giới quan","Toàn bộ thế giới quan, nhân sinh quan và phương pháp luận","Hạt nhân lý luận của thế giới quan","Toàn bộ thế giới quan và phương pháp luận"],"a":2},{"n":771,"q":"Vấn đề cơ bản của triết học là:","o":["Quan hệ giữa tồn tại với tư duy và khả năng nhận thức của con người.","Quan hệ giữa vật chất và ý thức, tinh thần với tự nhiên và con người có khả năng nhận thức được thế giới hay không?","Quan hệ giữa vật chất với ý thức, tinh thần với tự nhiên, tư duy với tồn tại và con người có khả năng nhận thức được thế giới hay không?","Quan hệ giữa con người và nhận thức của con người với giới tự nhiên"],"a":2},{"n":772,"q":"Lập trường của chủ nghĩa duy vật khi giải quyết mặt thứ nhất của vấn đề cơ bản của triết học?","o":["Vật chất là tính thứ nhất, ý thức là tính thứ hai","Vật chất có trước, ý thức có sau, vật chất quyết định ý thức.","Vật chất và ý thức cùng đồng thời tồn tại, cùng quyết định lẫn nhau.","Cả a và b."],"a":3},{"n":773,"q":"Ý nào dưới đây không phải là hình thức cơ bản của chủ nghĩa duy vật:","o":["Chủ nghĩa duy vật chất phác","Chủ nghĩa duy vật tầm thường","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng"],"a":1},{"n":774,"q":"Ai là nhà triết học duy vật tiêu biểu trong lịch sử triết học Hy Lạp - La Mã cổ đại được kể dưới đây?","o":["Đêmôcrit và Êpiquya","Arixtot và Êpiquya","Êpiquya và Xôcrat","Xôcrat và Đêmôcrit"],"a":0},{"n":775,"q":"Ý thức có trước, vật chất có sau, ý thức quyết định vật chất, đây là quan điểm:","o":["Duy vật","Duy tâm","Nhị nguyên","Duy tâm chủ quan"],"a":1},{"n":776,"q":"Vật chất và ý thức tồn tại độc lập, ý thức không quyết định vật chất và vật chất không quyết định ý thức, đây là quan điểm của:","o":["Duy vật","Duy tâm","Nhị nguyên","Duy vật tầm thường"],"a":2},{"n":777,"q":"Chủ nghĩa duy vật chất phác trong khi thừa nhận tính thứ nhất của vật chất đã:","o":["Đồng nhất vật chất với vật thể","Đồng nhất vật chất với một hoặc một số vật thể cụ thể cảm tính.","Đồng nhất vật chất với nguyên tử và khối lượng.","Đồng nhất vật chất với nguyên tử"],"a":1},{"n":778,"q":"Khi cho rằng “tồn tại là được tri giác”, đây là quan điểm:","o":["Duy tâm khách quan","Nhị nguyên","Duy tâm chủ quan","Duy cảm"],"a":2},{"n":779,"q":"Khi thừa nhận trong những trường hợp cần thiết thì bên cạnh cái “hoặc là… hoặc là…” còn có cái “vừa là… vừa là…” nữa; thừa nhận một chỉnh thể trong lúc vừa là nó vừa không phải là nó… đây là:","o":["Phương pháp siêu hình","Phương pháp biện chứng","Thuyết bất khả tri","Chủ nghĩa duy vật"],"a":1},{"n":780,"q":"Thế nào là phương pháp siêu hình?","o":["Xem xét sự vật trong trạng thái cô lập, tách rời tuyệt đối","Xem xét sự vật trong trạng thái tĩnh, không vận động phát triển","Xem xét sự phát triển chỉ là sự tăng tiến thuần tuý về lượng, không có thay đổi về chất","Cả a, b và c."],"a":3},{"n":781,"q":"Triết học Ấn Độ cổ đại là một trong ba nền triết học tiêu biểu thời kỳ đầu của lịch sử triết học, đó là:","o":["Triết học Ấn Độ, triết học Trung Quốc và Ả Rập","Triết học Ấn Độ, triết học Ả rập và triết học Hy lạp – La Mã","Triết học Ấn Độ, triết học Trung Quốc, triết học Hy Lạp – La Mã","Triết học Phương Tây"],"a":2},{"n":782,"q":"Vai trò của kinh Vêda đối với triết học Ấn Độ cổ đại:","o":["Là cội nguồn của văn hoá Ấn Độ","Là cơ sở của mọi trường phái triết học Ấn Độ","Là cơ sở của các trường phái triết học chính thống","Cả A và C"],"a":3},{"n":783,"q":"Hệ thống triết học không chính thống ở Ấn Độ cổ đại gồm các trường phái:","o":["Sàmkhuya, Đạo Jaina, Đạo Phật","Lôkayata, Đạo Jaina, Đạo Phật","Vêdanta, Đạo Jaina, Đạo Phật","Đạo Jaina, Đạo Phật, Yoga"],"a":1},{"n":784,"q":"Hệ thống triết học chính thống ở Ấn Độ cổ đại gồm 6 trường phái:","o":["Sàmkhuya, Vedanta, Mimansa, Yoga, Lokayata, Vaseisika.","Sàmkhuya, Vedanta, Mimansa, Yoga, Đạo Jaina, Vaseisika.","Sàmkhuya, Vedanta, Mimansa, Yoga, Nyaya, Vaseisika.","Sàmkhuya, Yoga, Lokayata, Vaseisika, Mimansa."],"a":2},{"n":785,"q":"Quan niệm tồn tại tuyệt đối (Brahman) đồng nhất với “tôi” (Atman) là ý thức cá nhân thuần tuý. Quan niệm đó là của trường phái triết học cổ đại nào ở Ấn Độ:","o":["Sàmkhuya","Nyaya","Vêdanta","Yoga"],"a":2},{"n":786,"q":"Thế giới được tạo ra bởi 4 yếu tố: đất, nước, lửa, không khí là quan điểm của trường phái triết học cổ đại nào ở Ấn Độ:","o":["Lokayata","Nyaya","Sàmkhuya","Mimansa"],"a":0},{"n":787,"q":"Thế giới vật chất là thể thống nhất của 3 yếu tố: Sattva (nhẹ, sáng, tươi vui), Rajas (động, kích thích), Tamas (nặng, khó khăn) là quan điểm của trường phái triết học cổ đại nào ở Ấn Độ:","o":["Lôkayata","Sàmkhuya","Mimansa","Nyaya"],"a":1},{"n":788,"q":"Quan điểm các vật thể vật chất hình thành do các nguyên tử hấp dẫn và kết hợp với nhau theo nhiều dạng khác nhau là của trường phái triết học Ấn Độ cổ đại nào:","o":["Mimansa","Đạo Jaina","Lôkayata","Yoga"],"a":1},{"n":789,"q":"Cơ sở lý luận của đạo Hindu ở Ấn Độ cổ đại là trường phái triết học nào:","o":["Mimansa","Yôga","Vêdanta","Lôkoyata"],"a":2},{"n":790,"q":"Trong triết học cổ đại Ấn Độ, nhân sinh quan Phật giáo thể hiện tập trung trong thuyết “tứ đế”. Phương án nào sau đây phản ánh được “tứ đế” đó?","o":["Khổ đế, Tập đế, Nhân đế, Đạo đế","Khổ đế, Tập đế, Nhân đế, Diệt đế","Khổ đế, Tập đế, Diệt đế, Đạo đế","Khổ đế, Tập đế, Đạo đế, Niết bàn"],"a":2},{"n":791,"q":"Bát chính đạo của Đạo Phật nằm trong phương án nào sau đây:","o":["Chính kiến, chính tư duy, chính ngữ, chính nghiệp, chính mệnh, chính tinh tiến, chính niệm, chính đạo.","Chính kiến, chính tư duy, chính ngữ, chính nghiệp, chính mệnh, chính tinh tiến, chính niệm, chính định.","Chính kiến, chính tư duy, chính ngữ, chính nghiệp, chính định, chính tinh tiến, chính niệm, chính đạo.","Chính kiến, chính khẩu, chính tư duy, chính nghiệp, chính mệnh, chính tinh tiến, chính niệm, chính định."],"a":1},{"n":792,"q":"Trong triết học cổ đại nào Trung Hoa, người chủ trương cải biến xã hội loạn lạc bằng “Nhân trị” là:","o":["Khổng Tử","Tuân Tử","Hàn Phi Tử","Mạnh Tử"],"a":0},{"n":793,"q":"Nhà triết học Trung Quốc cổ đại nào đưa ra quan điểm “Nhân tri sơ tính bản thiện”?","o":["Dương Hùng","Mạnh Tử","Mặc Tử","Lão Tử"],"a":1},{"n":794,"q":"Nhà triết học Trung Quốc cổ đại nào đưa ra quan điểm: “Dân vi quý, xã tắc thứ chi, quân vi khinh” (Dân là trọng hơn cả, xã tắc đứng đằng sau, vua còn nhẹ hơn):","o":["Khổng Tử","Tuân Tử","Mạnh Tử","Lão Tử"],"a":2},{"n":795,"q":"Tác giả câu nói nổi tiếng: “Lưới trời lồng lộng, thưa mà không lọt”?","o":["Lão Tử","Hàn Phi Tử","Trang Tử","Tuân Tử"],"a":0},{"n":796,"q":"Quan điểm: “Đời khác thì việc phải khác, việc khác thì pháp độ phải khác” là của nhà triết học Trung Quốc cổ đại nào?","o":["Thương Ưởng","Hàn Phi Tử","Mặc Tử","Tuân Tử"],"a":1},{"n":797,"q":"Tư tưởng về sự giàu nghèo, sống chết, hoạ phúc, thành bại không phải là do số mệnh quy định mà do hành vi con người gây nên là của ai:","o":["Lão Tử","Trang Tử","Mặc Tử","Khổng Tử"],"a":2},{"n":798,"q":"Nhà triết học Trung Quốc cổ đại nào quan niệm nguyên nhân và động lực căn bản của mọi sự biến đổi lịch sử là do dân số và của cải ít hoặc nhiều?","o":["Hàn Phi Tử","Khổng Tử","Mạnh Tử","Tuân Tử"],"a":0},{"n":799,"q":"Ông cho rằng tự nhiên không có ý chí tối cao, ý muốn chủ quan con người không thể thay đổi được quy luật khách quan, vận mệnh của con người là do con người tự quyết định lấy. Ông là ai?","o":["Trang Tử","Mặc Tử","Hàn Phi Tử","Khổng Tử"],"a":2},{"n":800,"q":"Học thuyết “Kiêm ái” kêu gọi yêu thương tất cả mọi người như nhau, không phân biệt thân sơ, trên dưới, sang hèn là của nhà triết học nào?","o":["Dương Chu","Lão Tử","Mặc Tử","Mạnh Tử"],"a":2},{"n":801,"q":"Chủ trương chủ nghĩa “vị ngã” tức là vì mình trong triết học Trung Quốc cổ đại là của tác giả nào?","o":["Lão Tử","Dương Chu","Trang Tử","Mạnh Tử"],"a":1},{"n":802,"q":"Người đưa ra tư tưởng về sự hình thành khái niệm trước hết là dựa vào kinh nghiệm cảm quan. Con người lấy tính chất chung của sự vật khách quan do cảm giác chung đưa lại để so sánh và quy nạp thành từng loại, đặt cho nó một tên gọi chung, do đó hình thành lời và khái niệm. Ông là ai?","o":["Tuân Tử","Mặc Tử","Trang Tử","Khổng Tử"],"a":0},{"n":803,"q":"Đề cập về nguồn gốc xã hội của con người, một triết gia Trung Quốc cổ đại cho rằng con người khác động vật ở chỗ có tổ chức xã hội và có sinh hoạt xã hội theo tập thể. Sở dĩ như vậy là để sinh tồn, người ta cần phải có sự liên hệ, trao đổi và giúp đỡ nhau một cách tự nhiên và tất yếu. Ông là ai?","o":["Lão Tử","Mạnh Tử","Tuân Tử","Khổng Tử"],"a":2},{"n":804,"q":"Quan điểm: “Hoạ là chỗ tựa của phúc, phúc là chỗ náu của hoạ” tư tưởng về sự thống nhất của các mặt đối lập ấy là của nhà triết học nào?","o":["Mặc Tử","Lão Tử","Tuân Tử","Hàn Phi Tử"],"a":1},{"n":805,"q":"Luận điểm nổi tiếng: “Trời có bốn mùa, đất có sản vật, người có văn tự” là của nhà triết học nào?","o":["Khổng Tử","Mạnh Tử","Hàn Phi Tử","Tuân Tử"],"a":3},{"n":806,"q":"Theo Talét (~ 624-547 TCN) bản nguyên của mọi vật trong thế giới là:","o":["Nước","Không khí","Ête","Lửa"],"a":0},{"n":807,"q":"Ông cho rằng vũ trụ không phải do Chúa trời hay một lực lượng siêu nhiên thần bí nào tạo ra. Nó “mãi mãi đã, đang và sẽ là ngọn lửa vĩnh viễn đang không ngừng bùng cháy và tồn tại”. Ông là ai?","o":["Đêmôcrit","Platôn","Hêraclit","Arixtốt"],"a":2},{"n":808,"q":"Luận điểm “cùng một cái ở trong chúng ta – sống và chết, thức và ngủ, trẻ và già. Vì rằng cái này mà biến đổi thành cái kia, và ngược lại cái kia mà biến đổi thành cái này” là của ai?","o":["Lơxip","Hêraclit","Arixtốt","Đêmôcrit"],"a":1},{"n":809,"q":"Ông cho rằng linh hồn luôn vận động sinh ra nhiệt làm cho cơ thể hưng phấn và vận động, nơi cư trú của linh hồn là trái tim. Ông là ai?","o":["Đêmôcrit","Platôn","Arixtốt","Hêraclit"],"a":0},{"n":810,"q":"Tư tưởng vê sự vận động, phát triển không ngừng của thế giới do quy luật khách quan (lôgos) quy định là của nhà triết học nào?","o":["Arixtốt","Đêmôcrit","Hêraclit","Xênôphan"],"a":2},{"n":811,"q":"Quan điểm thế giới là một khối “duy nhất” bất sinh bất dịch. Thế giới không phải do thần thánh tạo ra là của triết gia nào?","o":["Pitago","Xênôphan","Pacmênit","Hêraclit"],"a":1},{"n":812,"q":"Nhà triết học Hy lạp cổ đại đầu tiên quan niệm, không phải thần thánh sáng tạo ra con người, mà chính con người nghĩ ra, sáng tạo các vị thần thánh theo trí tưởng tượng và theo hình tượng của mình. Ông là ai?","o":["Hêraclit","Đêmôcrit","Xênôphan","Pacmênit"],"a":2},{"n":813,"q":"Ông cho rằng khởi nguyên của thế giới vật chất là 4 yếu tố vật chất: đất, nước, lửa, không khí. Ông là ai?","o":["Dênon","Empêđoc","Anaxago","Xênôphan"],"a":1},{"n":814,"q":"Nhà triết học đưa ra quan niệm sự sống là kết quả của quá trình biến đổi của bản thân tự nhiên; được phát sinh từ những vật thể ẩm ướt, dưới tác động của nhiệt độ. Ông là ai?","o":["Đêmôcrit","Hêraclit","Xênôphan","Anaxago"],"a":0},{"n":815,"q":"Người được Arixtốt coi là tiền bối của mình về lôgíc học, ông là ai?","o":["Platôn","Hêraclit","Đêmôcrit","Pitago"],"a":2},{"n":816,"q":"Tư tưởng về nguồn gốc tâm lý của tín ngưỡng, tôn giáo là vì con người bị ám ảnh bởi những hiện tượng khủng khiếp trong tự nhiên, là của nhà triết học Hy lạp cổ đại nào?","o":["Hêraclit","Đêmôcrit","Arixtốt","Platôn"],"a":1},{"n":817,"q":"Người đưa ra luận điểm “vạch ra khuyết điểm của riêng mình tốt hơn là vạch ra khuyết điểm của người khác”, ông là ai?","o":["Đêmôcrit","Arixtốt","Hêraclit","Platôn"],"a":0},{"n":818,"q":"Ông cho rằng vật chất cũng là cái có thực nhưng không phải là cái tồn tại, nó chỉ là cái bóng của cái tồn tại “ý niệm”, ông là ai?","o":["Pitago","Xôcrat","Platôn","Arixtốt"],"a":2},{"n":819,"q":"Người đầu tiên nhấn mạnh vai trò đặc biệt của khái niệm trong nhận thức, khi ông cho rằng khám phá ra chân lý đích thực về bản chất sự vật tức là phải hiểu nó ở mức độ khái niệm. Ông là ai?","o":["Arixtốt","Xôcrat","Platôn","Đêmôcrit"],"a":1},{"n":820,"q":"Người đưa ra quan điểm rằng ý niệm là đối tượng của nhận thức chân lý bằng sự hồi tưởng của linh hồn bất tử, ông là ai?","o":["Pitago","Pacmênit","Platôn","Arixtốt"],"a":2},{"n":821,"q":"Nhà triết học Hy lạp cổ đại được","o":["Đêmôcrit","Arixtốt","Mác suy tôn là “người khổng lồ về tư tưởng”, ông là ai?","Hêraclit"],"a":1},{"n":822,"q":"Quá trình tư duy diễn ra qua các khâu: Cơ thể – tác động bên ngoài – cảm giác – tưởng tượng – tư duy, là khái quát của nhà triết học nào?","o":["Arixtốt","Hêraclit","Đêmôcrit","Platôn"],"a":0},{"n":823,"q":"Người đưa ra quan điểm trong việc xem xét nhà nước về 3 phương diện: lập pháp, hành pháp và phán xử, ông là nhà triết học nào?","o":["Platôn","Anaxago","Arixtốt","Đêmôcrit"],"a":2},{"n":824,"q":"Thời kỳ trung cổ bắt đầu từ:","o":["Thế kỷ V đến thế kỷ XIII","Thế kỷ V đến thế kỷ XV","Thế kỷ V đến thế kỷ XVI","Thế kỷ IV đến thế kỷ XIV"],"a":1},{"n":825,"q":"Hình thái kinh tế - xã hội nào thống trị thời kỳ trung cổ ở Tây Âu:","o":["Chiếm hữu nô lệ","Cộng sản nguyên thuỷ","Phong kiến","Tư bản chủ nghĩa"],"a":2},{"n":826,"q":"Người đưa ra quan niệm Thượng đế là một vật thể, ông là ai?","o":["Tectuliêng","Ôguytxtanh","Giăngxicốt Ơrigieno","Tômát Đacanh"],"a":0},{"n":827,"q":"Ông cho rằng quá trình nhận thức của con người là quá trình nhận thức Thượng đế, nhận thức Thượng đế chỉ để đạt được bởi niềm tin tôn giáo và Thượng đế là chân lý tối cao?","o":["TômátĐacanh","Ôguytxtanh","Đơnxcốt","Tectuliêng"],"a":1},{"n":828,"q":"Thời kỳ hưng thịnh của chủ nghĩa Kinh viện ở Tây Âu thời kỳ trung cổ:","o":["Thế kỷ X","Thế kỷ X đến thế kỷ XII","Thế kỷ XIII","Thế kỷ X đến Thế kỷ XIII"],"a":2},{"n":829,"q":"Người đưa ra tư tưởng đồng nhất tôn giáo với triết học rằng: “triết học chân chính và tôn giáo chân chính là một”, ông là ai?","o":["Giăngxicốt Ơrigieno","Tectuliêng","TômatĐacanh","Đơnxcốt"],"a":0},{"n":830,"q":"Khi giải quyết quan hệ giữa lý trí và lòng tin, ông quan niệm rằng niềm tin phải lấy lý trí làm cho cơ sở “hiểu để mà tin”, ông là ai?","o":["Đơnxcốt","Pie Abơla","Rôgiê Bêcơn","Ôguytxtanh"],"a":1},{"n":831,"q":"Quan niệm đối tượng của triết học là nghiên cứu “chân lý và lý trí”, còn đối tượng của thần học là “chân lý của lòng tin tôn giáo” là của ai?","o":["Pie Abơla","Ôguytxtanh","Tômat Đacanh","Rôgiê Bêcơn"],"a":2},{"n":832,"q":"Người theo chủ nghĩa Duy thực triệt để, ông là ai?","o":["Tômát Đacanh","Giăngxicốt Ơrigieno","Đơnxcốt","Pie Abơla"],"a":1},{"n":833,"q":"Người coi khoa học thực nghiệm là chúa tể của khoa học, ông là ai?","o":["Rôgiê Bêcơn","Pie Abơla","Guyôm Ôccam","Đơnxcốt"],"a":0},{"n":834,"q":"Người được coi là nhà triết học duy tâm chủ quan triệt để nhất trong lịch sử triết học Trung Quốc, ông là ai?","o":["Lý Chí (1527-1602)","Lục Cửu Uyên","Vương Thủ Nhân (1472-1528)","Thiệu Ung"],"a":2},{"n":835,"q":"Ông được coi là người tiên phong trong việc kết hợp Nho – Phật – Lão, ông là ai?","o":["Chu Đôn Di (1017-1073)","Thiệu Ung (1011-1077)","Chu Hy (1130-1200)","Vương Thủ Nhân (1472-1528)"],"a":1},{"n":836,"q":"Quan niệm: “Hình (thể xác) là cái chất của tinh thần, tinh thần là tác dụng của (hình) thể xác” là của nhà triết học hoặc trường phái triết học nào ở Trung Quốc?","o":["Bùi Nguỵ (265-299)","Phạm Chẩn (450-515)","Phái Hàn Dũ, Liễu Tôn Nguyên, Âu Dương Tu, Tô Đông Pha.","Chu Hy (1130-1200)"],"a":1},{"n":837,"q":"Quan niệm: “Không có hai mặt đối lập không thể thấy được sự thống nhất thì tác dụng của hai mặt đối lập cũng không có” là của nhà triết học nào?","o":["Trình Hạo (1032-1085)","Trình Di (1033-1107)","Trương Tải (1020-1077)","Thiệu Ung (1011-1077)"],"a":2},{"n":838,"q":"Tư tưởng thế giới là một chỉnh thể không thể phân chia trong đó có các sự vật, hiện tượng đều có mối liên hệ với nhau, ví như cơ thể con người, đó là tư tưởng của ai?","o":["Trần Lượng (1143-1194)","Lục Cửu Uyên (1139-1192)","Chu Hy(1130-1200)","Trình Di (1033-1107)"],"a":0},{"n":839,"q":"Ông cho rằng chỉ có nghiên cứu sự vật cụ thể, tìm hiểu đời sống con người mới có thể tìm ra quy luật khách quan, tìm ra chân lý. Ông là ai?","o":["Trương Tải (1020 - 1077)","Thiệu Ung (1011 - 1077)","Trần Lượng (1143 - 1194)","Lục Cửu Uyên (1139-1192)"],"a":2},{"n":840,"q":"Ông nói: “Trời đất sinh ở Thái cực. Thái cực là cái Tâm của ta; muôn vật biến hoá là do Thái cực sinh ra, tức là Tâm của ta sinh ra vậy. Bởi vậy, mới nói Đạo của trời đất có đủ ở người”. Ông là nhà triết học nào?","o":["Chu Đôn Di (1017 - 1073)","Thiệu Ung (1011 - 1077)","Trình Di (1033 - 1107)","Chu Hy(1130-1200)"],"a":1},{"n":841,"q":"Tác phẩm nào được coi là đánh dấu sự chín muồi của thế giới quan mới (chủ nghĩa duy vật về lịch sử)?","o":["Hệ tư tưởng Đức","Bản thảo kinh tế triết học 1844","Sự khốn cùng của triết học","Luận cương về Phoiơbắc"],"a":0},{"n":842,"q":"Yếu tố nào giữ vai trò quyết định trong tồn tại xã hội?","o":["Môi trường tự nhiên","Điều kiện dân số","Phương thức sản xuất","Lực lượng sản xuất"],"a":2},{"n":843,"q":"Sản xuất vật chất là gì?","o":["Sản xuất xã hội, sản xuất tinh thần","Sản xuất của cải vật chất","Sản xuất vật chất và sản xuất tinh thần","Sản xuất ra đời sống xã hội"],"a":1},{"n":844,"q":"Tư liệu sản xuất bao gồm:","o":["Con người và công cụ lao động","Con người lao động, công cụ lao động và đối tượng lao động","Đối tượng lao động và tư liệu lao động","Công cụ lao động và tư liệu lao động"],"a":2},{"n":845,"q":"Trình độ của lực lượng sản xuất thể hiện ở:","o":["Trình độ công cụ lao động và người lao động","Trình độ tổ chức, phân công lao động xã hội","Trình độ ứng dụng khoa học vào sản xuất","Tất cả ý trên"],"a":3},{"n":846,"q":"Tiêu chuẩn khách quan để phân biệt các chế độ xã hội trong lịch sử?","o":["Quan hệ sản xuất đặc trưng","Chính trị tư tưởng","Lực lượng sản xuất","Phương thức sản xuất"],"a":0},{"n":847,"q":"Yếu tố cách mạng nhất trong lực lượng sản xuất:","o":["Người lao động","Công cụ lao động","Phương tiện lao động","Tư liệu lao động"],"a":1},{"n":848,"q":"Trong quan hệ sản xuất, quan hệ nào giữ vai trò quyết định:","o":["Quan hệ sở hữu tư liệu sản xuất","Quan hệ tổ chức, quản lý quá trình sản xuất","Quan hệ phân phối sản phẩm.","Quan hệ sở hữu tư nhân về tư liệu sản xuất"],"a":0},{"n":849,"q":"Thời đại đồ đồng tương ứng với hình thái kinh tế – xã hội:","o":["Hình thái kinh tế – xã hội cộng sản nguyên thuỷ","Hình thái kinh tế – xã hội phong kiến","Hình thái kinh tế – xã hội chiếm hữu nô lệ","Hình thái kinh tế – xã hội tư bản chủ nghĩa"],"a":2},{"n":850,"q":"Nội dung của quá trình sản xuất vật chất là:","o":["Tư liệu sản xuất và quan hệ giữa người với người đối với tư liệu sản xuất","Tư liệu sản xuất rị","Là nguyện vọng của mỗi quốc gia dân tộc","Là một tất yếu khách quan do nguyên nhân kinh tế","Là do sự phát triển của xã hội"],"a":2},{"n":896,"q":"Đáp án nào sau đây nêu đúng nhất bản chất của Nhà nước:","o":["Cơ quan phúc lợi chung của toàn xã hội","Công cụ thống trị áp bức của giai cấp thống trị đối với toàn xã hội, cơ quan trọng tài phân xử, hoà giải các xung đột xã hội.","Là cơ quan quyền lực của giai cấp","Là bộ máy quản lý xã hội"],"a":1},{"n":897,"q":"Đặc trưng chủ yếu của cách mạng xã hội là gì:","o":["Sự thay đổi về hệ tư tưởng nói riêng và toàn bộ đời sống tinh thần xã hội nói chung.","Sự thay đổi về toàn bộ đời sống tinh thần của xã hội nói chung","Sự thay đổi chính quyền nhà nước từ tay giai cấp thống trị phản động sang tay giai cấp cách mạng.","Sự thay đổi đời sống vật chất và đời sống tinh thần của xã hội nói chung."],"a":2},{"n":898,"q":"Nguyên nhân sâu xa nhất của cách mạng xã hội là:","o":["Nguyên nhân chính trị","Nguyên nhân kinh tế","Nguyên nhân tư tưởng","Nguyên nhân tâm lý"],"a":1},{"n":899,"q":"Điều kiện khách quan của cách mạng xã hội là:","o":["Phương pháp cách mạng","Thời cơ cách mạng","Tình thế cách mạng","Cả B và C"],"a":3},{"n":900,"q":"Vai trò của cải cách xã hội đối với cách mạng xã hội:","o":["Cải cách xã hội không có quan hệ với cách mạng xã hội","Cải cách xã hội thúc đẩy quá trình tiến hóa xã hội, từ đó tạo tiền đề cho cách mạng xã hội","Cải cách xã hội của lực lượng xã hội tiến bộ và trong hoàn cảnh nhất định trở thành bộ phận hợp thành của cách mạng xã hội.","Cả B và C"],"a":3},{"n":901,"q":"Quan điểm của chủ nghĩa cải lương đối với cách mạng xã hội, đó là:","o":["Chủ trương cải cách riêng lẻ trong khuôn khổ chủ nghĩa tư bản","Chủ trương thay đổi chủ nghĩa tư bản bằng phương pháp hoà bình","Từ bỏ đấu tranh giai cấp và cách mạng xã hội","Cả A và C"],"a":3},{"n":902,"q":"Cuộc cách mạng tháng 8/1945 ở nước ta do Đảng cộng sản Đông Dương lãnh đạo:","o":["Là cuộc cách mạng vô sản","Là cách mạng dân tộc dân chủ nhân dân","Là cuộc đấu tranh giải phóng giai cấp","Là cuộc chiến tranh giải phóng dân tộc"],"a":1},{"n":903,"q":"Yếu tố giữ vai trò quan trọng nhất của nhân tố chủ quan trong cách mạng vô sản là:","o":["Đảng của giai cấp công nhân có đường lối cách mạng đúng đắn","Tính tích cực chính trị của quần chúng","Lực lượng tham gia cách mạng","Khối đoàn kết công – nông – trí thức."],"a":1},{"n":904,"q":"Điều kiện không thể thiếu để cuộc cách mạng xã hội đạt tới thành công theo quan điểm của chủ nghĩa Mác-Lênin:","o":["Bạo lực cách mạng","Sự giúp đỡ quốc tế","Giai cấp thống trị phản động tự nó không duy trì được địa vị thống trị","Sự khủng hoảng của chế độ xã hội cũ"],"a":0},{"n":905,"q":"Theo Ph. Ăngghen, vai trò quyết định của lao động đối với quá trình biến vượn thành người là:","o":["Lao động làm cho bàn tay con người hoàn thiện hơn","Lao động làm cho não người phát triển hơn","Lao động là nguồn gốc hình thành ngôn ngữ","Tất cả các ý trên"],"a":3},{"n":906,"q":"Kết luận của Ph. Ăngghen về vai trò quyết định của lao động trong việc hình thành con người và là điều kiện cho sự tồn tại và phát triển của xã hội là nhờ:","o":["Áp dụng quan điểm của Đac-uyn trong tác phẩm “Nguồn gốc loài người” của ông.","Áp dụng quan điểm duy vật lịch sử vào nghiên cứu vấn đề nguồn gốc loài người","Áp dụng quan điểm của các nhà kinh tế chính trị học Anh “lao động là nguồn gốc của mọi của cải.","Suy luận chủ quan của Ph. Ăngghen"],"a":1},{"n":907,"q":"Tiêu chuẩn cơ bản nhất của tiến bộ xã hội là:","o":["Trình độ phát triển của khoa học kỹ thuật","Trình độ dân trí và mức sống cao của xã hội","Trình độ phát triển của lực lượng sản xuất","Trình độ phát triển của đạo đức, luật pháp, tôn giáo"],"a":2},{"n":908,"q":"Những đặc trưng cơ bản của nhà nước:","o":["Nhà nước quản lý dân cư trên một vùng lãnh thổ nhất định","Là bộ máy quyền lực đặc biệt mang tính cưỡng chế đối với mọi thành viên trong xã hội","Nhà nước hình thành hệ thống thuế khoá để duy trì và tăng cường bộ máy cai trị","Tất cả các ý trên"],"a":3},{"n":909,"q":"Lý luận hình thái kinh tế – xã hội của","o":["Nhà nước và cách mạng","Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ xã hội ra sao.","Mác được V.I.Lênin trình bày khái quát trong tác phẩm nào sau đây:","Bút ký triết học"],"a":1},{"n":910,"q":"Thực chất của cách mạng xã hội là:","o":["Thay đổi thể chế chính trị này bằng thể chế chính trị khác","Thay đổi thể chế kinh tế này bằng thể chế kinh tế khác","Thay đổi hình thái kinh tế – xã hội thấp lên hình thái kinh tế – xã hội cao hơn.","Thay đổi chế độ xã hội"],"a":2},{"n":911,"q":"","o":["Luận cương về Phoiơbắc","Hệ tư tưởng Đức","Mác viết: “Các học thuyết duy vật chủ nghĩa cho rằng con người là sản phẩm của những hoàn cảnh giáo dục… Các học thuyết ấy quên rằng chính những con người làm thay đổi hoàn cảnh và bản thân nhà giáo dục cũng cần phải được giáo dục”. Câu nói này trong tác phẩm nào sau đây:","Góp phần phê phán triết học pháp quyền của Hêgen"],"a":0},{"n":912,"q":"Điểm xuất phát để nghiên cứu xã hội và lịch sử của","o":["Con người hiện thực","Sản xuất vật chất","Mác, Ph.Ăngghen là:","Đời sống xã hội"],"a":1},{"n":913,"q":"Tư tưởng về vai trò cách mạng của bạo lực như là phương thức để thay thế xã hội cũ bằng xã hội mới của F.Ăngghen được trình bày trong tác phẩm:","o":["Những bức thư duy vật lịch sử","Nguồn gốc của gia đình, của chế độ tư hữu và của nhà nước.","Chống Đuyrinh","Biện chứng của tự nhiên"],"a":2},{"n":914,"q":"Đặc trưng nào dễ biến động nhất trong các đặc trưng của dân tộc:","o":["Sinh hoạt kinh tế","Lãnh thổ","Ngôn ngữ","Văn hóa và cấu tạo tâm lý"],"a":0},{"n":915,"q":"Chức năng xã hội của nhà nước với tư cách là:","o":["Một tổ chức xã hội","Một cơ quan công quyền","Một bộ máy trấn áp","Một cơ quan pháp chế"],"a":1},{"n":916,"q":"Chức năng giai cấp của nhà nước bao gồm:","o":["Tổ chức, kiến tạo trật tự xã hội","Thực hành chuyên chính trấn áp các giai cấp đối lập","Củng cố, mở rộng cơ sở chính trị xã hội cho sự thống trị của giai cấp cầm quyền.","Cả B và C"],"a":3},{"n":917,"q":"Nhận xét của V.I.Lênin về một tác phẩm của","o":["Tư bản","Lutvích Phoiơbắc và sự cáo chung của triết học cổ điển Đức","Mác và Ph.Ăngghen: “Tác phẩm này trình bày một cách hết sức sáng tạo và rõ ràng thế giới quan mới chủ nghĩa duy vật triệt để” (tức chủ nghĩa duy vật lịch sử). Đó là tác phẩm:","Luận cương về Phoiơbắc"],"a":2},{"n":918,"q":"Lịch sử diễn ra một cách phức tạp là do:","o":["Bị tác động bởi quy luật lợi ích","Bị chi phối với quy luật chung của xã hội","Bị chi phối bởi đặc thù truyền thống văn hoá của mỗi quốc gia dân tộc.","Cả A và C"],"a":3},{"n":919,"q":"Chọn câu của","o":["Trong tính hiện thực, bản chất con người là tổng hoà các mối quan hệ xã hội.","Trong tính hiện thực của nó, bản chất con người là tổng hoà tất cả các mối quan hệ xã hội.","Mác định nghĩa bản chất con người trong các phương án sau:","Con người là động vật xã hội"],"a":2},{"n":920,"q":"Biểu hiện vĩ đại nhất trong bước ngoặt cách mạng do","o":["Làm thay đổi tính chất của triết học","Sáng tạo ra chủ nghĩa duy vật về lịch sử","Mác và Ph.Ăngghen thực hiện:","Phát hiện ra quy luật kinh tế của chủ nghĩa tư bản"],"a":1},{"n":921,"q":"Bản chất của con người được quyết định bởi:","o":["Các mối quan hệ xã hội","Nỗ lực của mỗi cá nhân","Giáo dục của gia đình và nhà trường","Hoàn cảnh xã hội"],"a":3},{"n":922,"q":"Con người là thể thống nhất của các mặt cơ bản:","o":["Sinh học","Tâm lý","Xã hội","Cả A và C"],"a":3},{"n":923,"q":"Câu nói sau của Ph.Ăngghen: “Nhà nước là yếu tố tuỳ thuộc, còn xã hội công dân tức là lĩnh vực những quan hệ kinh tế, là yếu tố quyết định”, được nêu trong tác phẩm:","o":["Lutvich Phoiơbắc và sự cáo chung của triết học cổ điển Đức","Nguồn gốc của gia đình, của chế độ tư hữu và của nhà nước","Chống Đuyrinh","Biện chứng của tự nhiên"],"a":0},{"n":924,"q":"Lực lượng quyết định sự phát triển của lịch sử là:","o":["Nhân dân","Quần chúng nhân dân","Vĩ nhân, lãnh tụ","Các nhà khoa học"],"a":1},{"n":925,"q":"Hạt nhân cơ bản của quần chúng nhân dân là:","o":["Các giai cấp, đoạn","3 giai đoạn","4 giai đoạn","Nhiều giai đoạn"],"a":1},{"n":1000,"q":"Kết cấu giai cấp trong xã hội có giai cấp thường gồm:","o":["Các giai cấp cơ bản.","Các giai cấp cơ bản và các giai cấp không cơ bản.","Các giai cấp cơ bản, các giai cấp không cơ bản và tầng lớp trung gian.","Các giai cấp đối kháng"],"a":2},{"n":1001,"q":"Tìm câu thiếu nội dung nhất về vai trò của thực tiễn đối với nhận thức trong các câu sau:","o":["Là cơ sở, mục đích, động lực chủ yếu và trực tiếp của nhận thức và là tiêu chuẩn của chân lý","Là nguồn gốc, cơ sở, mục đích của nhận thức","Là mục đích, cơ sở, động lực của nhận thức và làm tiêu chuẩn cho kinh nghiệm","Thước đo để phát hiện sự đúng sai của cảm giác, của kinh nghiệm và của lý luận"],"a":3},{"n":1002,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy tâm trong các luận điểm sau:","o":["Chân lý là tri thức phản ánh đúng hiện thực khách quan và đã được thực tiễn kiểm nghiệm, vì vậy, có thể áp dụng chân lý đó vào mọi nơi, mọi lúc, mọi việc đều đúng","Giới động vật và thực vật hoàn toàn tách rời nhau, không có nguồn gốc chung","Sự phát huy tính năng động chủ quan của con người muốn có hiệu quả bao giờ cũng phải dựa vào cơ sở vật chất","Chân lý chỉ tồn tại trong nhận thức con người. Vì vậy nội dung của chân lý là do chủ quan của con người tạo ra"],"a":3},{"n":1003,"q":"Hãy chỉ ra luận điểm thuộc lập trường Duy vật biện chứng trong các luận điểm sau:","o":["Thế giới tồn tại khách quan, còn quy luật vận động và phát triển của thế giới do ý thức con người tạo ra.","Phát triển là quá trình tiến bộ, theo đường thẳng.","Mỗi chân lý khoa học dù có tính tương đối vẫn chứa đựng yếu tố của chân lý tuyệt đối.","Vật chất là thực tại, tồn tại phụ thuộc vào cảm giác của con người."],"a":2},{"n":1004,"q":"Hãy chỉ ra luận điểm thuộc lập trường Duy vật siêu hình trong các luận điểm sau:","o":["Mâu thuẫn là nguồn gốc, động lực của mọi sự vận động và phát triển.","Phủ định của phủ định là sự loại bỏ hoàn toàn sự vật cũ.","Nhân quả là mối liên hệ có tính chủ quan, do con người xác lập.","Nhận thức chẳng qua chỉ là phức hợp các cảm giác của con người."],"a":1},{"n":1005,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy vật siêu hình về lịch sử trong các luận điểm sau:","o":["Quan hệ sản xuất có tính vật chất, quyết định mọi quan hệ xã hội khác.","Nguyên nhân của mọi biến đổi trong lịch sử, xét đến cùng là do tư tưởng của con người đang luôn luôn thay đổi.","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử.","Cơ sở hạ tầng quyết định kiến trúc thượng tầng, đồng thời kiến trúc thượng tầng tác động ngược trở lại đối với cơ sở hạ tầng."],"a":2},{"n":1006,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy tâm về lịch sử trong các câu sau:","o":["Sự thịnh suy của mỗi dân tộc là do ý chí của người đứng đầu quốc gia quyết định.","Quan hệ sản xuất là những quan hệ xã hội có tính vật chất được hình thành không tuỳ thuộc ý muốn của những người sản xuất.","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử.","Trong một cung điện, người ta suy nghĩ khác trong một túp lều tranh."],"a":0},{"n":1007,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy vật siêu hình về lịch sử trong các câu sau:","o":["Phương thức sản xuất là cách thức con người tiến hành quá trình sản xuất vật chất ở những giai đoạn lịch sử nhất định của xã hội loài người.","Xã hội là một tổng số các bộ phận được cấu thành và biến đổi tuỳ ý muốn con người.","Xã hội là một tổ hợp các bộ phận được cấu thành và biến đổi một cách ngẫu nhiên.","Tất cả cái gì thúc đẩy con người hành động đều phải thông qua đầu óc của họ. Vì vậy phải tìm động lực sâu xa của lịch sử ở trong tư tưởng và ý chí của con người."],"a":2},{"n":1008,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy tâm trong các câu sau:","o":["Chỉ dựa vào các quan hệ kinh tế hiện có cũng có thể giải thích đầy đủ bất kỳ học thuyết chính trị nào.","Chỉ dựa vào các quan hệ kinh tế hiện có cũng có thể giải thích đúng bất kỳ tư tưởng pháp quyền nào.","Mọi thuyết đạo đức có từ trước đến nay, xét đến cùng, đều là sản phẩm của tình hình kinh tế lúc bấy giờ.","Hoạt động của con người khác với động vật là có ý thức, vì thế ý thức của con người quyết định sự tồn tại của họ."],"a":3},{"n":1009,"q":"Hãy chỉ ra luận điểm thể hiện lập trường Duy vật biện chứng về lịch sử trong các câu sau:","o":["Quan hệ sản xuất là những quan hệ xã hội có tính vật chất quyết định mọi quan hệ xã hội khác.","Nguyên nhân của mọi biến đổi trong lịch sử, xét đến cùng là do tư tưởng của con người đang luôn luôn thay đổi.","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử.","Sự thịnh suy của mỗi dân tộc là do ý chí của người đứng đầu quốc gia quyết định."],"a":0},{"n":1010,"q":"Tìm luận điểm tóm tắt sai về khái niệm Tồn tại xã hội trong các câu sau:","o":["Đó là một khái niệm cơ bản của chủ nghĩa duy vật lịch sử.","Chỉ toàn bộ các yếu tố vật chất bảo đảm cho sự tồn tại và phát triển của xã hội loài người. Bao gồm hoàn cảnh địa lý tự nhiên, dân cư và phương thức sản xuất.","Trong ba yếu tố của Tồn tại xã hội thì hoàn cảnh địa lý tự nhiên là yếu tố quan trọng nhất, quyết định sự biến đổi, phát triển của xã hội.","Trong ba yếu tố của Tồn tại xã hội thì phương thức sản xuất là yếu tố quan trọng nhất, quyết định sự biến đổi, phát triển của xã hội."],"a":2},{"n":1011,"q":"Tìm câu tóm tắt sai về khái niệm Quan hệ sản xuất trong các câu sau:","o":["Mối quan hệ giữa người và người trong quá trình sản xuất của cải vật chất được gọi là Quan hệ sản xuất.","Cũng như Lực lượng sản xuất, Quan hệ sản xuất thuộc lĩnh vực đời sống vật chất xã hội.","Tính vật chất của Quan hệ sản xuất được biểu hiện ở chỗ chúng tồn tại khách quan, phụ thuộc vào ý thức con người","Quan hệ sản xuất là quan hệ kinh tế cơ bản của một hình thái kinh tế-xã hội."],"a":2},{"n":1012,"q":"Tìm câu tóm tắt sai về mối quan hệ biện chứng giữa Lực lượng sản xuất và Quan hệ sản xuất trong các câu sau:","o":["Lực lượng sản xuất và Quan hệ sản xuất là hai mặt của Phương thức sản xuất, tồn tại không tách rời nhau.","Mối quan hệ biện chứng giữa Lực lượng sản xuất và Quan hệ sản xuất là nội dung quy luật về sự phù hợp của Quan hệ sản xuất với trình độ và tính chất của Lực lượng sản xuất.","Quy luật về sự phù hợp của Quan hệ sản xuất với trình độ và tính chất của Lực lượng sản xuất là quy luật xã hội phổ biến trong tất cả các xã hội có đối kháng giai cấp.","Quy luật về sự phù hợp của Quan hệ sản xuất với trình độ và tính chất của Lực lượng sản xuất vạch rõ sự phụ thuộc khách quan của Quan hệ sản xuất vào sự phát triển của Lực lượng sản xuất, đồng thời Quan hệ sản xuất cũng tác động trở lại Lực lượng sản xuất."],"a":2},{"n":1013,"q":"Phát hiện luận điểm sai về Lực lượng sản xuất trong các luận điểm sau đây:","o":["Đối tượng lao động là yếu tố động nhất và cách mạng nhất trong Lực lượng sản xuất.","Tư liệu lao động là cơ sở của sự kế tục lịch sử xã hội.","Cái cối xay quay bằng tay đưa lại xã hội có lãnh chúa phong kiến.","Năng suất lao động xã hội là thước đo trình độ phát triển của Lực lượng sản xuất."],"a":0},{"n":1014,"q":"Luận điểm “giai cấp là những tập đoàn người có địa vị kinh tế - xã hội khác nhau trong một hệ thống sản xuất xã hội nhất định trong lịch sử” thuộc lập trường triết học nào?","o":["Chủ nghĩa duy vật lịch sử.","Chủ nghĩa duy tâm lịch sử.","Chủ nghĩa duy vật tầm thường.","Chủ nghĩa duy tâm chủ quan."],"a":0},{"n":1015,"q":"Tìm câu trả lời đúng trong các câu sau về Phủ định biện chứng:","o":["Là sự phủ định có tính khách quan, tự thân, có tính kế thừa và có thêm yếu tố mới.","Là sự phủ định có sự can thiệp của con người, có tính kế thừa và làm chấm dứt quá trình phát triển.","Là tự thân phủ định làm cho cái cũ hoàn toàn mất đi và làm cho cái mới khác nhau về chất với cái cũ.","Là sự phủ nhận hoàn toàn cái cũ, xác lập cái mới khác cái cũ do có sự can thiệp của con người."],"a":0},{"n":1016,"q":"Tìm câu trả lời đúng nhất về phạm trù Cái chung trong các câu sau:","o":["Là cái được tập hợp từ tất cả Cái riêng lại, mang tính khách quan, phổ biến trong tự nhiên, xã hội, tư duy","Là những mặt, thuộc tính lặp lại trong nhiều Cái riêng, mang tính khách quan, phổ biến và sâu sắc","Là cái toàn thể được tập hợp lại từ nhiều bộ phận hợp thành mang tính khách quan, phổ biến","Là những mặt, thuộc tính, quá trình có trong nhiều Cái riêng được con người tạo ra rất phổ biến"],"a":1},{"n":1017,"q":"Tìm câu trả lời đúng nhất về phạm trù Cái riêng trong các câu sau:","o":["Chỉ một sự vật, hiện tượng, quá trình có tính toàn vẹn tồn tại tương đối độc lập với các sự vật khác.","Chỉ một sự vật, hiện tượng, quá trình tồn tại ngẫu nhiên, không lặp lại với Cái riêng khác.","Chỉ một cái khác với Cái chung, là cái bộ phận của Cái chung.","Chỉ một sự vật, hiện tượng có tính quy định không chỉnh thể, phụ thuộc vào Cái riêng khác."],"a":0},{"n":1018,"q":"Tìm câu trả lời đúng về phạm trù Hiện tượng trong các câu sau:","o":["Là những mặt, mối liên hệ, yếu tố bên ngoài có tính chủ quan, là hình thức của Bản chất.","Dùng để chỉ những biểu hiện của các mặt, mối liên hệ tất nhiên tương đối ổn định ở bên ngoài; là mặt dễ biến đổi hơn và là hình thức thể hiện của bản chất đối tượng.","Chỉ phương thức tồn tại, tổ chức kết ấu của Nội dung.","Là những mặt, mối liên hệ, yếu tố biểu hiện bên trong của Bản chất."],"a":1},{"n":1019,"q":"Tìm câu trả lời đúng nhất về phạm trù Nội dung trong các câu sau:","o":["Nội dung là tổng hợp tất cả những mặt, những yếu tố, những quá trình tạo nên sự vật, hiện tượng.","Là tổng hợp các mặt, yếu tố, quan hệ, do người tạo nên sự vật, hiện tượng nào đó.","Là tổng số các mặt, yếu tố, quan hệ được sắp xếp tùy ý để tạo nên sự vật, hiện tượng nào đó.","Là tổng hợp các mặt có tính quy định tạo nên sự vật."],"a":0},{"n":1020,"q":"Tìm câu trả lời đúng nhất về phạm trù Hình thức trong các câu sau:","o":["Hình thức là phương thức tồn tại và phát triển của sự vật, là hệ thống các mối liên hệ tương đối bền vững giữa các yếu tố của sự vật đó.","Là tổng số các mặt biểu hiện bên ngoài của nội dung.","Là vẻ bề ngoài của nội dung.","Là phương thức kết cấu của nội dung, cú tính chủ quan do con người tạo ra cho phù hợp với nội dung."],"a":0},{"n":1021,"q":"Tìm quan niệm sai về Thực tiễn trong các quan niệm sau đây:","o":["Thực tiễn là nguồn gốc của nhận thức vì qua thực tiễn bộc lộ các thuộc tính, mối liên hệ bản chất của đối tượng.","Thực tiễn là hoạt động vật chất do đó thực tiễn không cần gắn với lý luận.","Thực tiễn là cơ sở, động lực của nhận thức.","Thực tiễn là tiêu chuẩn để kiểm tra tính đúng đắn của chân lý."],"a":1},{"n":1022,"q":"Tìm câu thể hiện lập trường Duy vật về lịch sử trong các câu sau đây:","o":["Quan hệ sản xuất là những quan hệ xã hội có tính pháp lý, quyết định mọi quan hệ xã hội khác.","Trong một cung điện, người ta suy nghĩ khác trong một túp lều tranh.","Xã hội là một tổ hợp các bộ phận được cấu thành và biến đổi một cách ngẫu nhiên.","Sự thịnh suy của mỗi dân tộc là do định mệnh chi phối."],"a":1},{"n":1023,"q":"Tìm câu thể hiện lập trường Duy tâm về lịch sử trong các câu sau:","o":["Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử.","Vì cơ sở hạ tầng quyết định kiến trúc thượng tầng nên kiến trúc thượng tầng chỉ đóng vai trò thụ động trong sự phát triển lịch sử.","Quan hệ sản xuất là những quan hệ xã hội có tính vật chất quyết định mọi quan hệ xã hội khác.","Xã hội là một tổ hợp các bộ phận được cấu thành và biến đổi tuỳ theo ý muốn con người."],"a":3},{"n":1024,"q":"Tìm câu thể hiện lập trường Duy vật tầm thường trong các câu sau:","o":["Dân dĩ thực vi thiên.","Do có được những lực lượng sản xuất mới, loài người thay đổi phương thức sản xuất của mình, đồng thời thay đổi tất cả những quan hệ xã hội của mình.","Trong tất cả những chuyển biến lịch sử thì chuyển biến về chính trị là chuyển biến quan trọng nhất, quyết định sự phát triển của lịch sử.","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử."],"a":3},{"n":1025,"q":"Tìm yếu tố viết thừa về các yếu tố cấu thành Quan hệ sản xuất trong các câu sau:","o":["Quan hệ thuê mướn nhân công.","Quan hệ về sở hữu tư liệu sản xuất.","Quan hệ về tổ chức quản lý.","Quan hệ phân phối sản phẩm lao động."],"a":0},{"n":1026,"q":"Tìm yếu tố viết sai về các bộ phận cấu thành Hình thái Kinh tế - xã hội dưới đây:","o":["Lực lượng sản xuất","Cơ sở hạ tầng","Hoàn cảnh địa lý","Kiến trúc thượng tầng"],"a":2},{"n":1027,"q":"Tìm câu viết sai về tính độc lập tương đối của Ý thức xã hội trong các câu sau:","o":["Ý thức xã hội thường lạc hậu hơn so với Tồn tại xã hội.","Ý thức xã hội không phụ thuộc vào Tồn tại xã hội.","Ý thức xã hội có tính kế thừa trong sự phát triển.","Ý thức xã hội tác động trở lại Tồn tại xã hội."],"a":1},{"n":1028,"q":"Tìm câu viết sai về vai trò Lực lượng sản xuất trong một Hình thái kinh tế - xã hội:","o":["Lực lượng sản xuất là nền tảng vật chất- kỹ thuật của xã hội.","Lực lượng sản xuất là nhân tố, xét đến cùng, quyết định sự hình thành và phát triển của mọi xã hội.","Lực lượng sản xuất thể hiện tính liên tục trong sự phát triển của xã hội loài người.","Lực lượng sản xuất tiêu biểu cho bộ mặt của xã hội ở mỗi giai đoạn phát triển."],"a":3},{"n":1029,"q":"Tìm câu bị viết sai về vai trò Quan hệ sản xuất trong một Hình thái kinh tế - xã hội:","o":["Quan hệ sản xuất là quan hệ cơ bản, quyết định tất cả các quan hệ xã hội khác","Quan hệ sản xuất là cơ sở kinh tế của các hiện tượng xã hội","Quan hệ sản xuất thể hiện tính liên tục trong sự phát triển của xã hội loài người","Quan hệ sản xuất tiêu biểu cho bộ mặt của xã hội ở mỗi giai đoạn phát triển nhất định"],"a":2},{"n":1030,"q":"Xác định quan niệm đúng trong các quan niệm về xã hội sau đây:","o":["Xã hội là một tổng số những bộ phận rời rạc.","Xã hội là một tổng hợp có tính máy móc, ngẫu nhiên các yếu tố.","Xã hội là một chỉnh thể phức tạp, vận động và phát triển theo các quy luật khách quan.","Xã hội là một tổng thể được cấu thành chỉ bởi những con người sinh vật."],"a":2},{"n":1031,"q":"Luận điểm “Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào” nhấn mạnh yếu tố nào trong các đáp án sau:","o":["Công cụ lao động","Người lao động","Đối tượng lao động","Công cụ phụ trợ"],"a":0},{"n":1032,"q":"Hãy chỉ ra nguyên nhân đúng và cơ bản nhất dẫn tới sự phân chia xã hội thành giai cấp trong các câu sau:","o":["Nguyên nhân kinh tế.","Nguyên nhân chính trị.","Nguyên nhân năng lực bẩm sinh ở từng nhóm người.","Nguyên nhân nghề nghiệp khác nhau."],"a":0},{"n":1033,"q":"Tìm câu trả lời đúng nhất về cơ sở triết học của bệnh chủ quan duy ý chí trong các câu sau:","o":["Chủ nghĩa duy vật tầm thường.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan."],"a":2},{"n":1034,"q":"Hãy xác định ý kiến đúng nhất về chân lý trong các câu sau:","o":["Chân lý là quan điểm được đa số ủng hộ.","Chân lý là quan điểm được mọi người trong cuộc họp bỏ phiếu tán thành.","Chân lý là một quan điểm được nhiều nhà khoa học thừa nhận.","Chân lý là một quan điểm được chứng minh trong thực tiễn là đúng."],"a":3},{"n":1035,"q":"Tìm câu không đúng nói về biểu hiện của bệnh chủ quan duy ý chí trong các câu sau:","o":["Suy nghĩ và hành động nóng vội.","Chạy theo nguyện vọng chủ quan.","Không tính tới điều kiện và khả năng thực tế.","Luôn luôn tôn trọng quy luật khách quan."],"a":3},{"n":1036,"q":"Hãy chỉ ra một nguyên tắc sai trong việc phòng ngừa và khắc phục bệnh chủ quan duy ý chí ở các câu sau:","o":["Nhìn thẳng vào sự thật, đánh giá đúng sự thật, nói rõ sự thật.","Tôn trọng và hành động theo quy luật khách quan.","Lấy dân làm gốc, lắng nghe nguyện vọng chính đáng của dân.","Lấy ý chí và nguyện vọng làm điểm xuất phát cho mọi chủ trương, kế hoạch công tác."],"a":3},{"n":1037,"q":"Hãy chỉ ra một câu thể hiện sự nhận thức sai về hoàn cảnh địa lý trong các câu sau:","o":["Hoàn cảnh địa lý là một trong ba yếu tố cấu thành tồn tại xã hội.","Hoàn cảnh địa lý giữ vai trò quan trọng trong sự phát triển xã hội.","Hoàn cảnh địa lý là yếu tố thường xuyên, tất yếu của sự tồn tại và phát triển của xã hội.","Hoàn cảnh địa lý là nhân tố quyết định sự tồn tại và phát triển của xã hội loài người."],"a":3},{"n":1038,"q":"Hãy chỉ ra một nhận thức sai về vấn đề môi trường trong các câu sau:","o":["Vấn đề môi trường phụ thuộc vào trình độ nhận thức của con người.","Vấn đề môi trường phụ thuộc vào năng lực vận dụng các quy luật tự nhiên.","Vấn đề môi trường phụ thuộc vào mật độ dân số.","Vấn đề môi trường không phụ thuộc vào trình độ sản xuất vật chất."],"a":3},{"n":1039,"q":"Hãy chỉ ra một nhận thức sai về vấn đề dân cư trong các câu sau:","o":["Dân cư là điều kiện tất yếu, thường xuyên của sự phát triển xã hội.","Vấn đề dân cư diễn ra theo quy luật tự nhiên, nhưng bị điều chỉnh bởi quy luật xã hội.","Dân cư không giữ vai trò quyết định sự phát triển xã hội.","Vấn đề dân cư không phụ thuộc vào trình độ phát triển xã hội."],"a":3},{"n":1040,"q":"Tìm nhận định sai về giai đoạn nhận thức trực quan sinh động trong các câu sau:","o":["Giai đoạn nhận thức trực quan sinh động là giai đoạn đầu tiên của quá trình nhận thức.","Giai đoạn nhận thức trực quan sinh động là giai đoạn phản ánh trực tiếp khách thể bằng các khái niệm.","Giai đoạn nhận thức trực quan sinh động là giai đoạn nhận thức đối tượng bằng các hình thức: cảm giác, tri giác, biểu tượng.","Giai đoạn nhận thức trực quan sinh động là giai đoạn chưa nhận thức được bản chất, quy luật của sự vật."],"a":1},{"n":1041,"q":"Tìm nhận định sai về tư duy trừu tượng trong các câu sau:","o":["Giai đoạn nhận thức tiếp theo giai đoạn trực quan sinh động.","Giai đoạn nhận thức cao hơn dựa trên cơ sở những tài liệu do trực quan sinh động đem lại.","Giai đoạn phản ánh gián tiếp hiện thực nên có nguy cơ phản ánh sai lệch hiện thực.","Giai đoạn nhận thức bằng cảm giác, tri giác và suy luận."],"a":3},{"n":1042,"q":"Tìm câu giải thích chưa chính xác về Nguyên tắc Toàn diện trong các câu sau:","o":["Nguyên tắc này đòi hỏi khi nhận thức sự vật phải xem xét tất cả các mặt, các mối liên hệ của nó.","Cơ sở lý luận của nguyên tắc này là Nguyên lý về mối liên hệ phổ biến.","Phải xem xét sự vật trong tính toàn vẹn và phức tạp của nó.","Căn cứ của nguyên tắc này là tư duy của con người ở mỗi thời điểm đều có thể bao quát được hết mọi mặt phong phú của sự vật."],"a":3},{"n":1043,"q":"Tìm câu giải thích sai về Nguyên tắc Phát triển:","o":["Cơ sở lý luận của nguyên tắc này là nguyên lý về sự phát triển.","Theo nguyên tắc này, cần vận dụng quy luật Lượng-chất để hiểu được cách thức phát triển của sự vật.","Theo nguyên tắc này cần phân đôi cái thống nhất và nhận thức các bộ phận đối lập của nó để hiểu được nguồn gốc và động lực phát triển của sự vật.","Theo nguyên tắc này ta chỉ cần liệt kê các giai đoạn vận động lịch sử mà sự vật đã trải qua là hiểu được thực chất sự phát triển của sự vật."],"a":3},{"n":1044,"q":"Tìm câu trả lời sai về phạm trù Kiến trúc thượng tầng:","o":["Sự hình thành và phát triển của Kiến trúc thượng tầng là do cơ sở hạ tầng quyết định.","Đồng thời Kiến trúc thượng tầng còn có quan hệ kế thừa đối với một số yếu tố của kiến trúc thượng tầng của xã hội cũ.","Bất cứ sự biến đổi nào trong Kiến trúc thượng tầng cũng chỉ do nguyên nhân kinh tế.","Bản thân những yếu tố trong Kiến trúc thượng tầng cũng tác động lẫn nhau, gây ra những biến đổi nhất định của những yếu tố đó."],"a":2},{"n":1045,"q":"Tìm câu trả lời sai về vai trò của Cơ sở hạ tầng đối với Kiến trúc thượng tầng:","o":["Cơ sở hạ tầng nào thì sinh ra Kiến trúc thượng tầng ấy.","Những biến đổi căn bản trong Cơ sở hạ tầng sớm hay muộn cũng sẽ dẫn tới sự biến đổi căn bản trong Kiến trúc thượng tầng.","Cơ sở hạ tầng cũ mất đi thì Kiến trúc thượng tầng tương ứng với nó sẽ mất theo ngay tức khắc.","Cũng có những yếu tố thuộc Kiến trúc thượng tầng cũ tồn tại dai dẳng sau khi Cơ sở kinh tế sinh ra nó không tồn tại."],"a":2},{"n":1046,"q":"Xác định quan niệm sai về Phủ định biện chứng trong các câu sau:","o":["Là phủ định có tính kế thừa.","Là phủ định đồng thời cũng là sự khẳng định.","Là phủ định chấm dứt quá trình phát triển.","Là phủ định có tính khách quan, phổ biến"],"a":2},{"n":1047,"q":"Xác định quan niệm sai về mối quan hệ giữa Cái Chung với Cái Riêng trong các câu sau:","o":["Cái Chung chỉ tồn tại trong Cái Riêng, thông qua Cái Riêng mà biểu hiện sự tồn tại của mình.","Quan hệ giữa Cái Chung và Cái Riêng là quan hệ có tính chủ quan.","Quan hệ giữa Cái Chung và Cái Riêng là có tính phổ biến.","Cái Riêng là cái toàn bộ, phong phú hơn Cái chung, Cái chung là cái bộ phận, nhưng sâu sắc hơn Cái riêng."],"a":1},{"n":1048,"q":"Xác định quan niệm sai về mối quan hệ giữa Cái Chung với Cái Riêng trong các câu sau:","o":["Cái Chung chỉ tồn tại trong Cái Riêng, thông qua Cái Riêng mà biểu hiện sự tồn tại của mình.","Quan hệ giữa Cái Chung và Cái Riêng là quan hệ có tính chủ quan.","Quan hệ giữa Cái Chung và Cái Riêng là có tính phổ biến.","Cái Riêng là cái toàn bộ, phong phú hơn Cái chung, Cái chung là cái bộ phận, nhưng sâu sắc hơn Cái riêng."],"a":1},{"n":1049,"q":"Chọn câu trả lời đúng trong các câu sau:","o":["Triết học Mác là triết học tách rời giữa lý luận và thực tiễn.","Triết học Mác là triết học thống nhất giữa lý luận và thực tiễn.","Triết học Mác là triết học chỉ coi trọng thực tiễn.","Triết học Mác là triết học chỉ coi trọng lý luận."],"a":1},{"n":1050,"q":"Quan điểm:“Ý thức thật sự chỉ có tác dụng khi nó thông qua hoạt động thực tiễn của con người” thuộc về lập trường triết học nào dưới đây:","o":["Triết học Mác là triết học tách rời giữa lý luận và thực tiễn.","Triết học Mác là triết học thống nhất giữa lý luận và thực tiễn.","Triết học Mác là triết học chỉ coi trọng thực tiễn.","Triết học Mác là triết học chỉ coi trọng lý luận."],"a":1},{"n":1051,"q":"Quan điểm “Không có lý luận thì hoạt động thực tiễn của con người mò mẫm mất phương hướng. Lý luận không phục vụ cho thực tiễn, trở thành lý luận suông, giáo điều” thuộc lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật biện chứng.","Chủ nghĩa Duy vật siêu hình.","Nhị nguyên luận.","Chủ nghĩa Duy tâm khách quan."],"a":0},{"n":1052,"q":"Quan điểm “Tính năng động chủ quan của ý thức con người muốn phát huy có hiệu quả bao giờ cũng phải dựa trên cơ sở vật chất” thuộc lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật biện chứng.","Chủ nghĩa Duy vật siêu hình.","Chủ nghĩa Duy tâm chủ quan.","Nhị nguyên luận."],"a":0},{"n":1053,"q":"Quan điểm “Mọi tri thức, dù trực tiếp hay gián tiếp, dù ở trình độ cao hay thấp, xét đến cùng đều dựa trên cơ sở thực tiễn” thuộc lập trường triết học nào:","o":["Chủ nghĩa Duy vật biện chứng.","Chủ nghĩa Duy vật siêu hình.","Nhị nguyên luận.","Chủ nghĩa Duy tâm chủ quan."],"a":0},{"n":1054,"q":"Quan điểm “Thực tiễn là tiêu chuẩn của chân lý” thuộc lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật biện chứng.","Chủ nghĩa Duy vật siêu hình.","Chủ nghĩa Duy vật tầm thường.","Chủ nghĩa Duy tâm chủ quan."],"a":0},{"n":1055,"q":"Luận điểm “Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà là ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào” thuộc lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật lịch sử.","Chủ nghĩa Duy vật tầm thường.","Thuyết không thể biết.","Chủ nghĩa Duy tâm lịch sử."],"a":0},{"n":1056,"q":"Điền đáp án đúng vào chỗ trống câu sau: “Phương thức sản xuất đời sống vật chất toàn bộ q sống tinh thần của xã hội”:","o":["thúc đẩy.","chi phối.","phụ thuộc.","liên quan."],"a":1},{"n":1057,"q":"Hãy chỉ ra một yếu tố viết thừa và không đúng về Tồn tại xã hội:","o":["Hoàn cảnh tự nhiên.","Văn hoá phi vật thể","Dân cư.","Phương thức sản xuất."],"a":1},{"n":1058,"q":"Hãy chỉ ra một yếu tố viết thừa trong kết cấu của Lực lượng sản xuất vật chất:","o":["Tư liệu lao động.","Đối tượng lao động.","Người lao động.","Công cụ lao động"],"a":1},{"n":1059,"q":"Điền đáp án đúng vào chỗ trống câu sau: “Theo quan điểm duy vật lịch sử, nhân tố đời sống hiện thực”:","o":["thứ yếu.","chủ yếu.","quan trọng","quyết định. trong lịch"],"a":3},{"n":1060,"q":"Điền đáp án đúng vào chỗ trống câu sau: “Quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất là quy luật......... của sự phát triển xã hội”:","o":["đặc thù.","tạm thời.",".riêng biệt.","chung nhất."],"a":3},{"n":1061,"q":"Quan niệm “Sự thay thế phương thức sản xuất đã lỗi thời bằng phương thức sản xuất tiến bộ hơn, đó là cách mạng xã hội” thuộc lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật lịch sử.","Chủ nghĩa Duy tâm lịch sử.","Chủ nghĩa Duy vật tầm thường.","Chủ nghĩa Duy vật siêu hình."],"a":0},{"n":1062,"q":"Luận điểm “Ý thức xã hội là sự phản ánh tích cực, năng động, sáng tạo tồn tại xã hội” thể hiện lập trường triết học nào dưới đây:","o":["Chủ nghĩa Duy vật lịch sử.","Chủ nghĩa Duy vật tầm thường.","Chủ nghĩa Duy tâm chủ quan.","Chủ nghĩa Duy tâm khách quan."],"a":0},{"n":1063,"q":"Quan điểm “Ý thức xã hội là cái phản ánh tồn tại xã hội, vì vậy nó không có vai trò gì đối với tồn tại xã hội” biểu hiện lập trường triết học nào dưới đây:","o":["Nhị nguyên luận.","Chủ nghĩa Duy vật lịch sử.","Chủ nghĩa Duy vật siêu hình.","Chủ nghĩa Duy tâm lịch sử."],"a":2},{"n":1064,"q":"Hãy xác định câu trả lời đúng theo quan điểm Chủ nghĩa duy vật biên chứng về vai trò của Ý thức:","o":["Ý thức tự nó chỉ làm thay đổi tư tưởng. Như vậy ý thức hoàn toàn không có tác dụng gì đối với thực tiễn.","Ý thức là phản ánh năng động, sáng tạo thực tại khách quan và đồng thời có tác động trở lại mạnh mẽ thực tại đó thông qua hoạt động thực tiễn của con người.","Ý thức là cái phụ thuộc vào nguồn gốc sinh ra nó. Vì thế chỉ có vật chất mới là cái năng động, tích cực.","Ý thức là cái quyết định vật chất . Vật chất chỉ là cái thụ động."],"a":1},{"n":1065,"q":"Hãy xác định câu trả lời theo quan điểm siêu hình về Mối liên hệ giữa các sự vật , hiện tượng trong thế giới hiện thực khách quan:","o":["Là sự tác động lẫn nhau, chi phối chuyển hoá lẫn nhau một cách khách quan, phổ biến, nhiều vẻ giữa các mặt, quá trình của sự vật, hiện tượng, hoặc giữa các sự vật, hiện tượng.","Là sự thừa nhận rằng giữa các mặt của sự vật, hiện tượng và giữa các sự vật với nhau trong thực tế khách quan không có mối liên hệ nào cả.","Quan điểm cho rằng ngoài tính khách quan, tính phổ biến của mối liên hệ còn có quan điểm về tính phong phú của mối liên hệ.","Là sự tác động lẫn nhau, có tính khách quan, phổ biến, nhiều vẻ, có thể chuyển hoá cho nhau."],"a":1},{"n":1066,"q":"Hãy xác định câu trả lời theo quan điểm siêu hình về Sự phát triển:","o":["Sự phát triển là xu hướng vận động làm nảy sinh cái mới","Sự phát triển là xu hướng thống trị của thế giới, tiến lên từ đơn giản đến phức tạp, từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn theo những quy luật nhất định","Sự phát triển là xu hướng vận động tiến lên từ thấp đến cao, từ đơn giản đến phức tạp, từ kém hoàn thiện đến hoàn thiện hơn của các sự vật hiện tượng","Sự phát triển là xu hướng vận động làm cho sự vật, hiện tượng tăng lên chỉ về khối lượng, thể tích, quy mô, trọng lượng, kích thước"],"a":3},{"n":1067,"q":"Hãy xác định câu trả lời theo quan điểm siêu hình về ý nghĩa phương pháp luận của Mối quan hệ biện chứng giữa Bản chất và Hiện tượng:","o":["Hiện tượng thường làm sai lệch bản chất nên cần thận trọng trong nghiên cứu những biểu hiện bên ngoài của sự vật.","Phương pháp nhận thức đúng là đi từ hiện tượng đến bản chất, đi từ bản chất ít sâu sắc đến bản chất sâu sắc hơn, không nhầm lẫn hiện tượng với bản chất.","Để nghiên cứu bản chất của sự vật cần nghiên cứu toàn diện các hiện tượng của nó.","Muốn nhận thức đúng bản chất, con người đi thẳng vào tìm hiểu và nắm lấy bản chất sẽ tránh được sai lầm."],"a":3},{"n":1068,"q":"Hãy chỉ ra luận điểm sai về ý nghĩa phương pháp luận của mối quan hệ giữa Nội dung và Hình thức:","o":["Trong nhận thức và hành động không được tách rời hoặc tuyệt đối hoá một mặt nội dung hay hình thức.","Trong nhận thức và hành động không được tách rời, tuyệt đối hoá một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của hình thức đồng thời coi trọng nội dung.","Trong nhận thức và hành động không được tách rời, tuyệt đối hoá một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của nội dung, nhưng phải chú trọng tới hình thức.","Trong nhận thức và hành động không được tuyệt đối hoá một mặt nội dung hay hình thức."],"a":1},{"n":1069,"q":"Luận điểm nào dưới đây là luận điểm Siêu hình về quan hệ giữa Nguyên nhân và Kết quả:","o":["Trong những điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại, nguyên nhân và kết quả có thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân chỉ sinh ra một kết quả và ngược lại, nguyên nhân và kết quả không thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có sau kết quả. Một nguyên nhân có thể sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hoá cho nhau trong quá trình vận động."],"a":1},{"n":1070,"q":"Luận điểm nào dưới đây là luận điểm Duy tâm về quan hệ Nguyên nhân – Kết quả:","o":["Để có kết quả theo mong muốn phải biết phát hiện và điều khiển các nguyên nhân, khắc phục những nguyên nhân ngược chiều, tạo điều kiện cho nguyên nhân cùng chiều hướng tới kết quả.","Trong quá trình vận động, phát triển, nguyên nhân và kết quả có thể đổi chỗ, chuyển hóa cho nhau.","Quan hệ nhân quả là quan hệ do chủ quan của con người tạo ra cho nên trong nhận thức và hành động con người chắc chắn nhận được kết quả do mình tạo ra.","Nguyên nhân có trước kết quả vì thế cứ chờ đợi thì sớm hay muộn kết quả sẽ tới."],"a":2},{"n":1071,"q":"Luận điểm nào dưới đây là luận điểm Bất khả tri về mối quan hệ giữa cái Tất nhiên và Ngẫu nhiên:","o":["Thông qua nghiên cứu nhiều cái ngẫu nhiên để phát hiện cái tất nhiên. Nắm lấy cái tất nhiên để hành động đồng thời dự phòng xử lý kịp thời với cái ngẫu nhiên.","Mục đích của nhận thức và hành động là đạt tới cái tất nhiên để có tự do. Nhưng cái tất nhiên tồn tại như vật tự nó nên con người chỉ có thể nắm được cái ngẫu nhiên","Nắm lấy cái tất nhiên, chi phối, điều khiển, phòng ngừa cái ngẫu nhiên. Đó là mục đích của nhận thức và hành động của con người trong khi giải quyết mối quan hệ giữa tất nhiên và ngẫu nhiên.","Nắm lấy cái tất nhiên để chi phối, điều khiển, phòng ngừa mặt tác hại của ngẫu nhiên. Đó là mục đích của nhận thức và hành động không phải bằng cách đi từ phân tích ngẫu nhiên mà đi thẳng vào cái tất nhiên."],"a":1},{"n":1072,"q":"Tìm câu trả lời theo quan điểm Duy tâm về Thực tiễn trong các câu dưới đây:","o":["Là toàn bộ những hoạt động có tính vật chất, tính mục đích, tính xã hội - lịch sử của con người làm biến đổi tự nhiên, xã hội theo hướng tích cực, tiến bộ, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính xã hội- lịch sử làm biến đổi tự nhiên, xã hội theo hướng tích cực, tiến bộ, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính vật chất, làm biến đổi tự nhiên-xã hội theo hướng tích cực, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính vật chất, tính lịch sử - xã hội, trong đó sản xuất tinh thần là thực tiễn cơ bản nhất."],"a":3},{"n":1073,"q":"Vận dụng quan điểm Duy vật biện chứng để tìm câu trả lời đúng nhất trong các câu dưới đây:","o":["Do vật chất quyết định ý thức nên chỉ cần tăng lương cho người lao động là họ sẽ hăng hái sản xuất ra nhiều sản phẩm tốt.","Do vai trò tác động tích cực của ý thức nên chỉ cần thường xuyên giáo dục ý thức, tư tưởng cho người lao động là họ sẽ tự giác hăng hái sản xuất ra nhiều sản phẩm tốt.","Vì vật chất và ý thức có quan hệ biện chứng nên đối với người lao động phải vừa khuyến khích vật chất vừa giáo dục chính trị tư tưởng.","Vì chân lý là cụ thể nên phải tuỳ hoàn cảnh, tuỳ đối tượng cụ thể mà tăng thêm khuyến khích vật chất hoặc tăng cường giáo dục chính trị tư tưởng."],"a":3},{"n":1074,"q":"Chọn luận điểm đúng nhất trong các luận điểm sau:","o":["Đặc điểm quan trọng nhất của quy luật phủ định của phủ định là phủ định hai lần","Đặc điểm quan trọng nhất của quy luật phủ định của phủ định là sự phát triển do mâu thuẫn bên trong.","Đặc điểm quan trọng nhất của quy luật phủ định của phủ định là phát triển theo chu kỳ.","Đặc điểm quan trọng nhất của quy luật phủ định của phủ định là tính kế thừa, tính lặp lại và tính chất tiến lên của sự phát triển."],"a":3},{"n":1075,"q":"Câu nào dưới đây đúng và có nội dung đầy đủ nhất về nội dung quy luật Phủ định của phủ định:","o":["Phủ định của phủ định là sự lặp lại hoàn toàn cái ban đầu.","Phủ định của phủ định là sự tổng hợp biện chứng của cái khẳng định ban đầu và cái phủ định lần thứ nhất.","Phủ định của phủ định là sự phủ định trong đó sự xuất hiện cái mới như là kết quả tổng hợp của những yếu tố tích cực trong cái khẳng định ban đầu và trong cái phủ định lần thứ nhất.","Phủ định của phủ định là sự phủ định trong đó sự xuất hiện cái mới có nội dung toàn diện, phong phú và cao hơn cái khẳng định ban đầu và cái phủ định lần thứ nhất."],"a":3},{"n":1076,"q":"Câu nào dưới đây trả lời đúng, đầy đủ nhất về Vận động:","o":["Là phương thức tồn tại, thuộc tính cố hữu của vật chất, bao gồm tất cả mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, kể từ sự thay đổi vị trí đơn giản cho đến tư duy.","Là phương thức tồn tại của vật chất, bao gồm tất cả mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ, kể từ sự thay đổi vị trí đơn giản đến vận động tư duy.","Là phương thức tồn tại, thuộc tính cố hữu của vật chất bao gồm mọi sự thay đổi và mọi quá trình diễn ra trong hành tinh của chúng ta kể từ sự thay đổi vị trí giản đơn đến tư duy.","Là phương thức tồn tại, thuộc tính cố hữu của vật chất bao gồm mọi sự thay đổi và mọi quá trình diễn ra trong trái đất của chúng ta, kể từ sự thay đổi vị trí giản đơn đến tư duy."],"a":0},{"n":1077,"q":"Câu nào dưới đây trả lời đúng nhất về mối quan hệ biện chứng giữa Đứng im và Vận động của vật chất:","o":["Vận động của vật chất là tuyệt đối, còn sự đứng im là tương đối nhằm bảo đảm các dạng cụ thể của vật chất phân hoá trong tồn tại. Đứng im và vận động là một mâu thuẫn biện chứng.","ừng hình thức vận động của vật chất chỉ tồn tại tương đối với đặc trưng của những dạng vật chất cụ thể, còn sự vận động của vật chất là tuyệt đối nói chung, nó chỉ khác nhau mà không có mâu thuẫn.","Các hình thức vận động chuyển hoá cho nhau từ thấp đến cao và ngược lại gây ra sự đứng im là tương đối, sự vận động là một mâu thuẫn biện chứng.","Sự đứng im tương đối và sự vận động là tuyệt đối của vật chất thể hiện sự phân hoá của vật chất về lượng mà không thay đổi về chất."],"a":0},{"n":1078,"q":"Câu nào dưới đây trả lời đúng nhất về nguồn gốc tự nhiên của Ý thức:","o":["Ý thức con người trực tiếp được hình thành từ quá trình lao động và ngôn ngữ.","Sự hình thành ý thức con người có 2 nguồn gốc tự nhiên và xã hội, trong đó nguồn gốc xã hội là gián tiếp còn nguồn gốc tự nhiên là trực tiếp hình thành.","Ý thức có hai nguồn gốc: tự nhiên và xã hội. Nguồn gốc xã hội chứng tỏ ý thức con người giống động vật cũng có hệ thần kinh trung ương - não người.","Triết học duy tâm chủ quan cho ý thức con người là tổng hợp của các cảm giác."],"a":0},{"n":1079,"q":"Xác định câu trả lời đúng nhất về bản chất của Ý thức trong các câu dưới đây:","o":["Là sản phẩm của một dạng vật chất - đó là não người. Não người sinh ra ý thức cũng như mọi sản phẩm vật chất khác do con người tạo ra.","Là hình ảnh chủ quan của thế giới khách quan.","Triết học duy vật siêu hình giải thích bản chất ý thức là sự phản ánh hiện thực khách quan một cách thụ động hoàn toàn giống cái gương soi.","Là sự phản ánh tích cực, năng động, sáng tạo thế giới khách quan bằng não người."],"a":1},{"n":1080,"q":"Tìm câu trả lời đúng nhất về mối quan hệ giữa Vật chất và Ý thức trong các câu sau:","o":["Giới tự nhiên, xã hội có trước và sinh ra ý thức, còn ý thức có sau và phụ thuộc hoàn toàn vào vật chất.","Ý thức được vật chất sinh ra và quyết định, nhưng sau khi ra đời nó tác động tích cực trở lại vật chất thông qua nhận thức và hoạt động thực tiễn.","Không có con người, không có cảm giác của con người thì mọi cái tồn tại ngoài con người đều trở thành không xác định. Vì thế sự tồn tại con người có trước tất cả và quyết định tất cả.","Thế giới trước hết có cái tinh thần. Nó được triển khai do quá trình phát triển theo các quy luật biện chứng thành thế giới vật chất và con người. Con người trở lại tự nhận thức mình cũng là cái tinh thần có đầu tiên trở lại tự nhận thức mình."],"a":1},{"n":1081,"q":"Tìm câu trả lời đúng nhất về những điều kiện đảm bảo cho Ý thức có tính năng động, sáng tạo trong những câu sau:","o":["Ý thức chỉ phụ thuộc vật chất khi nó sinh ra (nguồn gốc). Còn khi đã hình thành thì nó không còn phụ thuộc vào vật chất nữa, nó có đời sống riêng. Chỉ khi đó ý thức mới phát huy được tính năng động, sáng tạo.","Sự năng động, sáng tạo của ý thức luôn luôn dựa trên những tiền đề vật chất và hoạt động thực tiễn của con người.","Sáng tạo của ý thức không phụ thuộc vào điều kiện vật chất. Nó hoạt động độc lập, năng động, chủ quan.","Ý thức và vật chất có vai trò ngang nhau, chúng tự thân vận động theo quy luật riêng của chúng."],"a":1},{"n":1082,"q":"Tìm câu trả lời đúng nhất về mối quan hệ biện chứng giữa Lượng và Chất của sự vật trong các câu sau:","o":["Sự vật nào cũng có sự thống nhất giữa lượng và chất. Chất và lượng có mâu thuẫn. Sự biến đổi về lượng tích luỹ lại dẫn đến sự biến đổi về chất. Sự biến đổi căn bản về chất tạo ra bước nhảy và chuyển sự vật cũ sang sự vật mới.","Sự biến đổi về chất và lượng không phải mâu thuẫn. Chỉ có sự khác nhau là lượng biến đổi nhanh hơn chất. Bước nhảy chỉ xảy ra khi chất biến đổi căn bản.","Sự biến đổi về chất nhanh hơn biến đổi về lượng mới tạo ra bước thay đổi căn bản về chất. Chất cũ mất đi, sự vật cũ bị phá vỡ, sự vật mới sinh ra.","Chỉ có sự thay đổi từ lượng đến chất là theo xu hướng tiến lên. Còn sự thay đổi từ chất đến lượng là không thể diễn ra."],"a":0},{"n":1083,"q":"Tìm câu trả lời đúng nhất về nội dung quy luật Phủ định của phủ định trong các câu sau:","o":["Là phủ định lần thứ hai, vừa phủ định lại vừa khẳng định lần phủ định thứ nhất, làm cho sự vận động diễn ra theo đường xoáy ốc, sự vật hình như lặp lại cái cũ nhưng trên cơ sở cao hơn.","Là sự phát triển cao hơn, có hình thức đa dạng, phong phú theo đường thẳng, đường xoáy ốc hay đường sin.","Là vừa phủ định và phủ nhận mang nhiều hình thức phong phú, nhiều vẻ như đường tròn, đường xoáy ốc hoặc đường thẳng theo xu hướng tiến lên đến vô cùng.","Là sự khẳng định có tính kế thừa làm cho hình thức phủ định qua nhiều giai đoạn phong phú và được lặp lại theo đường tròn khép kín, đường dích dắc, đường xoáy ốc."],"a":0},{"n":1084,"q":"Tìm câu trả lời đúng nhất theo quan điểm mác-xít về những nguyên tắc cơ bản của Lý luận nhận thức trong các câu sau:","o":["Là sự thừa nhận thế giới khách quan tồn tại độc lập với ý thức, có khả năng phản ánh đúng thế giới khách quan vào ý thức con người, là quá trình biện chứng và cơ sở chủ yếu, trực tiếp nhất của nhận thức là thực tiễn.","Là sự thừa nhận thế giới khách quan tồn tại độc lập ngoài ý thức con người, là khả năng nhận thức của con người, đối với con người có nhiều điều không thể biết.","Là quá trình biện chứng, thừa nhận đối tượng nhận thức là khách quan, khả năng nhận thức của con người là có hạn.?","Là thừa nhận đối tượng nhận thức tồn tại khách quan, chủ thể nhận thức là con người có thể nhận thức đúng, quá trình nhận thức diễn ra trực tiếp một lần là hoàn thiện."],"a":0},{"n":1085,"q":"Tìm câu trả lời đúng nhất về khả năng nhận thức thế giới hiện thực khách quan của con người trong các câu sau:","o":["Con người có khả năng nhận thức thế giới hiện thực khách quan, đối với con người không có điều gì là không thể biết, mà chỉ có cái chưa biết. Sự hiểu biết là một quá trình tuân theo các quy luật biện chứng như mâu thuẫn, lượng chất, phủ định của phủ định và những quy luật khác của tư duy.","Con người có khả năng nhận thức thế giới hiện thực khách quan, đối với con người không phải là cái gì cũng biết mà có những cái không thể biết. Sự hiểu biết của con người là quá trình cộng dần những hiểu biết có hạn lại thành cái vô hạn.","Con người có khả năng nhận thức thế giới hiện thực khách quan, đối với con người không có gì là không thể biết chỉ có những cái chưa biết. Sự hiểu biết đó diễn ra bằng con đường tích luỹ dần của từng người cộng lại nhiều lần tạo thành.","Con người không có khả năng nhận thức thế giới hiện thực khách quan, đối với con người có phần nhận thức đúng, có phần không thể hiểu biết đúng được thế giới. Vì thế giới là mênh mông vô hạn. Còn mỗi con người chỉ là có hạn mà thôi."],"a":0},{"n":1086,"q":"Câu nào dưới đây trả lời đúng nhất về những tính chất của Chân lý:","o":["Chân lý có tính cụ thể, có nội dung khách quan, vừa có tính tuyệt đối, vừa có tính tương đối.","Không có chân lý trừu tượng, chân lý có hình thức chủ quan, nội dung khách quan, không có tính tương đối vì chân lý luôn luôn đúng trong mọi hoàn cảnh.","Chân lý có nội dung khách quan, hình thức chủ quan, chân lý có tính trừu tượng cao siêu, chân lý còn có tính tuyệt đối và tính tương đối.","Chân lý có hình thức chủ quan và nội dung khách quan, chân lý bao giờ cũng cụ thể, chỉ có chân lý tương đối, không có chân lý tuyệt đối vì thực tiễn luôn luôn biến đổi và nhận thức con người là có hạn."],"a":0},{"n":1087,"q":"Tìm câu trả lời đúng nhất về ý nghĩa phương pháp luận của quy luật Phủ định của phủ định trong các câu sau:","o":["Phủ định của phủ định là quá trình cái cũ mất đi, cái mới hợp quy luật ra đời. Cần có thái độ tích cực ủng hộ, giúp đỡ, bảo vệ cái mới và kiên quyết từ bỏ cái cũ lỗi thời. Cái mới ra đời thường gặp nhiều khó khăn, trở ngại.","Phủ định của phủ định là quá trình cái mới ra đời. Cần có thái độ giúp đỡ, ủng hộ, bảo vệ cái mới. Vì khi nó ra đời thường gặp nhiều khó khăn.","Phủ định của phủ định là làm cho cái cũ mất đi, cái mới ra đời phù hợp quy luật. Cần phải xây dựng thái độ ủng hộ, giúp đỡ, phê phán cái mới.","Phủ định của phủ định là quá trình cái cũ mất đi, cái mới ra đời hợp quy luật. Cần có nhận thức đúng về vai trò tích cực, tiến bộ của cái mới."],"a":0},{"n":1088,"q":"Tìm câu trả lời đúng nhất về quan hệ biện chứng giữa Lượng và Chất trong các câu sau:","o":["Lượng- chất có quan hệ biện chứng. Phải kiên trì tích luỹ về lượng mới có sự thay đổi về chất, tạo ra bước ngoặt. Không được nóng vội, chủ quan, duy ý chí, đốt cháy giai đoạn. Ngược lại, chỉ có thay đổi căn bản về chất mới chuyển được cái cũ sang cái mới.","Lượng- chất có quan hệ biện chứng. Không được nóng vội, chủ quan, duy ý chí khi chưa tích luỹ được lượng cần thiết. Nhưng đôi khi chưa tích luỹ đủ lượng cũng phải thay đổi về chất.","Lượng- chất có quan hệ biện chứng. Không được nóng vội, chủ quan, duy ý chí khi lượng đã được tích luỹ đầy đủ.","Phải kiên quyết, không chần chừ, do dự, thay đổi về chất khi lượng đã được tích luỹ đủ."],"a":0},{"n":1089,"q":"Xác định quan niệm siêu hình về Chân lý trong các câu sau:","o":["Nội dung chân lý có tính khách quan, còn hình thức biểu hiện chân lý thì mang tính chủ quan.","Chân lý bao giờ cũng cụ thể, không có chân lý trừu tượng.","Chân lý không bao giờ chuyển hoá thành sai lầm.","Chân lý là kiến thức đúng đắn được thực tiễn kiểm nghiệm."],"a":2},{"n":1090,"q":"Hãy xác định nhận định về chủ trương có tính Duy tâm chủ quan trong các nhận định sau:","o":["Đại hội VIII năm 1996 nhận định: Nhiệm vụ chuẩn bị các tiền đề cho công nghiệp hoá đã cơ bản hoàn thành, cho phép chuyển sang thời kì mới đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước.","Đại hội IX năm 2001 chủ trương: trước hết phải phát triển mạnh lực lượng sản xuất, rồi tuỳ theo trình độ phát triển của lực lượng sản xuất mà quan hệ sản xuất từng bước được cải tiến theo cho phù hợp.","Trong điều kiện lực lượng sản xuất phát triển không đồng đều như ở nước ta hiện nay, chúng ta chủ trương thực hiện nhiều loại hình sở hữu, do đó tồn tại nhiều thành phần kinh tế.","Trong 5 năm (1976- 1980) khi bố trí cơ cấu kinh tế, các nhà lãnh đạo nước ta thường xuất phát từ lòng mong muốn đi nhanh, không tính tới điều kiện và khả năng thực tế của đất nước."],"a":3},{"n":1091,"q":"Hãy xác định đáp án đúng về cấu trúc của cơ sở hạ tầng trong các đáp án sau:","o":["Bao gồm quan hệ sản xuất thống trị, quan hệ sản xuất tàn dư, quan hệ sản xuất mầm mống. Trong đó quan hệ sản xuất thống trị là đặc trưng cho cơ sở hạ tầng của xã hội đó.","Bao gồm quan hệ sản xuất thống trị, quan hệ sản xuất tàn dư, quan hệ sản xuất mầm mống. Trong đó quan hệ sản xuất mầm mống đặc trưng cho cơ sở hạ tầng của xã hội đó.","Bao gồm lực lượng sản xuất, quan hệ sản xuất và hoàn cảnh địa lý tự nhiên","Bao gồm hệ thống điện, đường, trường, trạm"],"a":0},{"n":1092,"q":"Luận điểm: “Cơ sở kinh tế thay đổi thì toàn bộ cái kiến trúc thượng tầng đồ sộ cũng bị đảo lộn ít nhiều nhanh chóng” thuộc lập trường triết học nào?","o":["Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy vật tầm thường","Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy tâm chủ quan"],"a":0},{"n":1093,"q":"Xác định lập trường duy vật lịch sử về mối quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng trong các đáp án sau:","o":["Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học cho việc nhận thức một cách đúng đắn mối quan hệ giữa văn hóa và xã hội.","Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học cho việc nhận thức một cách đúng đắn mối quan hệ giữa kinh tế và chính trị.","Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học cho việc nhận thức một cách đúng đắn mối quan hệ giữa tôn giáo và nghệ thuật.","Quy luật về mối quan hệ biện chứng giữa cơ sở hạ tầng và kiến trúc thượng tầng là cơ sở khoa học cho việc nhận thức một cách đúng đắn mối quan hệ giữa đạo đức và pháp quyền."],"a":1},{"n":1094,"q":"Tìm luận điểm viết sai về đặc trưng cơ bản của giai cấp trong các luận điểm sau:","o":["Giai cấp là những tập đoàn người có địa vị kinh tế - xã hội khác nhau trong một hệ thống sản xuất xã hội nhất định trong lịch sử.","Dấu hiệu chủ yếu quy đinh địa vị kinh tế-xã hội của các giai cấp là các mối quan hệ kinh tế - vật chất giữa các tập đoàn người trong phương thức sản xuất.","Thực chất của quan hệ giai cấp là quan hệ giữa bóc lột và bị bóc lột, là tập đoàn người này chiếm đoạt lao động của tập đoàn người khác do đối lập về địa vị trong một chế độ kinh tế - xã hội nhất định.","Giai cấp là những tập đoàn người có địa vị văn hóa - xã hội khác nhau trong một hệ thống sản xuất xã hội nhất định trong lịch sử."],"a":3},{"n":1095,"q":"Tìm đáp án thiếu chính xác về đặc trưng của dân tộc trong các đáp án sau:","o":["Dân tộc là một cộng đồng người ổn định trên một lãnh thổ thống nhất.","Dân tộc là một cộng đồng thống nhất về ngôn ngữ.","Dân tộc là một cộng đồng thống nhất về kinh tế.","Dân tộc là một cộng đồng bền vững về tình cảm, lối sống"],"a":3},{"n":1096,"q":"Luận điểm:“Sự phát triển của chính trị, pháp luật, triết học, tôn giáo, văn học, nghệ thuật, v.v. đều dựa trên cơ sở phát triển kinh tế. Nhưng tất cả chúng cũng có ảnh hưởng lẫn nhau và ảnh hưởng đến cơ sở kinh tế” thuộc lập trường triết học nào?","o":["Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy kinh tế"],"a":0},{"n":1097,"q":"Phát hiện đáp án sai về con người theo quan điểm của chủ nghĩa Mác Lênin?","o":["Con người là thực thể sinh học - xã hội","Con người là sản phẩm của lịch sử và của chính bản thân con người","Con người vừa là chủ thể của lịch sử, vừa là sản phẩm của lịch sử","Con người là sản phẩm của thượng đế"],"a":3},{"n":1098,"q":"Phát hiện đáp án sai về sự phát triển?","o":["Phát triển là quá trình vận động từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn, từ chất cũ đến chất mới ở trình độ cao hơn.","Phát triển là sự tăng lên hoặc giảm đi về mặt lượng, chỉ l
