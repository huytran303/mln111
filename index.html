<script>
const Q = [{"n":1,"q":"Triết học có chức năng cơ bản nào?","o":["Chức năng thế giới quan","Chức năng phương pháp luận chung nhất.","Cả a và b","Không có câu trả lời đúng"],"a":2},{"n":2,"q":"Nguồn gốc của chủ nghĩa duy tâm?","o":["Do hạn chế của nhận thức con người về thế giới.","Sự phân chia giai cấp và sự tách rời đối lập giữa lao động trí óc và lao động chân tay trong xã hội có giai cấp đối kháng","Cả a và b","Khác"],"a":2},{"n":3,"q":"Trong xã hội có giai cấp, triết học:","o":["Cũng có tính giai cấp.","Không có tính giai cấp.","Chỉ triết học phương tây mới có tính giai cấp.","Tùy từng học thuyết cụ thể."],"a":0},{"n":4,"q":"Chọn luận điểm thể hiện lập trường triết học duy tâm lịch sử.","o":["Quan hệ sản xuất mang tính chất vật chất.","Yếu tố kinh tề quyết định lịch sử.","Sự vận đồng, phát triển của xã hội, suy cho đến cùng là do tư tưởng của con người quyết định.","Kiến trúc thượng tầng chỉ đóng vai trò thụ động trong lịch sử."],"a":2},{"n":5,"q":"Nhận định sau đây thuộc lập trường triết học nào? “Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử.”","o":["Chủ nghĩa duy vậy biện chứng.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật tầm thường."],"a":3},{"n":6,"q":"Phép biện chứng cổ đại là:","o":["Biện chứng duy tâm.","Biện chứng ngây thơ, chất phác.","Biện chứng duy vật khoa học.","Biện chứng chủ quan."],"a":1},{"n":7,"q":"Phép biện chứng của triết học Hêghen là:","o":["Phép biện chứng duy tâm chủ quan.","Phép biện chứng duy vật hiện đại.","Phép biện chứng ngây thơ chất phác.","Phép biện chứng duy tâm khách quan."],"a":3},{"n":8,"q":"Vận động của tự nhiên và lịch sử là sự tha hóa từ sự tự vận động của ý niệm tuyệt đối. Quan niệm trên thuộc lập trường triết học nào?","o":["Chủ nghĩa duy vật.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa nhị nguyên triết học."],"a":2},{"n":9,"q":"Chọn cụm từ đúng để điền vào chỗ trống: “Điểm xuất phát của ……… là: sự khẳng định những sự vật và hiện tượng của tự nhiên đều bao gồm những mâu thuẫn vốn có của chúng”.","o":["Phép siêu hình.","Phép biện chứng.","Phép biện chứng duy tâm.","Phép biện chứng duy vật."],"a":1},{"n":10,"q":"Chọn cụm từ đúng điền vào chỗ trống: “Phép siêu hình đẩy lùi được ……… nhưng chính nó lại bị phép biện chứng hiện đại phủ định”.","o":["Phép biện chứng duy tâm.","Phép biện chứng cổ đại.","Chủ nghĩa duy tâm.","Chủ nghĩa duy vật."],"a":1},{"n":11,"q":"“Tất cả cái gì đang vận động, đều vận động nhờ một cái khác nào đó”. Nhận định này gắn liện với hệ thồng triết học nào? Hãy chọn phương án sai.","o":["Triết học duy vật.","Triết học duy tâm.","Triết học duy tâm khách quan.","Triết học duy tâm chủ quan."],"a":0},{"n":12,"q":"Nên gắn ý kiến: “Nguyên nhân cao hơn, hoàn thiện hơn với kết quả của nó” với lập trường triết học nào?","o":["Triết học duy tâm chủ quan.","Triết học duy tâm khách quan.","Triết học duy vật.","Khác."],"a":1},{"n":13,"q":"Hãy chọn luận điểm quan trọng để bác lại thế giới quan tôn giáo.","o":["Nguyên nhân ngang bằng với kết quả của nó.","Nguyên nhân cao hơn, hoàn thiện hơn kết quả của nó.","Khác."],"a":0},{"n":14,"q":"Chọn nhận định theo quan điểm siêu hình.","o":["Cái chung tồn tại một cách độc lập, không phụ thuộc vào cái riêng.","Cái chung không tồn tại một cách thực sự, trong hiện thực chỉ có cách sự vật đơn thuần nhất là tồn tại.","Cái chung chỉ tồn tại trong danh nghĩa do chủ thể đang nhận thức gắn cho sự vật như một thuật ngữ để biểu thị sự vật.","Khác."],"a":0},{"n":15,"q":"Triết học có chức năng:","o":["Thế giới khác quan.","Phương pháp luận.","Thế giới quan và phương pháp luận.","Khác."],"a":2},{"n":16,"q":"Nội dung cơ bản của thế giới quan bao gồm:","o":["Vũ trụ quan (triết học về giới tự nhiên).","Xã hội quan (triết học về xã hội).","Nhân sinh quan.","Cả A, B, C"],"a":3},{"n":17,"q":"Hạt nhân chủ yếu của thế giới quan là gì?","o":["Các quan điểm xã hội – chính trị.","Các quan điểm triết học.","Các quan điểm mỹ học.","Cả A, B,"],"a":1},{"n":18,"q":"Vấn đề cơ bản trong một thế giới quan cũng là vấn đề cơ bản của triết học:","o":["Đúng.","Sai.","Khác."],"a":1},{"n":19,"q":"Chọn câu trả lời đúng.","o":["Thế giới quan là sự phản ánh của sự tồn tại vật chất và xã hội của con người dưới hình thức các quan niệm, quan điểm chung.","Thế giới quan trực tiếp phụ thuộc vào trình độ hiểu biết của con người đã đạt được trong một giai đoạn lịch sử nhất định.","Thế giới quan phụ thuộc vào chế độ xã hội đang thống trị.","Cả A, B,"],"a":3},{"n":20,"q":"Thế giới quan có ý nghĩa trên những phương diện nào?","o":["Trên phương diện lý luận","Trên phương diện thực tiễn","Cả A và B","Khác."],"a":2},{"n":21,"q":"Thế giới quan khoa học dựa trên lập trường triết học nào?","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khác quan.","Chủ nghĩa duy vật.","Khác."],"a":2},{"n":22,"q":"Triết học bao gồm quan điểm chung nhất, những sự lý giải có luận chứng cho các câu hỏi chung của con người, nên triết học bao gồm toàn bộ tri thức của nhân loại. Kết luận trên ứng với triết học thời kỳ nào? Chọn câu trả lời đúng:","o":["Triết học cổ đại.","Triết học Phục Hưng.","Triết học Trung cổ Tây Âu.","Triết học Mác – Lênin."],"a":0},{"n":23,"q":"“Triết học Mác – Lênin là khoa học của mọi khoa học”.","o":["Đúng.","Sai.","Khác."],"a":1},{"n":24,"q":"Xác định quan điểm duy vật biện chứng trong số luận điểm sau:","o":["Thế giới thống nhất ở tính tồn tại của nó.","Thế giới thống nhất ở nguồn gốc tính thần.","Thế giới thống nhất ở tính vật chất.","Thế giới thống nhất ở sự suy nghĩ về nó như là cái thống nhất."],"a":2},{"n":25,"q":"Việc thừa nhận hay không thừa nhận tính thống nhất của thế giới có phải là sự khác nhau căn bản giữa chủ nghĩa duy vật và chủ nghĩa duy tâm hay không?","o":["Có.","Không.","Khác."],"a":1},{"n":26,"q":"Điểm chung trong quan niệm của các nhà triết học duy vật thời kỳ cổ đại về vật chất là:","o":["Đồng nhất vật chất với vật thể cụ thể cảm tính.","Đồng nhất vật chất với thuộc tính phổ biến của vật thể.","Đồng nhất vật chất với nguyên tử.","Đồng nhất vật chất với thực tại khách quan."],"a":0},{"n":27,"q":"Tính đúng đắn trong quan niệm về vật chất của các nhà triết học duy vật thời kỳ cổ đại là:","o":["Xuất phát từ thế giới vật chất để khái quát quan niệm về vật chất.","Xuất phát từ kinh nghiệm thực tiễn.","Xuất phát từ tư duy.","Ý kiến khác."],"a":0},{"n":28,"q":"Khi khoa học tự nhiên phát hiện ra tia X, ra hiện tượng phóng xạ, ra điện tử là một thành phần cấu tạo nên nguyên tử. Theo V.I.Lênin điều đó chứng tỏ gì?","o":["Vật chất không tồn tại thật sự.","Vật chất tiêu tan mất.","Giới hạn hiểu biết trước đây của chúng ta về vật chất mất đi.","Vật chất có tồn tại thực sự nhưng không thể nhận thức được."],"a":2},{"n":29,"q":"Khi nhận thức được (phát hiện được) cấu trúc của nguyên tử thì có làm cho nguyên tử mất đi không?","o":["Có, vì….","Không, vì…"],"a":1},{"n":30,"q":"Theo quan niệm của chủ nghĩa duy vật biến chứng thì chân không có phải là tồn tại vật chất không? Vì sao?","o":["Có","Không"],"a":0},{"n":31,"q":"Theo quan niệm của chủ nghĩa duy vật biện chứng thì vật thể có là vật chất không? Theo nghĩa nào?","o":["Có","Không"],"a":0},{"n":32,"q":"Chủ nghĩa duy vật biện chứng có cho khái niệm vật chất đồng nhất với khái niệm vật thể không?","o":["Có","Không"],"a":1},{"n":33,"q":"Những phát minh của vật lý học cận đại đã bác bỏ khuynh hướng triết học nào?","o":["Duy vật chất phác.","Duy vật siêu hình.","Duy vật biện chứng.","Duy vật chất phác và duy vật siêu hình."],"a":3},{"n":34,"q":"Có thể coi trường và hạt cơ bản là giới hạn cuối cũng của cấu tạo vật chất vật lý được không? Vì sao?","o":["Có","Không"],"a":1},{"n":35,"q":"Khái niệm trung tâm mà V.I.Lênin sử dụng để định nghĩa về vật chất là khái niệm nào?","o":["Phạm trù triết học.","Thực tại khách quan.","Cảm giác.","Phản ánh."],"a":1},{"n":36,"q":"Trong định nghĩa về vật chất của mình, V.I.Lênin cho thuộc tính chung nhất của vật chất là:","o":["Tự vận động.","Cùng tồn tại.","Đều có khả năng phản ánh.","Tồn tại khách quan bên ngoài ý thức, không lệ thuộc vào cảm giác."],"a":3},{"n":37,"q":"Xác định mệnh đề sai:","o":["Vật thể không phải là vật chất.","Vật chất không phải chỉ là một dạng tồn tại là vật thể.","Vật thể là dạng cụ thể của vật chất.","Vật chất tồn tại thông qua những dạng cụ thể của nó."],"a":0},{"n":38,"q":"Xác định mệnh đề đúng theo quan điểm duy vật biện chứng.","o":["Phản điện tử, phản hạt nhân là phi vật chất.","Phản điện tử, phản hạt nhân là thực tại khách quan, là dạng cụ thể của vật chất.","Phản vật chất là sự tưởng tượng thuần túy của các nhà vật lý học.","Phản vật chất không phải là vật chất."],"a":1},{"n":39,"q":"Xác định mệnh đề đúng:","o":["Vận động tồn tại trước rồi sinh ra vật chất.","Vật chất tồn tại rồi mới vận động phát triển.","Không có vận động ngoài vật chất.","Không có vật chất không vận động."],"a":2},{"n":40,"q":"Sai lầm của các các nhà triết học cổ đại trong quan niệm về vật chất:","o":["Đồng nhất vật chất với một số dạng vật thể cụ thể, cảm tính.","Vật chất là tất cả cái tồn tại khách quan.","Vật chất là cái có thể nhận thức được.","Vật chất tự thân vận động."],"a":0},{"n":41,"q":"Hãy chỉ ra sai lầm của các nhà triết học thế kỷ XVII-XVIII trong quan niệm về vật chất.","o":["Đồng nhất vật chất với vật thể.","Đồng nhất vật chất với một số tính chất phổ biến của vật thể.","Vật chất là cái có thể nhận thức được.","Vật chất biểu hiện qua không gian và thời gian."],"a":0},{"n":42,"q":"Tồn tại khách quan là tồn tại như thế nào?","o":["Tồn tại bên ngoài ý thức của con người, không phụ thuộc vào ý thức của con người, độc lập vào ý thức của con người.","Được ý thức của con người phản ánh.","Tồn tại không thể nhận thức được.","Cả A và"],"a":3},{"n":43,"q":"Mệnh đề nào đúng?","o":["Vật chất là cái tồn tại.","Vật chất là cái không tồn tại.","Vật chất là cái tồn tại khách quan."],"a":2},{"n":44,"q":"Hãy sắp xếp các mệnh đề sau cho đúng trật tự logic trong ý nghĩa của định nghĩa vật chất của V.I.Lênin:","o":["(1)-(2)-(3)","(3)-(2)-(1)","(2)-(3)-(1)","(2)-(1)-(3)"],"a":3},{"n":45,"q":"Khi nói vật chất tự thân vận động là muốn nói:","o":["Do kết quả sự tác động lẫn nhau giữa các yếu tố, các bộ phận tạo nên sự vật.","Do nguyên nhân vốn có của vật chất.","Cả A và B"],"a":2},{"n":46,"q":"Bản chất của thế giới là vật chất, thế giới thống nhất ở tính vật chất. Điều đó thể hiện ở chỗ:","o":["Chỉ có một thế giới duy nhất là thế giới vật chất.","Tất cả mọi sự vật, hiện tượng của thế giới chỉ là những hình thức biếu hiện đa dạng của vật chất với những mối liên hệ vật chất và tuân theo quy luật khách quan.","Thế giới vật chất tồn tại vĩnh viễn, vô hạn và vô tận.","Thể hiện ở cả A, B,"],"a":3},{"n":47,"q":"Theo Ph. Angghen, tính thống nhất vật chất của thế giới được chứng minh bởi:","o":["Thực tiễn lịch sử.","Thực tiễn cách mạng.","Sự phát triển lâu dài của khoa học.","Sự phát triển lâu dài và khó khăn của triết học và khoa học tự nhiên."],"a":3},{"n":48,"q":"Trung tâm định nghĩa vật chất của V.I.Lê nin là cụm từ nào?","o":["Thực tại khách quan.","Phạm trù triết học.","Được đem lại cho con người trong cảm giác.","Không lệ thuộc vào cảm giác."],"a":0},{"n":49,"q":"Thuộc tính cơ bản nhất của vật chất nhờ đó phân biệt vật chất với ý thức đả được V.I.Lê nin xác định trong định nghĩa vật chất là thuộc tính:","o":["Tồn tại.","Tồn tại khách quan.","Có thể nhận thức được.","Tính đa dạng."],"a":1},{"n":50,"q":"Về mặt nhận thức luận thì khái niệm vật chất không có ý nghĩa gì khác mà chính là:","o":["Tồn tại khách quan.","Thực tại khách quan tồn tại độc lập với ý thức con người.","Được ý thức con người phản ánh.","Tồn tại thực sự."],"a":1},{"n":51,"q":"Xác định nội dung cơ bản trong định nghĩa của V.I.Lê nin về vật chất:","o":["Thực tại khách quan.","Thực tại khách quan tồn tại độc lập với cảm giác.","Thực tại khách quan – tồn tại độc lập với ý thức và khi tác động đến giác quan con người thì có thể sinh ra cảm giác.","Tồn tại khách quan nhưng không thể nhận biết ra nó vì thực tại đó là một sự trừu tượng của tư duy."],"a":2},{"n":52,"q":"Hạn chế trong quan niệm của các nhà triết học duy vật thời cận đại Tây Âu là ở chỗ:","o":["Coi vận động của vật chất là vận động cơ giới.","Coi vận động là thuộc tính vốn có của vật thể.","Coi vận động là phương thức tồn tại của vật chất.","Cả A, B,"],"a":0},{"n":53,"q":"Hai mệnh đề “Vận động là thuộc tính cố hữu của vật chất” và “Vận động là phương thức tồn tại của vật chất” được hiểu là:","o":["Vật chất tồn tại bằng cách vận động.","Vật chất biểu hiện sự tồn tại cụ thể, đa dạng thông qua vận động.","Không thể có vận động phi vật chất cũng như không thể có vật chất không vận động.","Cả A, B,"],"a":3},{"n":54,"q":"Nếu không thể thừa nhận vật chất tự thân vận động thì nhất định quan điểm duy tâm về nguồn gốc của vận động của vật chất, vì:","o":["Sẽ phải thừa nhận nguyên nhân của vật chất là từ ý thức.","Sẽ phải thừa nhận nguyên nhân cuối cùng của mọi vận động vật chất là từ ý thức.","Sẽ phải thừa nhận vật chất không vận động.","Sẽ phải thừa nhận nguyên nhân vận động của vật chất là từ Thượng Đế."],"a":1},{"n":55,"q":"Lựa chọn mệnh đề phát biểu đúng trong số các mệnh đề được liệt kê sau đây:","o":["Thế giới vật chất có 5 hình thức vận động.","Các hình thức vận động của vật chất tồn tại độc lập với nhau.","Các hình thức vận động của vật chất có thể chuyển hóa lẫn nhau.","Giữa các hình thức vận động của vật chất có tồn tại hình thức vận động trung gian."],"a":2},{"n":56,"q":"Lựa chọn mệnh đề đúng trong số các mệnh đề được liệt kê dưới đây:","o":["Mỗi sự vật chỉ có một hình thức vận động.","Trong một sự vật có thể tồn tại nhiều hình thức vận động.","Mỗi sự vật thường được đặc trưng bởi một hình thức vận động cao nhất mà nó có.","Hình thức vận động cao hơn có thể bao hàm trong nó những hình thức vận động thấp hơn."],"a":1},{"n":57,"q":"Đứng im là:","o":["Tuyệt đối.","Tương đối.","Vừa tuyệt đối vừa tương đối.","Không có câu trả lời đúng."],"a":1},{"n":58,"q":"Không gian và thời gian:","o":["Không gian là hình thức tồn tại của vật chất, còn thời gian là phương thức tồn tại của vật chất.","Không gian là phương thức tồn tại của vật chất, còn thời gian là hình thức tồn tại của vật chất.","Không gian và thời gian là những hình thức cơ bản của tồn tại vật chất.","Không gian và thời gian là những phương thức cơ bản của tồn tại vật chất."],"a":2},{"n":59,"q":"Theo quan điểm của triết học Mác – Lê nin, thuộc tính phản ánh là thuộc tính:","o":["Riêng có ở con người.","Chỉ có ở các cơ thể sống.","Chỉ có ở vật chất vô cơ.","Phổ biến ở mọi tố chức vật chất."],"a":3},{"n":60,"q":"Sự tiến hóa của các hình thức phản ánh của vật:","o":["Quá trình tiến hóa – phát triển của các dạng vật chất giới tự nhiên.","Quá trình tiến hóa – phát triển của các giống loài sinh vật.","Quá trình tiến hóa – phát triển của thế giới.","Cả A, B,"],"a":0},{"n":61,"q":"Khái quát nguồn gốc tự nhiên của ý thức:","o":["Nguồn gốc tự nhiên và ngôn ngữ.","Nguồn gốc tự nhiên và xã hội.","Nguồn gốc lịch sử – xã hội và hoạt động của bộ não con người.","Cả B và"],"a":1},{"n":62,"q":"Nhân tố cơ bản, trực tiếp tạo thành nguồn gốc xã hội của ý thức:","o":["Lao động và ngôn ngữ.","Lao động trí óc và lao động chân tay.","Thực tiễn kinh tế và lao động.","Lao động và nghiên cứu khoa học."],"a":0},{"n":63,"q":"Nguồn gốc xã hội trực tiếp và quan trọng nhất quyết định sự ra đời và phát triển của ý thức là:","o":["Lao động trí óc.","Thực tiễn.","Giáo dục.","Nghiên cứu khoa học."],"a":1},{"n":64,"q":"Ngôn ngữ đóng vai trò là:","o":["“Cái vỏ vật chất” của ý thức.","Nội dung của ý thức.","Nội dung trung tâm của ý thức.","Cả a, b, c."],"a":0},{"n":65,"q":"Theo quan điểm của triết học Mác – Lê nin: ý thức là:","o":["Một dạng tồn tại của vật chất.","Dạng vật chất đặc biệt mà người ta không thể dùng giác quan trực tiếp để cảm nhận.","Sự phản ánh tinh thần của con người về thế giới.","Cả A, B,"],"a":2},{"n":66,"q":"Chọn từ phù hợp điền vào câu sau cho đúng với quan điểm duy vật biện chứng: “Ý thức chẳng qua là…. được di chuyển vào bộ óc con người và được cải biến ở trong đó”.","o":["Vật chất.","Cái vật chất.","Vật thể.","Thông tin."],"a":1},{"n":67,"q":"Bản chất của ý thức được thể hiện ở đặc trưng nào?","o":["Tính phi cảm giác","Tính sáng tạo","Tính xã hội","Cả A, B, C"],"a":3},{"n":68,"q":"Ý thức:","o":["Có thể sáng tạo ra thế giới khách quan.","Không thể sáng tạo ra thế giới khách quan.","Có thể sáng tạo ra thế giới khách quan thông qua thực tiễn.","Không có ý kiến đúng."],"a":2},{"n":69,"q":"Tri thức đóng vai trò là:","o":["Nội dung cơ bản của ý thức.","Phương thức tồn tại của ý thức","Cả A và B","Không có ý kiến đúng."],"a":2},{"n":70,"q":"Mối quan hệ biện chứng giữa vật chất và ý thức được thực hiện thông qua:","o":["Sự suy nghĩ của con người.","Hoạt động thực tiễn","Hoạt động lý luận.","Cả A, B,"],"a":1},{"n":71,"q":"Sự thông thái của con người:","o":["Được thể hiện nhiều hơn trong hoạt động nghiên cứu lý luận.","Được thể hiện nhiều hơn trong hoạt động thực tiễn.","Được thể hiện nhiều hơn trong hoạt động lý luận.","Được thể hiện nhiều hơn trong hoạt động thực tiễn."],"a":3},{"n":72,"q":"Phương pháp luận chung của chủ nghĩa duy vật là trong nhận thức và thực tiễn cần:","o":["Xuất phát từ thực tế khách quan.","Phát huy năng động chủ quan.","Xuất phát từ thực tế khách quan đồng thời phát huy năng động chủ quan.","Phát huy năng động chủ quan trên cơ sở tôn trọng thực tế khách quan."],"a":0},{"n":73,"q":"Để phát huy vai trò tích cực của ý thức trong thực tiễn cần phải:","o":["Có ý thức phản ánh đúng thực tại khách quan.","Có một tư tưởng sáng tạo.","Ý thức phải được vật chất hoá trong thực tiễn.","Cả 3 phương án trên."],"a":3},{"n":74,"q":"Theo quan điểm duy vật biện chứng, trong nhận thức và thực tiễn cần:","o":["Phát huy tính năng động chủ quan.","Xuất phát từ thực tế khách quan.","Cả A và B","Không có phương án đúng."],"a":2},{"n":75,"q":"Đặc điểm chủ yếu của phép biện chứng trong triết học Hy Lạp là:","o":["Tính chất duy tâm.","Tính chất duy vật, chưa triệt để.","Tính chất tự phát, mộc mạc, ngây thơ","Tính chất khoa học."],"a":2},{"n":76,"q":"Chọn câu trả lời đúng nhất theo quan điểm duy vật biện chứng: Mọi sự vật, hiện tượng của thế giới đều:","o":["Tồn tại trong sự tách rời tuyệt đối.","Tồn tại trong mối liên hệ phổ biến.","Không ngừng biến đổi, phát triển.","Cả B và C"],"a":3},{"n":77,"q":"Phép biện chứng nào cho rằng biện chứng ý niệm sinh ra biện chứng của sự vật.","o":["Phép biện chứng thời kỳ cổ đại.","Phép biện chứng của các nhà tư tưởng xã hội dân chủ Nga.","Phép biện chứng duy vật.","Phép biện chứng duy tâm khách quan"],"a":3},{"n":78,"q":"Tại sao","o":["Thừa nhận sự tồn tại khách quan của thế giới vật chất.","Thừa nhận tinh thần là sản phẩm của thế giới vật chất.","Mác nói phép biện chứng của G.W.Ph.Hêghen là phép biện chứng lộn đầu xuống đất?","Thừa nhận tự nhiên, xã hội là sản phẩm của quá trình phát triển của tinh thần, của ý niệm."],"a":3},{"n":79,"q":"Biện chứng khách quan là gì?","o":["Là những quan niệm biện chứng tiên nghiệm, có trước kinh nghiệm.","Là những quan niệm biện chứng được rút ra từ ý niệm tuyệt đối độc lập với ý thức con người.","Là biện chứng của các tồn tại vật chất.","Là biện chứng không thể nhận thức được nó."],"a":2},{"n":80,"q":"Biện chứng chủ quan là gì?","o":["Là biện chứng của tư duy tư biện, thuần tuý.","Là biện chứng của ý thức.","Là biện chứng của thực tiễn xã hội.","Là biện chứng của lý luận."],"a":1},{"n":81,"q":"Biện chứng tự phát là gì?","o":["Là biện chứng của bản thân thế giới khách quan.","Là biện chứng chủ quan thuần tuý.","Là biện chứng của bản thân thế giới khách quan khi con người chưa nhận thức được.","Là những yếu tố biện chứng con người đạt được trong quá trình tìm hiểu thế giới nhưng chưa có hệ thống."],"a":3},{"n":82,"q":"Đâu là biện chứng với tính cách là khoa học trong số các quan niệm, các hệ thống lý luận dưới đây?","o":["Những quan niệm biện chứng ở thời kỳ cổ đại.","Những quan niệm biện chứng của các nhà duy vật thế kỷ XVII-XVIII.","Những quan niệm biện chứng của các nhà khoa học tư nhiên thế kỷ XVII-XVIII.","Phép biện chứng duy vật."],"a":3},{"n":83,"q":"Theo quan niệm của chủ nghĩa duy vật biện chứng giữa biện chứng chủ quan và biện chứng khách quan quan hệ với nhau như thế nào?","o":["Biện chứng chủ quan quyết định biện chứng khách quan","Biện chứng chủ quan hoàn toàn độc lập với biện chứng khách quan","Biện chứng chủ quan phản ánh biện chứng khách quan","Biện chứng khách quan là sự thể hiện của biện chứng chủ quan"],"a":2},{"n":84,"q":"Đâu là nội dung nguyên lý của phép biện chứng duy vật về mối liên hệ phổ biến của các sự vật và hiện tượng.","o":["Các sự vật và hiện tượng trong thế giới tồn tại tách rời nhau, giữa chúng không có sự phụ thuộc, ràng buộc lẫn nhau","Các sự vật có sự liên hệ tác động nhau nhưng không có sự chuyển hóa lẫn nhau","Sự vật khác nhau ở vẻ bề ngoài, do chủ quan con người quy định, bản chất sự vật không có gì khác nhau","Thế giới là một chỉnh thể bao gồm các sự vật, các quá trình tách biệt nhau, vừa có liên hệ qua lại, vừa thâm nhập và chuyển hóa lẫn nhau."],"a":3},{"n":85,"q":"Đâu là quan niệm của phép biện chứng duy vật về cơ sở các mối liên hệ.","o":["Cơ sở sự liên hệ tác động qua lại giữa các sự vật và hiện tượng ở ý thức, cảm giác con người","Cơ sở sự liên hệ, tác động qua lại giữa các sự vật là ở ý niệm về sự thống nhất thế giới","Cơ sở sự liên hệ giữa các sự vật là do các lực bên ngoài có tính chất ngẫu nhiên đối với các sự vật","Sự liên hệ qua lại giữa các sự vật, hiện tượng có cơ sở ở tính thống nhất vật chất của thế giới"],"a":3},{"n":86,"q":"Đâu là quan niệm của phép biện chứng duy vật về vai trò của các mối liên hệ đối với sự vận động và phát triển của các sự vật và hiện tượng?","o":["Các mối liên hệ có vai trò khác nhau","Các mối liên hệ có vai trò như nhau","Các mối liên hệ có vai trò khác nhau tùy theo các điều kiện xác định","Các mối liên hệ luôn luôn có vai trò khác nhau"],"a":2},{"n":87,"q":"V.I.Lenin nói hai quan niệm cơ bản về sự phát triển:","o":["Chủ nghĩa duy vật và chủ nghĩa kinh nghiệm phê phán","Bút kí triết học","Những người bạn dân là thế nào và họ đấu tranh chống những người dân chủ ra sao?","Về vai trò của chủ nghĩa duy vật chiến đấu."],"a":1},{"n":88,"q":"Yêu cầu của quan điểm toàn diện phải xem xét tất cả các mối liên hệ của sự vật, yêu cầu này không thực hiện được, nhưng vẫn phải đề ra để làm gì?","o":["Chống quan điểm siêu hình","Chống quan điểm duy tâm","Chống chủ nghĩa chiết trung, và thuyết ngụy biện","Đề phòng cho chúng ta khỏi phảm sai lầm và sự cứng nhắc"],"a":3},{"n":89,"q":"Phép biện chứng được xác định với tư cách nào?","o":["Tư cách lý luận biện chứng","Tư cách phương pháp biện chứng","Cả 2 tư cách trên","Tư cách thế giới quan"],"a":2},{"n":90,"q":"Thế nào là phép biện chứng duy vật?","o":["Là phép biện chứng được xác lập trên lập trường của chủ nghĩa duy vật","Là phép biện chứng của ý niệm tương đối","Là phép biện chứng do","Cả A và C"],"a":3},{"n":91,"q":"Thế nào là phép biện chứng duy tâm?","o":["Là phép biện chứng được xác lập trên lập trường của chủ nghĩa duy tâm","Là phép biện chứng của vật chất","Là phép biện chứng giải thích về nguồn gốc của sự vận động, biến đổi và ý niệm","Cả A và C"],"a":3},{"n":92,"q":"Thế nào là biện chứng khách quan?","o":["Là khái niệm dùng để chỉ mối liên hệ biến đổi, phát triển khách quan vốn có của các sự vật hiện tượng","Là khái niệm dùng để chỉ mối liên hệ vốn có của ý niệm","Là khái niệm dùng để chỉ ra sự biến đổi không ngừng trong thế giới","Cả A và C"],"a":3},{"n":93,"q":"Thế nào là biện chứng chủ quan?","o":["Là biện chứng của ý thức","Là biện chứng khách quan được phản ánh vào ý thức","Là bản chất của biện chứng khách quan","Cả Avà B"],"a":3},{"n":94,"q":"Phương pháp biện chứng và phương pháp siêu hình khác nhau như thế nào?","o":["P hương pháp biện chứng xem xét, nghiên cứu các sự vật hiện tượng trong mối liên hệ phổ biến. Còn phương pháp siêu hình xem xét, nghiên cứu sự vật hiện tượng trong trạng thái cô lập tách rời","Phương pháp biện chứng xem xét nghiên cứu sự vật hiện tượng trong sự vận động phát triển không ngừng. Phương pháp siêu hình xem xét nghiên cứu sự vật hiện tượng trong sự đứng im bất biến","Cả A và B","Cả A và B đều sai"],"a":2},{"n":95,"q":"Nguồn gốc của phương pháp siêu hình?","o":["Nguồn gốc nhận thức: bản thân các sự vật hiện tượng đều có tính ổn định tương đối. Mặt khác quá trình nhận thức nhiều khi đòi hỏi phải trừu tượng hóa các mối liên hệ nhất định của sự vật hiện tượng tạm thời cố định chúng để phân tích. Và sự sai lầm đó bắt đầu ở chỗ tuyệt đối hóa tính trừu tượng và ổn định đó.","Nguồn gốc lịch sử: sự phát triển cùa khoa học tự nhiên thế kỉ XVII – XVIII với hai đặc điểm: – Phân ngành khoa học tạo nne6 sự ra đời của các khoa học cụ thể đặc biệt là sự phát trển của cơ học cổ điển – Phương pháp nghiên cứu chủ yếu là phân tích và thực nghiệm. Từ đó dẫn đến cách nhìn nhận xem xét sự vật cô lập tách rời đứng im bất biến trong khoa học và dần trở thành phương pháp siêu hình trong triết học","Cả A và B","Cả A và B đều sai"],"a":2},{"n":96,"q":"Phương pháp siêu hình thống trị triết học vào thời kì nào?","o":["Thế kỉ XV – XVI","Thế kỉ XVII – XVIII","Thế kỉ XVIII – XIX","Thế kỉ XIX – XX"],"a":1},{"n":97,"q":"Có mấy hình thức cơ bản của phép biện chứng?","o":["","","",""],"a":1},{"n":98,"q":"Những đặc điểm của phép biện chứng cổ đại?","o":["Là hình thức sơ khai nhất của phép biện chứng","Các nguyên lý quy luật của phép biện chứng cổ đại thường được thể hiện dưới hình thức manh nha trên cơ sở những quan sát, cảm nhận thông thường mà chưa được khái quát thành một hệ thống lý luận chặt chẽ","Phép biện chứng cổ đại đã phác họa được bức tranh thống nhất của thế giới trong mối liên hệ phổ biến trong sự vận động và phát triển không ngừng","Cả A, B, C"],"a":3},{"n":99,"q":"Những đại diện tiêu biểu của phép biện chứng cổ đại?","o":["Thuyết âm dương ngũ hành","Đạo Phật","Hêraclit","Cả A, B, C"],"a":3},{"n":100,"q":"Đóng góp và hạn chế của phép biện chứng duy tâm cổ điển Đức:","o":["Phép biện chứng duy tâm cổ điển Đức là một hệ thống logic khá vững chắc. Hầu như các nguyên lý quy luật cơ bản của phép biện chứng với tư cách là học thuyết về mối liên hệ phổ biến về sự vận động và phát triển đã được xây dựng trong một hệ thống thống nhất.","Các luận điểm nguyên lý quy luật của phép biện chứng đã được luận giải ở tầm logic nội tại cực kì sâu sắc","Phép biện chứng duy tâm cổ điển Đức là một trong các tiền đề lý luận cho sự ra đời của triết học Mác.","Cả A, B, C"],"a":3},{"n":101,"q":"Đặc điểm của phép biện chứng duy vật?","o":["Là hình thức phát triển cao nhất của lịch sử phép biện chứng","Có sự thống nhất chặt chẽ giữa phép biện chứng và chủ nghĩa duy vật","Phép biện chứng duy vật bao quát một lĩnh vực tri thức rộng lớn, nó vừa có tư cách lý luận triết học bao quát, vừa đóng vai trò phương pháp luận triết học cơ bản.","Cả A, B, C"],"a":3},{"n":102,"q":"Phép biện chứng duy vật bao gồm những nguyên lý quy luật cơ bản nào?","o":["1 nguyên lý, 1 quy luật","2 nguyên lý, 2 quy luật","2 nguyên lý, 3 quy luật","3 nguyên lý, 3 quy luật"],"a":2},{"n":103,"q":"Thế nào là “mối liên hệ”?","o":["Là khái niệm cơ bản của phép biện chứng được sử dụng để chỉ sự ràng buộc quy định lẫn nhau, đồng thời là sự tác động làm biến đổi lẫn nhau giữa các sự vật hiện tượng","Là khái niệm của phép biện chứng dùng chỉ sự nương tựa vào nhau của các sự vật hiện tượng","Là khái niệm của phép biện chứng dùng chỉ sự quy định làm tiền đề cho nhau giữa các sự vật hiện tượng","Cả A, B, C"],"a":3},{"n":104,"q":"Tính khách quan của mối liên hệ:","o":["Là mối liên hệ vốn có của thế giới các ý niệm","Là mối liên hệ vốn có của sự vật hiện tượng. Cơ sở của nó là tính thống nhất vật chất của thế giới.","Là mối liên hệ khách quan tồn tại bên ngoài ý thức của con người.","Cả B và"],"a":2},{"n":105,"q":"Có thể tuyệt đối hóa sự khác biệt hoặc tuyệt đối hóa sự đồng nhất giữa các sự vật, hiện tượng không? Vì sao?","o":["Có","Không"],"a":1},{"n":106,"q":"Cho hai tam giác: ABC là tam giác thường, DEG là tam giác vuông. Những khẳng định nào sau đây khẳng định nào đúng?","o":["ABC là cái chung, DEG là cái riêng","ABC và DEG đều là cái riêng","ABC và DEG là cái riêng nhưng đồng thời có tính chất chung","Cả B và C"],"a":3},{"n":107,"q":"Chỉ ra đâu không phải là quan điểm của chủ nghĩa duy vật biện chứng về sự tồn tại của cái chung trong các câu nói sau:","o":["Cái chung tồn tại khách quan ngoài cái riêng.","Cái chung thực sự tồn tại, nhưng không tồn tại ngoài cái riêng, mà thông qua cái riêng biểu hiện sự tồn tại của mình.","Cái chung thuần túy là sản phẩm của tư duy trừu tượng không có tồn tại cảm tính độc lập.","Cả A và"],"a":3},{"n":108,"q":"Các phạm trù được hình thành thông qua quá trình … những thuộc tính, những mối liên hệ vốn có bên trong của bản thân sự vật.","o":["Liệt kê và phân tích","Chứng minh","Khái quát hóa, trừu tượng hóa","Khái quát và chứng minh"],"a":2},{"n":109,"q":"Nội dung của các phạm trù luôn mang tính...","o":["Khách quan","Chủ quan","Khách quan và chủ quan","Cả ba đều sai"],"a":0},{"n":110,"q":"Hệ thống phạm trù của phép biện chứng duy vật là một….","o":["Hệ thống đóng kín, bất biến","Hệ thống mở","Cả hai đều sai","Cả hai đều đúng"],"a":1},{"n":111,"q":"Phạm trù là những … phản ánh những mặt, những thuộc tính, những mối liên hệ chung, cơ bản nhất của các sự vật và hiện tượng thuộc một lĩnh vực nhất định.","o":["Khái niệm","Khái niệm rộng","Khái niệm rộng nhất","Khái niệm hẹp"],"a":2},{"n":112,"q":"“Cái riêng – Cái chung” , “Nguyên nhân – Kết quả” , “Tất nhiên – Ngẫu nhiên” , “Nội dung – Hình thức” , “Bản chất – Hiện tượng” , “Khả năng – Hiện thực” đó là các … của triết học Mác – Lênin.","o":["Cặp khái niệm","Thuật ngữ cơ bản","Cặp phạm trù cơ bản","Cặp phạm trù"],"a":2},{"n":113,"q":"Các phạm trù của triết học phản ánh những mối liên hệ thuộc lĩnh vực nào của hiện thực:","o":["Lĩnh vực xã hội","Lĩnh vực tư duy","Lĩnh vực tự nhiên","Cả A, B, C"],"a":3},{"n":114,"q":"Có sự khác nhau nào giữa “khái niệm” và “phạm trù”?","o":["“Khái niệm” chính là “phạm trù” (không có sự khác nhau).","“Phạm trù” phải là những “khái niệm’ rộng nhất.","“Khái niệm” không bao giờ là một “phạm trù”.","“Khái niệm” phải là những “phạm trù” rộng nhất."],"a":1},{"n":115,"q":"“Phạm trù chì là những từ trống rỗng, do con người tưởng tượng ra, đầy tính chủ quan và không biểu hiện hiện thực”. Đây là cách quan niệm của trường phái triết học nào?","o":["Trường phái triết học Duy thực","Trường phái triết học Duy danh","Trường phái Cantơ","Trường phài triết học mácxít"],"a":1},{"n":116,"q":"“Cái nhà nói chung” là không có thực, mà chỉ có những cái nhà riêng lẻ, cụ thể mới tồn tại được. Đây là quan niệm của trường phái triết học nào?","o":["Trường phái học Duy thực","Trường phái học Duy danh","Trường phái Cantơ","Trường phái triết học Mácxít"],"a":1},{"n":117,"q":"Quan điểm của trường phái triết học tách rời tuyệt đối mối quan hệ giữa cái chung và cái riêng:","o":["Trường phái học Duy danh","Trường phái học Duy thực","Cà hai trường phái trên","Không có đáp án đúng"],"a":2},{"n":118,"q":"Các phạm trù được hình thành:","o":["Một cách bẩn sinh trong ý thức của con người","Sẵn có ở bên ngoài, độc lập với ý thức của con người","Thông qua quá trình hoạt động, nhận thức và thực tiễn của con người","Cả 3 đáp án trên"],"a":2},{"n":119,"q":"Hình thức cơ bản đầu tiên của mọi quá trình tư duy là:","o":["Cảm giác","Biểu tượng","Khái niệm","Suy luận"],"a":2},{"n":120,"q":"Cái riêng là một phạm trù triết học để chỉ:","o":["Những mặt, những thuộc tính chung của nhiều sự vật","Một sự vật, một hiện tượng, một quá trình riêng lẻ nhất định","Những nét, những thuộc tính chỉ có ở một sự vật","Các yếu tố cấu thành một hệ thống"],"a":1},{"n":121,"q":"Khái niệm cái đơn nhất dùng để chỉ cái…","o":["Tồn tại ở nhiều sự vật, hiện tượng","Chỉ tồn tại ở một sự vật, hiện tượng, tuyệt đối không lặp lại sự vật hiện tượng khác","Tồn tại ở một sự vật, hiện tượng, trong một quan hệ xác định","Không có phương án nào"],"a":2},{"n":122,"q":"Phạm trù triết học nào dùng để chỉ những thuộc tính chung, không những có ở một kết cấu vật chất nhất định mà còn được lặp lại trong nhiều sự vật, hiện tượng hay quá trình riêng lẻ khác:","o":["Cái riêng","Cái chung","Cái đơn n ùng lại rơi vào quan điểm nào? Vì sao?","o":["Duy vật; vì coi vật chất độc lập với ý thức","Duy vật không triệt để; vì không thừa nhận vật chất quyết định ý thức","Nhị nguyên vì thừa nhận hai thực thể tạo thành hai thế giới","Duy tâm; vì thừa nhận thực thể vật chất và tinh thần tuy độc lập nhưng đều phụ thuộc vào thực thể thứ ba đó là thượng đế."],"a":3},{"n":268,"q":"Đềcáctơ đứng trên quan điểm nào trong lĩnh vực vật lý?","o":["Quan điểm duy tâm khách quan","Quan điểm duy tâm chủ quan","Quan điểm nhị nguyên","Quan điểm duy vật"],"a":3},{"n":269,"q":"Trong lĩnh vực vật lý Đềcáctơ quan niệm về tự nhiên như thế nào?","o":["Tự nhiên là tổng các vật có quán tính","Tự nhiên và thượng đế là một.","Tự nhiên là hiện thân của thượng đế","Tự nhiên là một khối thống nhất gồm những hạt nhỏ vật chất có quán tính và vận động vĩnh viễn theo những quy luật cơ học"],"a":3},{"n":270,"q":"Điều khẳng định nào sau đây là đúng?","o":["Đềcáctơ là nhà duy vật biện chứng vì coi vật chất tồn tại khách quan.","Đềcáctơ là nhà duy vật vì phủ nhận uy quyền của nhà thờ và tôn giáo","Đềcáctơ là nhà triết học duy tâm vì đề cao sức mạnh của lý tưởng con người","Đềcáctơ đem tính khoa học thay cho niềm tin tôn giáo mù quáng chống lại uy quyền của tôn giáo."],"a":3},{"n":271,"q":"Điều nhận định nào sau đây là đúng?","o":["Đềcáctơ nghi ngờ khả năng nhận thức của con người.","Vì coi nghi ngờ là điểm xuất phát của nhận thức khoa học, nên Đềcáctơ phủ nhận khả năng nhận thức của con người.","Quan điểm của Đềcáctơ và Hium là như nhau vì đều nghi ngờ nhận thức của con người","Đềcáctơ coi nghi ngờ là điểm xuất phát của nghiên cứu khoa học để phủ nhận sự mê tín, phủ nhận niềm tin tôn giáo"],"a":3},{"n":272,"q":"Luận điểm Đềcáctơ \"tôi tư duy vậy tôi tồn tại\" có ý nghĩa gì?","o":["Nhấn mạnh vai trò của tư duy, duy lý","Nhấn mạnh vai trò của cảm giác","Phủ nhận vai trò của chủ thể","Đề cao kinh nghiệm."],"a":0},{"n":273,"q":"Theo Đềcáctơ tiêu chuẩn của chân lý là gì?","o":["Là thực tiễn","Là tư duy rõ ràng, mạch lạc","Là cảm giác, kinh nghiệm về sự vật","Là được nhiều người thừa nhận."],"a":1},{"n":274,"q":"Luận điểm của Đềcáctơ \"Tôi tư duy vậy tôi tồn tại\" thể hiện khuynh hướng triết học nào?","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật tầm thường","Thuyết hoài nghi","Chủ nghĩa duy tâm chủ quan"],"a":3},{"n":275,"q":"Xpinôda là nhà triết học nước nào?","o":["Hà Lan","Đức","Áo","Pháp"],"a":0},{"n":276,"q":"Xpinôda là nhà triết học thuộc trường phái nào?","o":["Duy tâm chủ quan","Duy vật biện chứng","Duy tâm khách quan","Duy vật và vô thần"],"a":3},{"n":277,"q":"Nhận định nào sau đây là đúng","o":["Xpinôda là nhà triết học nhị nguyên","Xpinôda là nhà triết học duy tâm khách quan","Xpinôda là nhà triết học duy vật biện chứng","Xpinôda là nhà triết học nhất nguyên."],"a":0},{"n":278,"q":"Điều khẳng định nào sau đây về Xpinôda là sai?","o":["Xpinôda là nhà triết học duy vật và vô thần","Xpinôda là nhà triết học nhất nguyên coi quảng tính và tư duy là thuộc tính của một thực thể","Xpinôda chống lại quan điểm nhị nguyên của Đềcáctơ.","Xpinôda là nhà triết học nhị nguyên"],"a":3},{"n":279,"q":"Quan điểm duy vật của Xpinôda về thế giới là ở chỗ nào?","o":["Thế giới là thế giới của các sự vật riêng lẻ","Thế giới là phức hợp cảm giác","Thế giới là sự tha hoá của ý niệm","Thế giới là cái bóng của thế giới ý niệm"],"a":0},{"n":280,"q":"Tại sao quan điểm của Xpinôda lại rơi vào quan điểm của thuyết định mệnh máy móc?","o":["Coi thế gới gồm các sự vật riêng lẻ","Coi các sự vật trong thế giới đều có nguyên nhân","Đồng nhất nguyên nhân với tính tất yếu coi ngẫu nhiên chỉ là phạm trù chủ quan","Khẳng định có thể nhận thức thế giới bằng phương pháp toán học."],"a":2},{"n":281,"q":"Quan niệm về ý thức của Xpinôda chịu ảnh hưởng của ai, và quan niệm đó như thế nào?","o":["Chịu ảnh hưởng của thuyết bất khả tri, không thừa nhận con người có khả năng nhận thức được thế giới.","Chịu ảnh hưởng của những người theo vật hoạt luận, thừa nhận mọi vật đều có ý thức.","Chịu ảnh hưởng của ch ười","Về thuyết thừa nhận tồn tại tư tưởng bẩm sinh","Về quan niệm duy vật trong lĩnh vực vật lý"],"a":2},{"n":291,"q":"Theo quan niệm của G.Lốccơ tri thức, chân lý do đâu mà có?","o":["Do ý niệm bẩm sinh","Do kết quả của quá trình nhận thức","Do thượng đế ban tặng","Do hoạt động thực tiễn"],"a":1},{"n":292,"q":"Giôn Lốccơ là nhà triết học nước nào?","o":["Pháp","Ý","Anh","Mỹ"],"a":1},{"n":293,"q":"Về nhận thức luận ai là người nêu ra nguyên lý tabula rasa (tấm bảng sạch)","o":["Xpinôda","Đềcáctơ","Platôn","Giôn Lốccơ"],"a":3},{"n":294,"q":"Nguyên lý tabula rasa (tấm bảng sạch) theo cách hiểu của người đề xuất khẳng định những nội dung gì?","o":["Mọi tri thức không phải là bẩm sinh, mà là kết quả nhận thức","Mọi quá trình nhận thức đều phải xuất phát từ cơ quan cảm giác","Linh hồn con người có vai trò tích cực nhất định","Cả ba nội dung trên"],"a":3},{"n":295,"q":"Nội dung thuyết tabula rasa (tấm bảng sạch) đứng trên lập trường triết học nào?","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật","Thuyết bất khả tri"],"a":2},{"n":296,"q":"Hạn chế của thuyết tabula rasa (tấm bảng sạch) là ở chỗ nào?","o":["Đề cao vai trò nhận thức lý tính","Phủ nhận nhận thức cảm tính","Đề cao nhận thức cảm tính một cách tuyệt đối","Chưa thấy vai trò của kinh nghiệm"],"a":2},{"n":297,"q":"Trong quan niệm về kinh nghiệm. Giôn Lốccơ đứng trên lập trường nào?","o":["Lập trường của chủ nghĩa duy lý","Lập trường của chủ nghĩa duy cảm","Lập trường của thuyết nhị nguyên","Lập trường của thuyết bất khả tri"],"a":1},{"n":298,"q":"Giôn Lốccơ coi lý tính là gì?","o":["Là ý niệm bẩm sinh","Là hoạt động của linh hồn","Là kinh nghiệm bên trong","Là giai đoạn phản ánh khái quát sự vật"],"a":2},{"n":299,"q":"Luận điểm nào thể hiện lập trường duy cảm của Giôn Lốccơ?","o":["Tôi tư duy vậy tôi tồn tại","Mọi nhận thức đều xuất phát từ kinh nghiệm","Kinh nghiệm là nguồn gốc của nhận thức","Không có cái gì trong lý tính mà trước đó lại không có trong cảm tính."],"a":3},{"n": ỗ nào?","o":["Không tiến bộ hơn.","Có tiến bộ hơn ở chỗ không đồng nhất vật chất với dạng cụ thể của vật chất.","Có tiến bộ ở chỗ coi vật chất và vận động không tách rời nhau, vật chất và vận động có nguyên nhân tự thân."],"a":2},{"n":427,"q":"Đâu là quan niệm về vật chất của chủ nghĩa duy vật thế kỷ XVII - XVIII.","o":["Đồng nhất vật chất nói chung với một dạng cụ thể hữu hình có tính chất cảm tính của vật chất.","Đồng nhất vật chất nói chung với một dạng cụ thể, đồng thời trong quan niệm về vật chất có nhiều yếu tố biện chứng.","Không đồng nhất vật chất nói chung với một dạng cụ thể của vật chất"],"a":1},{"n":428,"q":"Phương pháp tư duy nào chi phối những hiểu biết triết học duy vật về vật chất ở thế kỷ XVII - XVIII?","o":["Phương pháp biện chứng duy tâm","Phương pháp biện chứng duy vật.","Phương pháp siêu hình máy móc."],"a":2},{"n":429,"q":"Thuộc lập trường triết học nào khi giải thích mọi hiện tượng của tự nhiên bằng sự tác động qua lại của lực đẩy và lực hút của vật thể?","o":["Chủ nghĩa duy vật tự phát thời kỳ cổ đại","Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm."],"a":1},{"n":430,"q":"Quan niệm về vật chất của chủ nghĩa duy vật thời kỳ nào đã quy giản sự khác nhau về chất giữa các vật về sự khác nhau về lượng?","o":["Chủ nghĩa duy vật biện chứng thời kỳ hiện đại","Chủ nghĩa duy vật tự phát thời kỳ cổ đại","Chủ nghĩa duy vật siêu hình thế kỷ XVII - XVIII"],"a":2},{"n":431,"q":"Đồng nhất vật chất với khối lượng đó là quan niệm về vật chất của ai và ở thời kỳ nào?","o":["Các nhà triết học duy vật thời kỳ cổ đại.","Các nhà triết học thời kỳ Phục hưng.","Các nhà khoa học tự nhiên thế kỷ XVII - XVIII.","Các nhà triết học duy vật biện chứng thời kỳ cổ đại."],"a":2},{"n":432,"q":"Coi vận động của vật chất chỉ là biểu hiện của vận động cơ học, đó là quan điểm về vận động và vật chất của ai?","o":["Các nhà triết học duy vật thời kỳ cổ đại.","Các nhà khoa học tự nhiên và triết học thế kỷ XVII - XVIII.","Các nhà t :["Tự ý thức; tiềm thức; vô thức.","Tri thức; niềm tin; ý chí.","Cảm giác, khái niệm; phán đoán"],"a":0},{"n":506,"q":"Đâu là quan điểm của chủ nghĩa duy vật biện chứng về mối quan hệ giữa vật chất và ý thức?","o":["Ý thức do vật chất quyết định.","Ý thức tác động đến vật chất.","Ý thức do vật chất quyết định, nhưng có tính độc lập tương đối và tác động đến vật chất thông qua hoạt động thực tiễn."],"a":2},{"n":507,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng ý thức tác động đến đời sống hiện thực như thế nào?","o":["Ý thức tự nó có thể làm thay đổi được hiện thực.","Ý thức tác động đến hiện thực thông qua hoạt động thực tiễn.","Ý thức tác động đến hiện thực thông qua hoạt động lý luận."],"a":1},{"n":508,"q":"Quan điểm sau đây thuộc lập trường triết học nào: Nhận thức sự vật và hoạt động thực tiễn chỉ dựa vào những nguyên lý chung, không xuất phát từ bản thân sự vật?","o":["Chủ nghĩa kinh nghiệm.","Chủ nghĩa duy tâm kinh viện.","Chủ nghĩa duy vật biện chứng"],"a":1},{"n":509,"q":"Hoạt động chỉ dựa theo ý muốn chủ quan không dựa vào thực tiễn là lập trường triết học nào?","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm.","Chủ nghĩa duy vật siêu hình."],"a":1},{"n":510,"q":"Quan điểm sau đây thuộc lập trường triết học nào: Trong nhận thức và hoạt động thực tiễn phải lấy hiện thực khách quan làm căn cứ, không được lấy mong muốn chủ quan làm căn cứ.","o":["Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm.","Chủ nghĩa duy vật siêu hình."],"a":0},{"n":511,"q":"Phép biện chứng duy vật có mấy nguyên lý cơ bản?","o":["Một nguyên lý cơ bản","Hai nguyên lý cơ bản.","Ba nguyên lý cơ bản."],"a":1},{"n":512,"q":"Nguyên lý cơ bản của phép biện chứng duy vật là nguyên lý nào?","o":["Nguyên lý về sự tồn tại khách quan của vật chất.","Nguyên lý về sự vận động và đứng im của các sự vật.","Nguyên lý về mối liên hệ phổ biến và về sự phát triển.","Nguyên lý về tính liên tục và tính gián đoạn của thế giới vật chất."],"a":2},{"n":513,"q":"Quan điểm siêu hình trả lời câu hỏi ữa các sự vật có tính chất gì?","o":["Tính ngẫu nhiên, chủ quan.","Tính khách quan, tính phổ biến, tính đa dạng.","Tính khách quan, nhưng không có tính phổ biến và đa dạng."],"a":1},{"n":520,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng một sự vật trong quá trình tồn tại và phát triển có một hay nhiều mối liên hệ.","o":["Có một mối liên hệ","Có một số hữu hạn mối liên hệ","Có vô vàn các mối liên hệ."],"a":2},{"n":521,"q":"Theo quan niệm của chủ nghĩa duy vật biện chứng các mối liên hệ có vai trò như thế nào đối với sự tồn tại và phát triển của sự vật?","o":["Có vai trò ngang bằng nhau.","Có vai trò khác nhau, nên chỉ cần biết một số mối liên hệ.","Có vai trò khác nhau, cần phải xem xét mọi mối liên hệ."],"a":2},{"n":522,"q":"Quan điểm nào cho rằng mối liên hệ giữa các sự vật, hiện tượng trong thế giới là biểu hiện của mối liên hệ giữa các ý niệm?","o":["Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm chủ quan."],"a":2},{"n":523,"q":"Đòi hỏi của quan điểm toàn diện như thế nào?","o":["Chỉ xem xét một mối liên hệ.","Phải xem xét tất cả các mối liên hệ của sự vật.","Phải xem xét tất cả các mối liên hệ đồng thời phân loại được vị trí, vai trò của các mối liên hệ."],"a":2},{"n":524,"q":"Cơ sở lý luận của quan điểm toàn diện là nguyên lý nào?","o":["Nguyên lý về sự phát triển.","Nguyên lý về mối liên hệ phổ biến.","Nguyên lý về sự tồn tại khách quan của thế giới vật chất."],"a":1},{"n":525,"q":"Trong những luận điểm sau đây, đâu là luận điểm của quan điểm siêu hình về sự phát triển?","o":["Xem xét sự phát triển chỉ là sự tăng, hay giảm đơn thuần về lượng.","Xem sự phát triển bao hàm cả sự thay đổi dần về lượng và sự nhảy vọt về chất.","Xem sự phát triển đi lên bao hàm cả sự thụt lùi tạm thời."],"a":0},{"n":526,"q":"Trong các quan điểm sau đây, đâu là quan điểm siêu hình về sự phát triển?","o":["Xem xét sự phát triển như một quá trình tiến lên liên tục, không có bước quanh co, thụt lùi, đứt đoạn.","Xem xét sự phát triển là một quá trình tiến từ thấp lên cao. từ đơn giản đến phức tạp. bao hàm cả sự tụt lùi, đứt đoạn.","Xem xét sự phát triển như là quá trình đi lên bao hàm cả sự lặp lại cái cũ trên cơ sở mới."],"a":0},{"n":527,"q":"Trong các quan điểm sau đây, đâu là quan điểm siêu hình về sự phát triển?","o":["Chất của sự vật không thay đổi gì trong quá trình tồn tại và phát triển của chúng.","Phát triển là sự chuyển hoá từ những thay đổi về lượng thành sự thay đổi về chất.","Phát triển bao hàm sự nảy sinh chất mới và sự phá vỡ chất cũ."],"a":0},{"n":528,"q":"Luận điểm sau đây về sự phát triển thuộc lập trường triết học nào: \"Phát triển diễn ra theo con đường tròn khép kín, là sự lặp lại đơn thuần cái cũ\".","o":["Quan điểm biện chứng duy vật.","Quan điểm siêu hình.","Quan điểm biện chứng duy tâm."],"a":1},{"n":529,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển chỉ là những bước nhảy về chất, không có sự thay đổi về lượng\".","o":["Triết học duy vật biện chứng.","Triết học duy vật siêu hình.","Triết học biện chứng duy tâm."],"a":1},{"n":530,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển là quá trình chuyển hoá từ những thay đổi về lượng thành sự thay đổi về chất và ngược lại\".","o":["Quan điểm biện chứng.","Quan điểm siêu hình.","Quan điểm chiết trung và nguỵ biện."],"a":0},{"n":531,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phát triển là quá trình vận động tiến lên theo con đường xoáy ốc\".","o":["Quan điểm siêu hình.","Quan điểm chiết trung và nguỵ biện.","Quan điểm biện chứng."],"a":2},{"n":532,"q":"Luận điểm sau đây về nguồn gốc của sự phát triển thuộc lập trường triết học nào: \"phát triển trong hiện thực là tồn tại khác, là biểu hiện của sự phát triển của ý niệm tuyệt đối\".","o":["Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình."],"a":1},{"n":533,"q":"Luận điểm sau đây về nguồn gốc của sự phát triển thuộc lập trường triết học nà a sự vận động của thế giới vật chất.","Phát triển là xu hướng chung nhưng không bản chất của sự vận động của sự vật.","Phát triển là xu hướng cá biệt của sự vận động của các sự vật."],"a":0},{"n":540,"q":"Trong thế giới vô cơ sự phát triển biểu hiện như thế nào?","o":["Sự tác động qua lại giữa các kết cấu vật chất trong điều kiện nhất định làm nảy sinh các hợp chất mới.","Sự hoàn thiện của cơ thể thích ứng tốt hơn với sự biến đổi của môi trường.","Điều chỉnh hoạt động của cơ thể cho phù hợp với môi trường sống."],"a":0},{"n":541,"q":"Trong xã hội sự phát triển biểu hiện ra như thế nào?","o":["Sự xuất hiện các hợp chất mới.","Sự xuất hiện các giống loài động vật, thực vật mới thích ứng tốt hơn với môi trường.","Sự thay thế chế độ xã hội này bằng một chế độ xã hội khác dân chủ, văn minh hơn."],"a":2},{"n":542,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, những tính chất nào sau đây là tính chất của sự phát triển?","o":["Tính khách quan.","Tính phổ biến.","Tính chất đa dạng, phong phú trong nội dung và hình thức phát triển.","Cả a, b, và c."],"a":3},{"n":543,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng điều khẳng định nào sau đây là đúng?","o":["Mong muốn của con người quy định sự phát triển.","Mong muốn của con người tự nó không có ảnh hưởng đến sự phát triển của các sự vật.","Mong muốn của con người hoàn toàn không có ảnh hưởng gì đến sự phát triển của các sự vật."],"a":1},{"n":544,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Nguyện vọng, ý chí của con người tự nó tác động đến sự phát triển.","Nguyện vọng, ý chí của con người không có ảnh hưởng gì đến sự phát triển.","Nguyện vọng, ý chí của con người có ảnh hưởng đến sự phát triển thông qua hoạt động thực tiễn."],"a":2},{"n":545,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Sự phát triển trong tự nhiên, xã hội và tư duy là hoàn toàn đồng nhất với nhau\".","o":["Quan điểm siêu hình.","Quan điểm biện chứng duy vật.","Quan điểm biện chứng duy tâm. tồn tại, nên khái niệm cái cây là giả dối\".","o":["Phái Duy Thực","Chủ nghĩa duy vật biện chứng","Phái Duy Danh.","Phái nguỵ biện."],"a":2},{"n":576,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Phạm trù vật chất không có sự tồn tại hữu hình như một vật cụ thể. Phạm trù vật chất bao quát đặc điểm chung tồn tại trong các vật cụ thể\".","o":["Phái Duy Thực","Chủ nghĩa duy vật biện chứng.","Phái Duy Danh","Chủ nghĩa duy vật siêu hình."],"a":1},{"n":577,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Không có cái chung tồn tại thuần tuý bên ngoài cái riêng. Không có cái riêng tồn tại không liên hệ với cái chung\".","o":["Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm siêu hình."],"a":1},{"n":578,"q":"Có người nói tam giác vuông là cái riêng, tam giac thường là cái chung. Theo anh (chị) như vậy đúng hay sai?","o":["Đúng","Vừa đúng, vừa sai","Sai"],"a":1},{"n":579,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm sau đây đúng hay sai: \"Muốn nhận thức được cái chung phải xuất phát từ cái riêng\".","o":["Đúng","Sai","Không xác định"],"a":0},{"n":580,"q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm nguyên nhân: Nguyên nhân là phạm trù chỉ ....................................... (1).. giữa các mặt trong một sự vật, hoặc giữa các sự vật với nhau gây ra ...(2)..","o":["1- sự liên hệ lẫn nhau, 2- một sự vật mới","1- sự thống nhất, 2- một sự vật mới","1- sự tác động lẫn nhau, 2- một biến đổi nhất định nào đó."],"a":2},{"n":581,"q":"Thêm cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm kết quả: \"Kết quả là ...(1).. do ...(2).. lẫn nhau giữa các mặt trong một sự vật hoặc giữa các sự vật với nhau gây ra\".","o":["1- mối liên hệ, 2- kết hợp","1- sự tác động, 2- những biến đổi","1- những biến đổi xuất hiện, 2- sự tác động."],"a":2},{"n":582,"q":"Xác định nguyên nhân của sự phát sáng của dây tóc bóng đèn.","o":["Nguồn điện","Dây tóc bóng đèn","Sự tác động giữa dòng điện và dây tóc bóng đèn"],"a":2},{"n":583,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng đâu là nguyên nhân của cách mạng vô sản.","o":["Sự xuất hiện giai cấp tư sản.","Sự xuất hiện nhà nước tư sản","Sự xuất hiện giai cấp vô sản và Đảng của nó","Mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản."],"a":3},{"n":584,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng nguyên nhân để hạt thóc nẩy mầm là gì?","o":["Độ ẩm của môi trường","Nhiệt độ của không khí","Sự tác động giữa hạt thóc với nhiệt độ không khí và nước."],"a":2},{"n":585,"q":"Theo quan điểm duy vật biện chứng nguyên nhân của nước sôi là gì?","o":["Nhiệt độ của bếp lò","Các phân tử nước","Sự tác động giữa các phân tử nước với nhiệt độ của bếp lò"],"a":2},{"n":586,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là đúng?","o":["Có thể coi nguyên nhân và kết quả nằm ở hai sự vật khác nhau.","Không thể coi nguyên nhân và kết quả nằm ở hai sự vật khác nhau.","Nguyên nhân và kết quả không cùng một kết cấu vật chất."],"a":1},{"n":587,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Mối liên hệ nhân quả là do cảm giác con người quy định\".","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng.","Chủ nghĩa duy vật siêu hình"],"a":1},{"n":588,"q":"Luận điểm sau đây thuộc lập trường triết học nào: Mối liên hệ nhân quả là do ý niệm tuyệt đối quyết định.","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy vật siêu hình."],"a":0},{"n":589,"q":"Luận điểm sau đây là của trường phái triết học nào: Mối liên hệ nhân quả tồn tại khách quan phổ biến và tất yếu trong thế giới vật chất.","o":["Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật biện chứng"],"a":2},{"n":590,"q":"Luận điểm sau đây là thuộc lập trường triết học nào: Mọi hiện tượng, quá trình đều có nguyên nhân tồn tại khách quan không phụ thuộc vào việc chúng ta có nhận thức được điều đó hay u."],"a":0},{"n":598,"q":"Hãy xác định đâu là cái tất yếu khi gieo một con xúc xắc.","o":["Có một trong 6 mặt xấp và một trong 6 mặt ngửa","Mặt một chấm xấp trong lần gieo thứ nhất.","Mặt năm chấm xấp trong lần gieo thứ hai."],"a":0},{"n":599,"q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa phạm trù tất nhiên: tất nhiên là cái do ..(1).. của kết cấu vật chất quyết định và trong những điều kiện nhất định nó phải ...(2). ............................................................. chứ không thể khác được.","o":["1- nguyên nhân bên ngoài, 2- xảy ra như thế.","1- những nguyên nhân bên trong, 2- xảy ra như thế.","1- những nguyên nhân bên trong, 2- không xác định được"],"a":1},{"n":600,"q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm ngẫu nhiên: \"Ngẫu nhiên là cái không do ...(1)... kết cấu vật chất quyết định, mà do ...(2)... quyết định\".","o":["1- nguyên nhân, 2- hoàn cảnh bên ngoài.","1- Mối liên hệ bản chất bên trong,","1- mối liên hệ bên ngoài, 2- nhân tố bên ngoài. 2- mối liên hệ bên trong."],"a":1},{"n":601,"q":"Trong nhứng luận điểm sau đây, đâu là luận điểm của chủ nghĩa duy vật biện chứng?","o":["Mọi cái chung đều là cái tất yếu.","Mọi cái chung đều không phải là cái tất yếu.","Chỉ có cái chung được quyết định bởi bản chất nội tại của sự vật mới là cái tất yếu."],"a":2},{"n":602,"q":"Nhu cầu ăn, mặc, ở, học tập của con người là cái chung hay là cái tất yếu?","o":["Là cái chung","Là cái tất yếu","Vừa là cái chung vừa là cái tất yếu."],"a":2},{"n":603,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Mọi cái tất yếu đều là cái chung.","Mọi cái chung đều là cái tất yếu.","Không phải cái chung nào cũng là cái tất yếu."],"a":1},{"n":604,"q":"Sự giống nhau về sở thích ăn, mặc, ở, học nghệ gì là cái chung tất yếu hay là cái chung có tính chất ngẫu nhiên.","o":["Cái chung tất yếu","Cái chung ngẫu nhiên"],"a":1},{"n":605,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng phương pháp quản lý."],"a":0},{"n":633,"q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm hiện thực: \"Hiện thực là phạm trù triết học chỉ cái ............................................... \"","o":["Mối liên hệ giữa các sự vật.","Chưa có, chưa tồn tại","Hiện có đang tồn tại"],"a":2},{"n":634,"q":"Điền cụm từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm khả năng: \"Khả năng là phạm trù triết học chỉ .......................................................... khi có các điều kiện thích hợp\".","o":["Cái đang có, đang tồn tại","Cái chưa có, nhưng sẽ có","Cái không thể có","Cái tiền đề để tạo nên sự vật mới."],"a":1},{"n":635,"q":"Dấu hiệu để phân biệt khả năng với hiện thực là gì?","o":["Sự nhận biết được hay không nhận biết được.","Sự xác định hay không xác định.","Sự có mặt và không có mặt trên thực tế"],"a":2},{"n":636,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Cái hiện chưa có nhưng sẽ có là khả năng.","Cái hiện đang có là hiện thực.","Cái chưa cảm nhận được là khả năng."],"a":0},{"n":637,"q":"Thêm cụm từ nào vào câu sau để được một khẳng định của chủ nghĩa duy vật biện chứng về các loại khả năng:","o":["Mối liên hệ chung","Mối liên hệ tất nhiên, ổn định","Tương tác ngẫu nhiên","Nguyên nhân bên trong"],"a":2},{"n":638,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Khả năng và hiện thực đều tồn tại khách quan.","Khả năng và hiện thực không tách rời nhau","Chỉ có hiện thực tồn tại khách quan, khả năng chỉ là cảm giác của con người."],"a":2},{"n":639,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Hiện thực nào cũng chứa đựng khả năng.","Khả năng luôn tồn tại trong hiện thực.","Khả năng chỉ tồn tại trong ý niệm, không tồn tại trong hiện thực."],"a":2},{"n":640,"q":"Theo quan niệm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Cùng một sự vật, trong những điều kiện q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Mỗi sự vật có nhiều thuộc tính.","Mỗi thuộc tính biểu hiện một mặt chất của sự vật.","Mỗi thuộc tính có thể đóng vai trò là tính quy định về chất trong một quan hệ nhất định.","Mỗi sự vật chỉ có một tính quy định về chất."],"a":3},{"n":648,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Không có chất thuần tuý tồn tại bên ngoài sự vật.","Chỉ có sự vật có chất mới tồn tại.","Chỉ có sự vật có vô vàn chất mới tồn tại","Sự vật và chất hoàn toàn đồng nhất với nhau."],"a":3},{"n":649,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Chất của sự vật được biểu hiện thông qua thuộc tính của sự vật.","Mọi thuộc tính đều biểu hiện chất của sự vật.","Thuộc tính thay đổi, luôn làm cho chất của sự vật thay đổi."],"a":0},{"n":650,"q":"Luận điểm sau đây thuộc lập trường triết học nào: \"Chất của sự vật tồn tại do phương pháp quan sát sự vật của con người quyết định\".","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật siêu hình."],"a":1},{"n":651,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Chất của sự vật phụ thuộc vào số lượng các yếu tố tạo thành sự vật.","Chất của sự vật phụ thuộc vào phương thức kết hợp các yếu tố của sự vật.","Mọi sự thay đổi phương thức kết hợp các yếu tố của sự vật, đều không làm cho chất của sự vật thay đổi."],"a":2},{"n":652,"q":"Luận điểm sau đây thuộc lập trường triết học nào: Chất tồn tại khách quan trước khi sự vật tồn tại, quyết định đến sự tồn tại của sự vật.","o":["Chủ nghĩa duy tâm khách quan.","Chủ nghĩa duy tâm chủ quan.","Chủ nghĩa duy vật siêu hình.","Chủ nghĩa duy vật biện chứng."],"a":0},{"n":653,"q":"Điền tập hợp từ thích hợp vào chỗ trống của câu sau để được định nghĩa khái niệm \"lượng\": Lượng là phạm trù triết học dùng để chỉ...(1) ... của sự vật về mặt ...(2) ... của sự vận động và phát triển cũng như các thuộc tính của sự vật.","o":["1- tính quy định vốn có, 2- số lượng, quy mô, trình độ, nhịp điệu","1- mối liên hệ và phụ thuộc, 2- bản chất bên trong.","1- mức độ quy mô, 2- chất lượng, phẩm chất."],"a":0},{"n":654,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Lượng là tính quy định vốn có của sự vật.","Lượng nói lên quy mô, trình độ phát triển của sự vật","Lượng phụ thuộc vào ý chí của con người.","Lượng tồn tại khách quan gắn liền với sự vật."],"a":2},{"n":655,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Chất và lượng của sự vật đều tồn tại khách quan.","Không có chất lượng thuần tuý tồn tại bên ngoài sự vật.","Sự phân biệt giữa chất và lượng phụ thuộc vào ý chí của con người.","Sự phân biệt giữa chất và lượng của sự vật có tính chất tương đối."],"a":2},{"n":656,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Sự vật nào cũng là sự thống nhất giữa mặt chất và lượng.","Tính quy định về chất nào của sự vật cũng có tính quy định về lượng tương ứng.","Tính quy định về chất không có tính ổn định.","Tính quy định về lượng nói lên mặt thường xuyên biến đổi của sự vật."],"a":2},{"n":657,"q":"Theo quan điểm của CNDVBC luận điểm nào sau đây là đúng?","o":["Độ là phạm trù chỉ sự biến đổi của lượng.","Độ là phạm trù chỉ sự biến đổi của chất.","Độ là phạm trù triết học chỉ giới hạn biến đổi của lượng, trong đó chưa làm thay đổi chất của sự vật."],"a":2},{"n":658,"q":"Giới hạn từ 0oC đến 100oC được gọi là gì trong quy luật lượng - chất?","o":["Lượng","Độ","Bước nhảy","Chất"],"a":0},{"n":659,"q":"Khi nước chuyển từ trạng thái lỏng sang trạng thái khí tại 100oC được gọi là gì trong quy luật lượng - chất?","o":["Độ","Chuyển hoá","Bước nhảy","Tiệm tiến"],"a":2},{"n":660,"q":"Trong một mối quan hệ nhất định cái gì xác định sự vật?","o":["Tính quy định về lượng","Tính quy định về chất","Thuộc tính của sự vật."],"a":1},{"n":661,"q":"Tính quy định nói lên sự vật trong một mối quan hệ nhất định đó, gọi là gì?","o":["Chất","Độ","Lượng","Bước nhảy"],"a":0},{"n":662,"q":"Tính quy định nói lên quy mô trình độ phát triển của sự vật được gọi là gì?","o":["Chất","Độ","Lượng","Điểm nút"],"a":2},{"n":663,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Trong giới hạn của độ sự thay đổi của lượng chưa làm cho chất của sự vật biến đổi.","Trong giới hạn của độ sự thay đổi của lượng đều đưa đến sự thay đổi về chất của sự vật.","Chỉ khi lượng đạt đến giới hạn của độ mới làm cho chất của sự vật thay đổi."],"a":1},{"n":664,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là sai?","o":["Không phải mọi sự biến đổi của lượng đều đưa đến sự biến đổi của chất.","Sự thay đổi của lượng phải đạt đến một giới hạn nhất định mới làm cho chất của sự vật thay đổi.","Mọi sự thay đổi của lượng đều đưa đến sự thay đổi về chất của sự vật."],"a":2},{"n":665,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Sự biến đổi về chất là kết quả sự biến đổi về lượng của sự vật.","Không phải sự biến đổi về chất nào cũng là kết quả của sự biến đổi về lượng.","Chất không có tác động gì đến sự thay đổi của lượng."],"a":0},{"n":666,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng luận điểm nào sau đây là đúng?","o":["Phát triển của sự vật chỉ bao hàm sự thay đổi về lượng.","Phát triển của sự vật chỉ bao hàm sự thay đổi về chất.","Quá trình phát triển của sự vật là quá trình chuyển hoá từ sự thay đổi dần dần về lượng sang sự thay đổi về chất và ngược lại."],"a":2},{"n":667,"q":"Câu ca dao: Một cây làm chẳng nên non","o":["Quy luật mâu thuẫn","Quy luật phủ định của phủ định","Quy luật chuyển hoá từ những sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại."],"a":2},{"n":668,"q":"Trong hoạt động thực tiễn sai lầm của sự chủ quan, nóng vội là do không tôn trọng quy luật nào?","o":["Quy luật mâu thuẫn","Quy luật phủ định của phủ định","Quy luật lượng - chất"],"a":2},{"n":669,"q":"Trong hoạt động thực tiễn sai lầm của trì trệ bảo thủ là do không tôn trọng quy luật nào của phép biện chứng duy vật?","o":["Quy luật lượng - chất.","Quy luật phủ định của phủ định.","Quy luật mâu thuẫn."],"a":0},{"n":670,"q":"Lênin nói quy luật mâu thẫn có vị trí như thế nào trong phép biện chứng duy vật?","o":["Là hạt nhân của phép biện chứng duy vật, vạch ra nguồn gốc bên trong của sự vận động và phát triển.","Vạch ra xu hướng của sự phát triển.","Vạch ra cách thức của sự phát triển."],"a":0},{"n":671,"q":"Trong lý luận về mâu thuẫn người ta gọi hai cực dương và âm của thanh nam châm là gì?","o":["Hai mặt","Hai mặt đối lập","Hai yếu tố.","Hai thuộc tính"],"a":1},{"n":672,"q":"Trong lý luận về mâu thuẫn người ta gọi quá trình đồng hoá và dị hoá trong cơ thể sống là gì?","o":["Hai yếu tố","Những sự vật","Những thuộc tính","Hai mặt đối lập."],"a":3},{"n":673,"q":"Trong quy luật mâu thuẫn tính quy định về chất và tính quy định về lượng được gọi là gì?","o":["Hai sự vật","Hai mặt đối lập","Hai thuộc tính","Hai quá trình"],"a":1},{"n":674,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Mặt đối lập là những mặt có đặc điểm trái ngược nhau.","Mặt đối lập tồn tại khách quan trong các sự vật","Mặt đối lập không nhất thiết phải gắn liền với sự vật","Mặt đối lập là vốn có của các sự vật, hiện tượng"],"a":2},{"n":675,"q":"Theo quan điểm của CNDVBC các mặt đối lập do đâu mà có?","o":["Do ý thức cảm giác của con người tạo ra.","Do ý niệm tuyệt đối sinh ra","Vốn có của thế giới vật chất, không do ai sinh ra."],"a":2},{"n":676,"q":"Theo quan điểm của chủ nghĩa duy vật biện chứng, luận điểm nào sau đây là sai?","o":["Các mặt đối lập nằm trong sự liên hệ với nhau, không có mặt đối lập nào tồn tại biệt lập.","Không phải lúc nào các mặt đối lập cũng liên hệ với nhau.","Các mặt đối lập liên hệ, tác động qua lại với nhau một cách khách quan."],"a":1},{"n":677,"q":"Luận điểm nào sau đây là không
