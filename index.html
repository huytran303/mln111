à sự tuần hoàn, lặp đi, lặp lại mà không có sự thay đổi về chất.","Phát triển là vận động nhưng không phải mọi vận động đều là phát triển.","Đặc điểm chung của sự phát triển là tính tiến lên theo đường xoáy ốc, có kế thừa, có sự d¬ường như lặp lại sự vật, hiện tượng cũ nhưng trên cơ sở cao hơn."],"a":1},{"n":1099,"q":"Phát hiện đáp án sai về nhận thức trong các đáp án sau:","o":["Nhận thức là quá trình phản ánh hiện thực khách quan, là quá trình tạo thành tri thức về thế giới khách quan trong bộ óc con người","Nhận thức là quá trình tác động biện chứng giữa chủ thể nhận thức và khách thể nhận thức trên cơ sở hoạt động thực tiễn của con người.","Nhận thức là quá trình phản ánh hiện thực khách quan một cách tích cực, chủ động, sáng tạo bởi con người trên cơ sở thực tiễn mang tính lịch sử cụ thể.","Nhận thức là quá trình phản ánh hiện thực khách quan một cách thụ động của con người trên cơ sở thực tiễn mang tính lịch sử cụ thể."],"a":3},{"n":1100,"q":"Câu nào dưới đây thể hiện quan điểm Duy tâm về vai trò của Ý thức:","o":["Ý thức tự nó chỉ làm thay đổi tư tưởng. Như vậy ý thức hoàn toàn không có tác dụng gì đối với thực tiễn.","Ý thức là phản ánh sáng tạo thực tại khách quan và đồng thời có tác động trở lại mạnh mẽ thực tại đó thông qua hoạt động thực tiễn của con người.","Ý thức là cái phụ thuộc vào nguồn gốc sinh ra nó. Vì thế chỉ có vật chất mới là cái năng động, tích cực","Ý thức là cái quyết định vật chất . Vật chất chỉ là cái thụ động, phụ thuộc về ý thức."],"a":3},{"n":1101,"q":"Câu nào dưới đây trả lời đúng, ngắn gọn và rõ nhất về Sự phát triển theo Phép biện chứng duy vật:","o":["Là xu hướng vận động làm nảy sinh cái mới.","Là xu hướng thống trị của thế giới, tiến lên từ đơn giản đến phức tạp, từ thấp đến cao, từ kém hoàn thiện đến hoàn thiện hơn theo những quy luật nhất định.","Là xu hướng vận động tiến lên.","Là xu hướng vận động làm cho sự vật, hiện tượng tăng lên chỉ về khối lượng, thể tích, quy mô, trọng lượng, kích thước."],"a":0},{"n":1102,"q":"Xác định câu trả lời đúng và đầy đủ nhất về Thực tiễn:","o":["Là toàn bộ những hoạt động của con người có tính vật chất, tính mục đích, tính xã hội - lịch sử làm biến đổi tự nhiên, xã hội theo hướng tích cực, tiến bộ, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính xã hội - lịch sử làm biến đổi tự nhiên, xã hội theo hướng tích cực, tiến bộ, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính vật chất, làm biến đổi tự nhiên - xã hội theo hướng tích cực, trong đó sản xuất vật chất là thực tiễn cơ bản nhất.","Là toàn bộ những hoạt động của con người có tính mục đích, tính vật chất, tính lịch sử - xã hội, trong đó sản xuất tinh thần là thực tiễn cơ bản nhất."],"a":0},{"n":1103,"q":"Xác định quan niệm sai về Chân lý trong các câu sau:","o":["Nội dung chân lý là chủ quan vì nó do đầu óc con người tạo ra.","Chân lý bao giờ cũng cụ thể, không có chân lý trừu tượng.","Có thể hiểu chân lý cũng là sự phù hợp giữa chủ quan với khách quan.","Chân lý là kiến thức đúng đắn được thực tiễn kiểm nghiệm."],"a":0},{"n":1104,"q":"Tìm câu trả lời đúng nhất về mối quan hệ biện chứng giữa Bản chất và Hiện tượng:","o":["Hiện tượng biểu hiện ra bên ngoài của bản chất, thường làm sai lệch bản chất nên tốt nhất là nhận thức, hành động đi thẳng vào bản chất sẽ tránh được sai lầm.","Phương pháp nhận thức đúng là đi từ hiện tượng đến bản chất, đi từ bản chất ít sâu sắc đến bản chất sâu sắc hơn, không nhầm lẫn hiện tượng với bản chất.","Nhận thức và hành động của con người không thể đạt tới bản chất của sự vật vì nó bị vô số hiện tượng bao bọc bên ngoài, trong đó lại có những hiện tượng làm sai lạc, xuyên tạc bản chất.","Chỉ có bản chất mới là mối quan hệ khách quan, còn hiện tượng là mối quan hệ chủ quan do tác động tiêu cực của con người tạo ra làm sai lạc bản chất. Nên muốn nhận thức đúng bản chất, con người đi thẳng vào tìm hiểu và nắm lấy bản chất sẽ tránh được sai lầm."],"a":1},{"n":1105,"q":"Tìm câu thể hiện đúng nhất về ý nghĩa phương pháp luận của mối quan hệ giữa Nội dung và Hình thức trong các câu sau:","o":["Trong nhận thức và hành động không được tách rời hoặc tuyệt đối hoá một mặt nội dung hay hình thức. Phải coi trọng nội dung đồng thời phải chú trọng thích đáng tới hình thức, bảo đảm cho nội dung có một hình thức phù hợp nhất. Khi một trong chúng đã tỏ ra lỗi thời thì phải thay đổi cho phù hợp.","Trong nhận thức và hành động không được tách rời, tuyệt đối hoá một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của hình thức đồng thời coi trọng nội dung. Khi một trong chúng đã lỗi thời thì phải thay đổi cho phù hợp, chống chủ nghĩa hình thức.","Trong nhận thức và hành động không được tách rời, tuyệt đối hoá một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của nội dung.","Trong nhận thức và hành động không được tuyệt đối hoá một mặt nội dung hay hình thức."],"a":0},{"n":1106,"q":"Tìm câu thể hiện quan điểm Siêu hình về quan hệ biện chứng giữa Nguyên nhân -Kết quả trong các câu sau:","o":["Trong những điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại, nguyên nhân và kết quả có thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân chỉ sinh ra một kết quả và ngược lại, nguyên nhân và kết quả không thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có sau kết quả. Một nguyên nhân có thể sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hoá cho nhau.","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hoá cho nhau trong quá trình vận động."],"a":1},{"n":1107,"q":"Tìm câu thể hiện quan điểm Duy tâm về ý nghĩa phương pháp luận rút ra từ quan hệ Nguyên nhân – Kết quả:","o":["Để có kết quả theo mong muốn phải biết phát hiện và điều khiển các nguyên nhân, khắc phục những nguyên nhân ngược chiều, tạo điều kiện cho nguyên nhân cùng chiều hướng tới kết quả.","Vì nguyên nhân có trước kết quả nên muốn có kết quả theo mong muốn thì chờ đợi ở nguyên nhân sẽ xảy ra. Sau đó lại sử dụng kết quả đó tạo ra nguyên nhân tiếp sau để được hưởng kết quả cao hơn.","Quan hệ nhân quả là quan hệ do chủ quan của con người tạo ra cho nên trong nhận thức và hành động con người chắc chắn nhận được kết quả do mình tạo ra.","Nguyên nhân có trước kết quả vì thế cứ chờ đợi thì sớm hay muộn kết quả sẽ tới."],"a":2},{"n":1108,"q":"Tìm câu thể hiện đúng nhất về giá trị phương pháp luận của mối quan hệ giữa cái Tất nhiên và Ngẫu nhiên trong các câu sau:","o":["Thông qua nghiên cứu nhiều cái ngẫu nhiên để phát hiện cái tất nhiên. Nắm lấy cái tất nhiên để hành động đồng thời dự phòng xử lý kịp thời với cái ngẫu nhiên.","Mục đích của nhận thức và hành động là đạt tới cái tất nhiên để có tự do. Nhưng cái tất nhiên tồn tại như vật tự nó nên con người chỉ có thể nắm được cái ngẫu nhiên.","Nắm lấy cái tất nhiên, chi phối, điều khiển, phòng ngừa cái ngẫu nhiên. Đó là mục đích của nhận thức và hành động của con người trong khi giải quyết mối quan hệ giữa tất nhiên và ngẫu nhiên.","Nắm lấy cái tất nhiên để chi phối, điều khiển, phòng ngừa mặt tác hại của ngẫu nhiên. Nhận thức không phải bằng cách đi từ phân tích ngẫu nhiên mà đi thẳng vào cái tất nhiên."],"a":3},{"n":1109,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy vật tầm thường trong lịch sử trong những luận điểm sau:","o":["Kiến trúc thượng tầng pháp lí và chính trị phụ thuộc cơ cấu kinh tế của xã hội","Sự ra đời cũng như mất đi trong tương lai của XH có giai cấp đều dựa trên tính tất yếu kinh tế","Trong tất cả những chuyển biến lịch sử thì chuyển biến về chính trị là chuyển bién quan trọng nhất, quyết định sự phát triển của lịch sử","Nhân tố Kinh tế là nhân tố quyết định duy nhất trong lịch sử"],"a":3},{"n":1110,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy tâm chủ quan trong 4 luận điểm sau:","o":["Thế giới tồn tại khách quan còn quy luật vận động và phát triển của thế giới đó do ý thức con người tạo ra","Phát triển là quá trình tiến lên theo đường thẳng","Mỗi chân lí khoa học dù là có tính tương đối vẫn chứa đựng của yếu tố chân lí tuyệt đối","Vật lí là thực tại khách quan, tồn tại không lệ thuộc vào cảm giác."],"a":0},{"n":1111,"q":"Xác định câu trả lời đúng vai trò của thực tiễn:","o":["Là cơ sở, mục đích, động lực chủ yêdu và trực tiếp của nhận thức và là tiêu chuẩn của chân lý.","Là nguồn gốc, cơ sở, mục đích của nhận thức.","Là mục đích, cơ sở, động lực của nhận thức và làm tiêu chuẩn cho kinh nghiệm","Là thước đo để phát hiện sự đúng sai của cảm giác, của kinh nghiệm và của chân lý."],"a":0},{"n":1112,"q":"Xác định quan niệm sai về phủ định biện chứng. Phủ định biện chứng là:","o":["Phủ định chấm dứt quá trình phát triển","Phủ định có tính kế thừa","Phủ định có tính khách quan, phổ biến.","Phủ định đồng thời cũng là sự khẳng định"],"a":0},{"n":1113,"q":"Hãy phát hiện một điểm tóm tắt sai nội dung trong các tóm tắt sau đây:","o":["Đó là quy luật xã hội phổ biến trong tất cả các xã hội có đối kháng giai cấp","Lực lượng sản xuất và quan hệ sản xuất là hai mặt của phương thức sản xuất, tồn tại không thể tách rời","Quy luật này vạch rõ sự phụ thuộc khách quan của quan hệ sản xuất vào sự phát triển của lực lượng sản xuất, đồng thời quan hệ sản xuất cũng tác động trở lại lực lượng sản xuất","Tác động biện chứng giữa 2 mặt đó tạo thành quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất"],"a":0},{"n":1114,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy vật biện chứng trong bốn luận điểm sau:","o":["Mâu thuẫn là nguồn gốc, động lực của mọi sự vận động và phát triển","Phủ định của phủ định là sự loại bỏ hoàn toàn sự vật cũ","Nhân quả là mối liên hệ có tính chủ quan, do con người xác lập","Nhận thức chẳng qua chỉ là phức hợp các cảm giác của con người, do đó không có cảm giác cũng không có nhận thức"],"a":0},{"n":1115,"q":"Xác định ý kiến đúng nhất trong các ý kiến sau?","o":["Do vật chất quyết định ý thức lên giám đốc chỉ cần tăng lương cho người lao động là họ sẽ hăng hái sản xuất ra nhiều sản phẩm tốt hơn","Do vai trò tác động tích cực của ý thức nên chỉ cần thường xuyên giáo dục ý thức, tư tưởng cho người lao động là họ sẽ tự giác hăng hái sản xuất ra nhiều sản phẩm tốt","Vì vật chất và ý thức có quan hệ biện chứng nên đối với người lao động phả vừa khuyến khích vật chất vừa giáo dục chính trị tư tưởng","Vì chân lý là cụ thể nên phải tùy hoàn cảnh, tùy đối tượng cụ thể mà tăng thêm khuyến khích vật chất hoặc tăng cường giáo dục chính trị tư tưởng hoặc đồng thời nhấn mạnh cả hai yếu tố đó, không nên vận dụng theo một sơ đồ chu quan, cứng nhắc"],"a":3},{"n":1116,"q":"Hãy chỉ ra luận điểm thể hiện lập trường duy tâm lịch sử trong các luận điểm sau:","o":["Quan hệ sản xuất là những quan hệ xã hội có tính vật chất, quyết định mọi quan hệ xã hội khác","Nguyên nhân của mọi biến đổi trong lịch sử, xét đến cùng là do tư tưởng của con người đang luôn luôn thay đổi","Cơ sở hạ tầng quyết định kiến trúc thượng tầng so với vai trò tích cực trong sưj phát triển lịch sử","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử"],"a":1},{"n":1117,"q":"Xác định câu trả lời đúng nhất về mối quan hệ biện chứng giữa lượng và chất:","o":["Sự vật nào cũng có sự thống nhất giữa lượng và chất. Chất và lượng có mâu thuẫn. Sự biến đổi về lượng tích lũy lại dẫn đến sự biến đổi về chất. Sự biến đổi căn bản về chất tạo ra bước nhảy và chuyển sự vật cũ sang sự vật mới","Chỉ có sự thay đổi từ lượng đến chất là theo xu hướng tiến lên. Còn sự thay đổi từ chất đến lượng là không thể diễn ra","Sự biến đổi về chất nhanh hơn sự biến đổi về lượng mới tạo ra bước thay đổi căn bản về chất. Chất cũ mất đi, sự vật cũ bị phá vỡ, sự vật mới sinh ra","Sự biến đổi về chất và lượng không phải mâu thuẫn. Chỉ có sự khác nhau là lượng biến đổi nhanh hơn chất. Bước nhảy chỉ xảy ra khi chất biến đổi căn bản"],"a":0},{"n":1118,"q":"Những nguyên tăc cơ bản của lý luận nhận thức là gì? Xác định câu trả lời đúng nhất?","o":["Là sự thùa nhận thế giới khách quan tồn tại độc lập với ý thức, thừa nhận khả năng phản ánh đúng thế giới khách quan vào ý thức con người, đối với con người không có gì là không thể biết, là sự thừa nhận nhận thức là quá trình biện chứng và cơ sở chủ yếu và trực tiếp nhất của nhận thức là thực tiễn","Là sự thùa nhận thế giới khách quan tồn tại độc lập ngoài ý thúc con người, là khả năng nhận thức của con người, đối với con người có nhiều điều không thể biết, là thừa nhận tính biện chứng của quá trình nhận thức","Là quá trình biện chứng, thừa nhận đối tượng nhận thức là khách quan, chủ thể nhận thức của con người là có hạn, do đó kết quả khả năng nhận thức của con người là đáng nghi ngờ","Là khẳng định khả năng nhận thức đúng của con người bằng tổng hợp các cảm giác để đạt tới chân lý"],"a":0},{"n":1119,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy vật biện chứng trong những luận điểm sau:","o":["Mâu thuẫn là nguồn gốc, động lực của mọi sự vận động và phát triển","Nhận thức chẳng qua chỉ là sự phức hợp các cảm giác của con người, do đó không có cảm giác cũng không có nhận thức","Nhân quả là mối liên hệ có tính chủ quan, do con người xác lập","Phủ định của phủ định là sự loại bỏ hoàn toàn sự vật cũ"],"a":0},{"n":1120,"q":"Chân lý có tính chất gì, xác định câu trả lời đúng?","o":["Chân lý có tính cụ thể, có nội dung khách quan, vừa có tính tuơng đối, vừa có tính tương đối","Không có chân lý trừu tượng, chân lý có hình thức chủ quan, nội dung khách quan, không có tính tương đối vì chân lý luôn luôn đúng trong mọi hoàn cảnh","Chân lý có nội dung khách quan,hình thức chủ quan, chân lý có tình trừu tượng cao siêu, chân lí còn có tính tuyệt đối và tính tương đối","Chân lý có hình thưc chủ quan và nội dung khách quan, chân lý bao giờ cũng cụ thể, chỉ có chân lý tương đối, không có chân lý tuyệt đối vì thực tế luôn luôn biến đổi và nhận thức con người là có hạn"],"a":0},{"n":1121,"q":"Xác định câu trả lời đúng nhất về ý nghĩa phương pháp luận của mối quan hệ giữa lượng và chất:","o":["Lượng - chất có quan hệ biện chứng. Phải kiên trì tích lũy về lượng mới có sự thay đổi về chất, tạo ra bước ngoặt. Không được nóng vội, chủ quan, duy ý chí, đốt cháy giai đoạn. Ngược lại, chỉ có thay đổi căn bản về chất mới chuyển được cái cũ sang cái mới","Lượng- chất có quan hệ biện chứng. Không được nóng vội, chủ quan. duy ý chí khi lượng đã được tích lũy đủ và ngược lại","Lượng- chất có quan hệ biện chứng. Không được nóng vội, chủ quan, duy ý chí khi chưa tích lũy được lượng cần thiết. Nhưng đôi khi chưa tích lũy đủ lượng cũng phải thay đổi về chất. Ngược lại, không được trù trừ, do dự, bảo thủ khi lượng đã được tích lũy","Phải kiên quyết, không trù trừ, do dự, thay đổi về chất khi lượng dã được tích lũy"],"a":0},{"n":1122,"q":"Hãy chỉ ra luận điểm thể hiện lập trường duy vật siêu hình trong các luận điểm sau:","o":["Động vật và thực vật hoàn toàn khác nhau, không có nguồn gốc chung","Mọi tri thức dù trực tiếp hay gián tiếp, dù ở trình độ cao hay thấp, xét đến cùng đều bắt nguồn từ thực tiễn","Sự phát huy tính năng động chủ quan của con người muốn có hiệu quả bao giờ cũng phải dựa vào cơ sở vật chất","Không có lí luận thì hoạt động thực tiễn của con người mò mẫm, mất phương hướng. Do đó lí luận phải có trước và không phụ thuộc vào thực tiễn"],"a":0},{"n":1123,"q":"Nêu mối quan hệ biện chứng giữa lượng và chất của sự vật. Xác định câu trả lời đúng nhất:","o":["Sự vật nào cũng có sự thống nhất giưa lượng và chất. Chất và lượng có mâu thuẫn. Sự biến đổi về lượng tích lũy lại dẫn đến sự biến đổi về chất. Sự biến đổi căn bản về chất tạo ra bước nhảy và chuyển sự vật cũ sang sự vật mới","Sự biến đổi về chất và lượng không phải mâu thuẫn. Chỉ có sự khác nhau là lượng biến đổi nhanh hơn chất. Bước nhảy chỉ xảy ra khi chất biến đổi căn bản","Sự biến đổi về chất nhanh hơn biến đổi về lượng mới tạo ra bước thay đổi căn bản về chất. Chất cũ mất đi, sự vật cũ bị phá vỡ, sự vật mới sinh ra","Chỉ có sự thay đổi từ lượng đến chất là theo xu hướng tiến lên. Còn sự thay đổi từ chất đến lượng là không thể diễn ra"],"a":0},{"n":1124,"q":"Tính năng động, sáng tạo của ý thức dựa trên những điều kiện nào? Xác định câu trả lời đúng nhất?","o":["Ý thức chỉ phụ thuộc vật chất khi nó sinh ra( nguồn gốc). Còn khi đã hình thành thì nó không phụ thuộc vào vật chất nữa, nó có đời sống riêng. Chỉ khi đó ý thức mới phát huy được tính năng động, sáng tạo","Sự năng động, sáng tạo của ý thức luôn luôn dựa trên những tiền đề vật chất và hoạt động thực tiễn của con người","Tính năng động, chủ quan của con người muốn có hiệu quả bao giờ cũng phải thông qua hoat động thực tiễn của con người, tức là hoạt động có tính vật chất","Những nhà nhị nguyên luận coi vai trò của ý thức và vật chất ngang nhau, chúng tự thân vận động theo quy luật riêng"],"a":1},{"n":1125,"q":"Hãy chỉ ra luận điểm thể hiện lập trường duy vật biện chứng trong những luận điểm sau đây:","o":["Chân lý chỉ tồn tại trong nhận thức con người. Vì vậy nội dung của chân lý là do chủ quan của con người tạo ra","Sự phát huy tính năng động chủ quan của con người muốn có hiệu quả bao giờ cũng phải dựa vào cơ sở vật chất","Chân lý là tri thức phản ánh đúng hiện thực khách quan và đã được thực tiễn kiểm nghiệm, vì vậy, có thể áp dụng chân lí đó vào mọi nơi, mọi lúc, mọi việc đều đúng","Giới động vậy và thực vật hoàn toàn tách rời nhau, không có nguồn gốc chung"],"a":1},{"n":1126,"q":"Phát hiện một câu trả lời sai về vai trò của cơ sở hạ tầng đối với kiến trúc thượng tầng:","o":["Cơ sở hạ tầng nào thì sinh ra kiến trúc thượng tầng ấy","Những biến đổi căn bản trong cơ sở hạ tầng sớm hay muộn cũng sẽ dẫn tới sự biến đổi căn bản trong kiến trúc thượng tầng","Cũng có những yếu tố thuộc kiến trúc thượng tầng cũ tồn tại dai dẳng sau khi cơ sở kinh tế sinh ra nó không tồn tại","Cơ sở hạ tầng cũ mất đi thì kiến trúc thượng tầng tương ứng với nó sẽ mất theo ngay lập tức"],"a":3},{"n":1127,"q":"Xác định quan niệm sai về thực tiễn?","o":["Thực tiễn là nguồn gốc của nhận thức vì qua thực tiễn bộc lộ các thuojc tính, mối liên hệ bản chất của đối tượng","Thực tiễn là kết quả của nhận thức, trong đó sự phân tích lí luận là cơ bản nhất","Thực tiễn là động lực của nhận thức, nó đòi hỏi tư duy con người phải giải đáp những vấn đề đặt ra","Thực tiễn là tiêu chuẩn của chân lý. Nhận thức đúng hay sai không được xác định chỉ trong nhận thức"],"a":1},{"n":1128,"q":"Phát hiện một luận điểm sai trong các luận điểm sau đây:","o":["Các yếu tố của cấu trúc thượng tầng đều nảy sinh trên cơ sở hạ tầng, phản ánh cơ sở hạ tầng","Các yếu tố có cấu trúc thượng tầng không tồn tại tách rời nhau, mà tác động qua lại lẫn nhau","Những tác động qua lại trong nội bộ kiến trúc thượng tầng dẫn tới những kết quả nhiều khi không thể giải thích được chỉ bằng những nguyên nhân kinh tế","Các yếu tố thuộc cấu trúc thượng tầng đều liên hệ như nhau đối với cơ sở hạ tầng"],"a":3},{"n":1129,"q":"Hãy phát hiện một điểm tóm tắt sai nội dung của phạm trù quan hệ sản xuất:","o":["Mối quan hệ giữa người và người trong quá trình sản xuất được gọi là quan hệ sản xuất","Cũng như lực lượng sản xuất, quan hệ sản xuất thuộc lĩnh vực đời sống vật chất của xã hội","Tính vật chất của quan hệ sản xuất được biểu hiện ở chỗ chúng tồn tại khách quan, phụ thuộc vào ý thúc con người","Quan hệ sản xuất là quan hệ kinh tế cơ bản của một hình thái kinh tế-xã hội"],"a":2},{"n":1130,"q":"Phát hiện một điểm giải thích chưa chính xác trong những giải thích nguyên tắc nhận thức \" Phải xem xét sự vật trong sự phát triển\" như sau:","o":["Theo nguyên tắc này ta chỉ cần liệt kê các giai đoạn vận động lịch sử mà sự vật đã trải qua là hiểu được thực chất của sự phát triển của sự vật","Cơ sở lý luận của nguyên tắc này là nguyên lý về sự phát triển","Theo nguyên tắc này cần phân đôi cái thống nhất và nhận thức các bộ phận đối lập của nó để hiểu được nguồn gốc và động lực phát triển của sự vật","Theo nguyên tắc này, cần vận dụng quy luật Lượng-chất để hiểu được cách thức phát triển của sự vật"],"a":0},{"n":1131,"q":"Phát hiện một điểm giải thích chưa chính xác về nguyên tắc nhận thức \" Tính toàn diện của sự xem xét\":","o":["Cơ sở lý luận của nguyên tắc này là Nguyên lí về mối liên hệ phổ biến","Nguyên lí này đòi hỏi khi nhận thức về sự vật phải xem xét tất cả các mặt, các mối liên hệ của nó","Phải xem xét sự vật trong tính toàn vẹn và phưc tạp của nó","Căn cứ của nguyên tắc này là tư duy của con người ở mỗi thời điểm đều có thể bao quát được hết mọi mặt phong phú của sự vật"],"a":3},{"n":1132,"q":"Hãy chỉ ra một biểu hiện không đúng với bệnh chủ quan duy ý chí:","o":["Suy nghĩ vadd hành động nóng vội","Chạy theo nguyện vọng chủ quan","Không tính tới điều kiện và khả năng thực tế","Luôn tôn trọng quy luật khách quan"],"a":3},{"n":1133,"q":"Hãy chỉ ra một nguyên tắc nhận thức và hành động để khắc phục biện pháp chủ quan duy ý chí không phù hợp trong những nguyên tắc sau:","o":["Lấy ý chí và nguyện vọng làm điểm xuất phát cho mọi chủ trương, kế hoạch công tác","Tôn trọng và hành động theo quy luật khách quan","Nhìn thẳng vào sự vật, đánh giá đúng sự thật, nói rõ sự thật","Lấy dân làm gốc, lawgs nghe nguyện vọng chính đáng của dân"],"a":0},{"n":1134,"q":"Phát hiện luận điểm sai trong các luận điểm sau đây:","o":["Đối tượng lao động là yếu tố động nhất và cách mạng nhất trong lực lượng sản xuất","Tư liệu lao động là cơ sở của sự kế tục lịch sử","Cái cối quay xay quay bằng tay đưa lại xã hội có lãnh chúa phong kiến","Năng suất lao động xã hội là thước đo trình độ phát triển của lực lượng sản xuất"],"a":0},{"n":1135,"q":"Hãy chỉ ra luận điểm thuộc lập trường triết học duy vật siêu hình trong lịch sử:","o":["Quan hệ sản xuất là những quan hệ xã hội có tính vật chất, quyết định mọi quan hệ xã hội khác","Nguyên nhân của mọi biến đổi trong lịch sử, xét đến cùng là do tư tưởng của con người đang luôn luôn thay đổi","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sử","Cơ sở hạ tầng quyết định kiến trúc thượng tầng nhưng kiến trúc thượng tầng có vai trò tích cực trong sự phát triển lịch sử"],"a":2},{"n":1136,"q":"Hãy chỉ ra một điểm viết không đúng về tính độc lập, tương đối của ý thức:","o":["Thường lạc hậu hơn so với tồn tại xã hội","Không phụ thuộc vào tồn tai xã hội","Tính kế thừa trong sự phát triển","Có thể vượt trước tồn tại xã hội"],"a":1},{"n":1137,"q":"Nêu vai trò của thực tiễn đối với nhận thức? Xác đinh câu trả lời thiếu nội dung nhất:","o":["Là cơ sở, mục đích, động lực chủ yếu và trực tiếp của nhận thức và là tiêu chuẩn của chân lý","Là nguồn gốc, cơ sở, mục đích của nhận thức","Là thước đo của nhận thức tình cảm, là nguồn gốc, cơ sở, động lực của nhận thức","Thước đo để phát hiện sự đúng sai của cảm giác, của kinh nghiệm và của lí luận"],"a":3},{"n":1138,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy tâm trong bốn luận điểm sau:","o":["Chân lý là tri thức phản ánh đúng hiện thực khách quan và đã được thực tiễn kiểm nghiệm, vì vậy, có thể áp dụng chân lý đó vào mọi nơi, mọi lúc, mọi việc đều đúng","Giới động vật và thực vật hoàn toàn tách rời nhau, không có nguồn gốc chung","Sự phát huy tính năng động chủ quan của con người muốn có hiệu quả bao giờ cũng phải dựa vào cơ sở vật chất","Chân lý chỉ tồn tại trong nhận thức con người. Vì vậy nội dung của chân lý là do chủ quan của con người tạo ra"],"a":3},{"n":1139,"q":"Hãy chỉ ra một yếu tố viết thừa về kết cấu của quan hệ sản xuất:","o":["Quan hệ thuê mướn nhân công","Quan hệ phân phối sản phẩm lao động","Quan hệ tổ chức quản lý","Quan hệ sở hữu về tư liệu sản xuất"],"a":0},{"n":1140,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy tâm trong bốn luận điểm sau:","o":["Không có lý luận thì hoạt động thực tiễn của con người mò mẫm, mất phương hướng. Do đó lý luận phải có trước và không phụ thuộc vào thực tiễn","Sự phát huy tính năng động chủ quan của con người muốn có hiệu quả bao giờ cũng phải dựa vào cơ ở vật chất","Động vật và thực vật hoàn toàn khác nhau, không có nguồn gốc chung"],"a":0},{"n":1141,"q":"Hãy chỉ ra luận điểm thuộc lập trương triết học duy tâm lịch sử trong các luận điểm sau:","o":["Chỉ dụa vào các quan hệ kinh tế hiện có cũng có thể giải thích đúng bất kỳ tư tưởng pháp quyền nào","Hoạt động của con người khác với động vật là có ý thức, vì thế ý thức của con người quyết định sự tồn tại của họ","Mọi thuyết đạo đức có từ trước đến nay, xét đến cùng, đều là sản phẩm của tình hình kinh tế lúc bấy giờ","Chỉ dựa vào các quan hệ kinh tế hiện có cũng có thể giải thích đầy đủ bất kỳ học thuyết chính trị nào"],"a":1},{"n":1142,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy vật siêu hình trong bốn luận điểm sau:","o":["Mâu thuẫn là nguồn gốc, động lực của mọi sự vận động, phát triển","Phủ định của phủ định là sự loại bỏ hoàn toàn sự vật cũ","Nhân quả là mối liên hệ có tính chủ quan, do con người xác lập","Nhận thức chẳng qua chỉ là phức hợp các cảm giác của con người, do đó không có cảm giác không có nhận thức"],"a":1},{"n":1143,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy vật siêu hình trong bốn luận điểm sau:","o":["Nhận thức của con người là một quá trình biện chứng","Cái tất nhiên và cái ngẫu nhiê không có quan hệ với nhau vì cái tất nhiên sâu sác, bên trong, ổn định còn cái ngẫu nhiên phong phú, bên ngoài, biến đổi","Nội dung chân lí có tính khách quan còn hình thức chân lí có tính chủ quan","Phủ định của phủ định là quy luật phổ biến trog tự nhiên, trog xã hội và tư duy"],"a":1},{"n":1144,"q":"Hãy chỉ ra luận điểm thuộc lập trường duy tâm lịch sử trong bốn luận điểm sau:","o":["Giai cấp nào chi phối những tư liệu sản xuất tinh thần thì cũng chi phối luôn cả những tư liệu và điều kiện sản xuất vật chất","Nhà nước và pháp luật là hai yếu tố chỉ có vai trò thụ động đối với các hoạt động kinh tế","Vì bản chất con người là tổng hòa các quan hệ xã hội nên không có các cá nhân khác nhau mà chỉ có xã hội với những con người hoàn toàn khác nhau","Trí tuệ của các lãnh tụ, các cá nhân kiệt xuất có ảnh hưởng to lớn đến tiến trình lịch sử nhưng quần chúng nhân dân mới có vai trò quyết định"],"a":0},{"n":1145,"q":"Hãy chỉ ra luận điểm thuộc lập trường triết học duy vật lịch sử trong các luận điểm sau:","o":["Quan hện sản xuất là những quan hệ xã hội có tính chất quyết định mọi quan hệ xã hội khác","Sự thịnh suy của mỗi dân tộc là do ý chí của người đúng đầu quốc gia quyết định","Nhân tố kinh tế là nhân tố quyết định duy nhất trong lịch sự","Nguyên hân của mọi biến đổi trong lịch sử, xét đến cùng là do tư tưởng của con người đang luôn luôn thay đổi"],"a":0},{"n":1146,"q":"Một sinh viên tóm tắt về \" tồn tại xã hội\" và \" ý thúc xã hội\" như sau. Hãy phát hiện một tóm tắt đúng?","o":["Tồn tại xã hội là toàn bộ những yếu tố vật chất và tinh thần mà xã hội dựa vào để phát triển bao gồm phương thức sản xuất, hoàn cảnh địa lý, dân số, Nhà nước và văn hóa","Tồn tại xã hội phụ thuộc vào ý thức xã hội","Ý thức xã hội có tính tương đối so với tồn tại xã hội","Ý thức cá nhân là thế giới tinh thần của từng con người riêng biệt, phản ánh hoàn cảnh sống rieng của con người đó. Vì vật, n nghèo nadn hơn ý thức xã hội"],"a":2},{"n":1147,"q":"Mâu thuẫn biện chứng là gì? Xác định câu trả lời sai nhất?","o":["Sự liên tác động lẫn nhau giữa các mặt , thuộc tính, có khuynh hướng biến đổi trái ngược nhau, tồn tại khách quan trong sự vật tạo thành mâu thuẫn biện chứng","Là khuynh hướng biến đổi trái ngược nhau trong sự liên hệ tác động qua lại của các mặt do con người tạo ra","Là sự tác động lẫn nhau của các mặt có sự khác nhau một cách khách quan, phổ biến giữa các sự vật hiện tượng","Là sự liên hệ phổ bến của các mặt, các thuộc tính trong sự vật hiện tượng, trong sự thống nhất với nhau"],"a":0},{"n":1148,"q":"Hãy chỉ ra luận điểm thuộc lập trường triết học duy tâm lịch sử trong những luận điểm sau:","o":["Trong tất cả những chuyển biến lịch sử thì chuyển biến kinh tế là chuyển biến quan trọng nhất, quyết định sự phát triển của lịch sử","Dân dĩ thực vi thiên","Do có được những lực lượng sản xuất mới, loài người thay đổi phương thức sản xuất của mình, đồng thời thay đổi tất cả những quan hệ xã hội của mình","Xã hội vận động theo những quy luật phụ thuộc vào ý thức của con người"],"a":3},{"n":1149,"q":"Mối quan hệ giữa mâu thuẫn bên trong với mâu thuẫn bên ngoài. Xác định câu trả lời đúng nhất?","o":["Mâu thuẫn bên trong và mâu thuẫn bên ngoài có tác động ngang nhau đối với sự phát triển, vì không có sự vật nào lại chỉ phát triển nhờ mâu thuẫn bên trong","Mâu thuẫn bên trong và mâu thuẫn bên ngoài đều là nguyên nhân của sự phát triển, nhưng suy tới cùng mâu thuẫn bên trong giữ vai trò quyết định nhất, còn mâu thuẫn bên ngoài là không thể thiếu, rất quan trọng.","Mâu thuẫn bên trong mói giữa vai trò quyết định tuyệt đối còn mâu thuẫn bên ngoài chỉ có tác động phụ đến sự phát triển","Mâu thuẫn bên trong hay bên ngoài có vai trò quyết định là tùy thuộc vào hoàn cảnh cụ thể, không thể khẳng định được"],"a":1},{"n":1150,"q":"Hãy chỉ ra luận điểm thuộc lập trường triết học duy vật siêu hình trong lịch sử trong những luận điểm sau:","o":["Xã hội là một tổ hợp các bộ phận được cấu thành và biến đổi một cách ngẫu nhiên","Xã hội là một tổng số các bộ phận cấu thành và biến đổi tùy theo ý muốn của con người","tất cả cái gì thúc đẩy con người hành động đều phải thông qua đầu óc của họ. Vì vậy phải tìm động lực sâu xa của lịch sử ở trong tư tưởng và ý chí của con gười","Quy luật kinh tế là quyết định mặc dù chính sách kinh tế có thể kìm hãm hay thúc đẩy sự hoạt động của quy luật đó"],"a":0},{"n":1151,"q":"Phát hiện luận điểm sai trong các luận điểm sau đây?","o":["Cái cối xay gió chạy bằng hơi nước đưa lại xã hội có nhà tư bản công nghiệp","Tư liệu lao động là cơ sở của sự kế tục lịch sử","Các quan hệ xã hội tồn tại độc lập với lực lượng sản xuất của xã hội","Trình độ phát triển của tư liệu lao động là thước đo trình độ chinh phục tự nhiên của loài người"],"a":2},{"n":1152,"q":"Hãy phát hiện một điểm tóm tắt có nội dung sai trong những tóm tắt sau:","o":["Trong đó phương thức sản xuất chi phối hoàn cảnh tự nhiên và dân số","Chỉ toàn bộ các yếu tố vật chất mà xã hội dựa vào để tồn tại và phát triển","Đó là một khái niệm cơ bản của chủ nghĩa duy vật lịch sử","bao gồm hoàn cảnh tự nhiên, dân số và phương thức sản xuất tinh thần"],"a":3},{"n":1153,"q":"Xác định quan niệm sai về mối quan hệ giữa cái chung và cái riêng:","o":["Cái chung chỉ tồn tại trong cái riêng, thông qua cái riêng","Quan hệ giữa cái chung và cái riêng là quan hệ tính chủ quan","Quan hệ giữa cái chung và cái riêng là có tính phổ biến","Cái chung là bộ phận còn cái riêng là cái toàn thể"],"a":1},{"n":1154,"q":"Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà là ở chỗ chúng sản xuất bằng cacgs nào, với những tư liệu lao động nào. Luận điểm trên đây thuộc lập trường triết học nào? Chọn câu trả lời đúng:","o":["Thuyết không thể biết","Chủ nghĩa duy tâm lịch sử","chủ nghĩa duy vật biejn chứng lịch sử","Chủ nghĩa duy vật tầm thường ( Chủ nghĩa duy vật kinh tế)"],"a":2},{"n":1155,"q":"Hãy phát hiện một điểm tóm tắt sai nội dung mối quan hệ biện chứng giữa lực lượng sản xuất và quan hệ sản xuất:","o":["Lực lượng sản xuất và quan hệ ản xuất là hai mặt của phương thức sản xuất tồn tại không tách rời nhau","Tác động biện chứng giữa hai mặt đó tạo thành quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất","Đó là quy luật xã hội phổ biến trong tất cả các xã họi khong có đối khàn giai cấp","Quy luật này vạch rõ sự phụ thuộc khách quan của quan hệ sản xuất vào sự phát triển của lực lượng sản xuất, đồng thời quan hệ vật chất cũng tác động trở lại lực lượng sản xuất"],"a":2},{"n":1156,"q":"Xác định quan niệm sai về vai trò của mâu thuẫn và của quy luật mâu thuẫn:","o":["Mâu thuẫn vừa có tính khách quan, vừa có tính phôt biến trong tự nhiên, xã hội và nhận thức","Không chỉ cần nắm được vai trò động lực, nguồn gốc của mâu thuẫn trong phát triển mà còn biêt phân biệt các mâu thuẫn khác nhau để có giải pháp goải quyết khác nhau","Quy luật mâu thuẫn là hạt nhân của phép biện chứng duy vật, nó chỉ phương hướng của sự phát triển","Sự vật tự nhiên muốn có mâu thuẫn bên trong, mâu thuẫn này là nguồn gốc vận động của sự vật"],"a":2},{"n":1157,"q":"Phương thức sản xuất đời sống vật chất....................... toàn bộ đời sống xã hội, đời sống chính trị và đời sống tinh thần của xã hội. Luận điểm này viết thiếu hai từ. Hãy chọn cụm từ đúng nhất cho chỗ viết thiếu đó:","o":["Chi phối","Liên quan","Thúc đẩy","Phụ thuộc"],"a":0},{"n":1158,"q":"Xác định quan niệm sai về quy luật phủ định của phủ định:","o":["Phủ định của phủ định là vòng khâu của sự phát triển, mỗi chu kỳ hình như lặp lại giai đoạn đầu","Phủ định của phủ định có hình xoáy ốc theo hướng tiến lên đến vô tận, không có khởi đầu","Phủ định của phủ định có tính khách quan còn phủ định trong tư duy là sự phản ánh phủ định trong hiện thực","Phủ định của phủ định là quy luật chỉ tồn tại trong giới tự nhiên"],"a":3},{"n":1159,"q":"Điều kiện sinh hoạt vật chất của xã hội bao gồm các yếu tố: hãy chỉ ra một yếu tố viết thừa và không đúng:","o":["Văn hóa phi vật thể","Hoàn cảnh tự nhiên","Phương thức sản xuất","Dân số"],"a":0},{"n":1160,"q":"Lực lượng sản xuất vật chất bao gồm các yếu tố: Hãy chỉ ra một yếu tố viết thừa:","o":["Đối tượng lao động","Công cụ lao động","Tư liệu lao động","Người lao động"],"a":1},{"n":1161,"q":"Xác định câu trả lời đúng nhất về ý nghĩa của phương pháp luận của quy luật phủ định của phủ định:","o":["Phủ định của phủ định là quá trình cái cũ mất đi, cái mới hợp quy luật ra đời. Cái mới ra đời thường gặp nhiều khó khăn, trở ngại. Cần có thái độ tích cực ủng hộ, giúp đỡ, bảo vệ cái mới và kiên quyết từ bỏ cái cũ lỗi thời","Phủ định của phủ định là quá trình cái cũ ra đời. Cần có thái độ giúp đỡ, ủng hộ, bảo vệ cái mới. Vì khi nó ra đời thường gặp nhiều khó khăn","Phủ định của phủ định là làm cho cái cũ mất đi, cái mới ra đời phù hợp với quy luật. Cần phải xây dựng thái độ ủng hộ, giúp đỡ, phê phán cái mới","Phủ định của phủ định là quá trình cái cũ mất đi, cái mới ra đời hợp với quy luật. Cần có nhận thức đúng về vai trò tích cực, tiến bộ của cái mới"],"a":0},{"n":1162,"q":"Theo quan điểm duy vật lịch sử, nhân tố......................trong lịch sử, xét đến cùng là sự sản xuất và tái sản xuất ra đời sống hiện thực. Luận điểm trên bị viết thiếu hai từ. Hãy chọn cụm từ đúng nhất cho sự viết thiếu đó:","o":["Quan trọng","Chủ yếu","Thứ yếu","Quyết định"],"a":3},{"n":1163,"q":"Hãy phát hiện một điểm tóm tắt trong đó có nội dung sai về mối quan hệ giữa cơ sở hạ tầng và kiến trúc thượng tầng:","o":["Từ trong toàn bộ các quan hệ xã hội hết sưc phức tạp Mác đã phân biệt những quan hệ vật chất tạo nên cơ sở hạ tầng xã hội, với những quan hệ tư tưởng tinh thần tại lên kiến trúc thượng tầng của xã hội","Cơ sở hạ tầng là toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một xã hội nhất định","Kiến trúc thượng tầng là toàn bộ những quan điểm xã hội, những thiết chế tương ứng và những quan hệ nội tại của thượng tầng, hignh thành trên một cơ sở hạ tầng nhất định","Cơ sở hạ tầng nào thì sinh ra kiến trúc thượng tầng ấy nên giữa chúng luôn luôn không có sự mâu thuẫn nào cả"],"a":3},{"n":1164,"q":"Quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất là quy luật ..................................... của sự phát triển. Luận điểm này bị viết thiếu hai từ. hãy chon ra cụm từ đúng cho chỗ viết thiếu đó:","o":["Chung nhất","Tạm thời","Riêng biệt","Đặc thù"],"a":0},{"n":1165,"q":"Hãy phát hiện một điểm tóm tắt sai nội dung về mối quan hệ giữa lực lượng sản xuất với quan hệ sản xuất:","o":["Lực lượng sản xuất là hình thức còn quan hệ sản xuất là nội dung của phương thức sản xuất","Tác động biện chứng giữa hai mặt đó tạo thành quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất","Đó là quy luật xã hội phổ biến của toàn bộ lịch sử loài người","Quy luật này vạch rõ sự phụ thuộc khách quan của quan hệ sản xuất vào sự phát triển của lực lượng sản xuất đồng thời quan hệ sản xuất cũng tác động lại lực lượng sản xuất"],"a":0},{"n":1166,"q":"Ý nghĩa phương pháp luận của mối quan hệ biện chững giữa hiện tượng và bản chất:","o":["Hiện tượng là biểu hiện ra bên ngoài của bản chất, thường làm sai lệch bản chất nên tốt nhất là nhận thức, hành động đi thẳng vào bản chất sẽ tránh được sai lầm","Phương pháp nhận thức đúng là đi từ hiện tượng đến bản chất, đi từ bản chất ít sâu sắc đến bản chất sâu sắc hơn, không nhầm lẫn hiện tượng với bản chất","Nhận thức và hành động của con người không thể đạt tới bản chất của sự vật vì nó bị vô số hiện tượng bao bọc bên ngoài, trong đó lại có những hiện tượng làm sai lạc, xuyên tặc bản chất","Chỉ có bản chất mới là mối quan hệ khách quan, còn hiện tượng là mối quan hệ chủ quan do tác động tiêu cực của con người tạo ra làm sai lạc bản chất. Do đó, muốn nhận thức đúng bản chất, con người đi thẳng vào tìm hiểu và nắm lấy bản chất sẽ tránh được sai lầm c."],"a":1},{"n":1167,"q":"Ý thức xã hội là sự phản ánh tích cực xủa tồn tại xã hội. Luận điểm này thuộc lập trường triết học nào? Chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy tâm","Chủ nghĩa duy vật","Chủ nghĩa duy vật lịch sử"],"a":3},{"n":1168,"q":"Ý thức xã hội là cái phản ánh tồn tai xã hội, vì vậy nó không có vai trò gì đối với tồn tại xã hội. Quan điểm này thuộc lập trường triết học nào? Chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy vật biện chứng lịch sử","Chủ nghĩa dy tâm lịch sử","Chủ nghĩa duy vật siêu hình","Chủ nghĩa duy vật tầm thường( Chủ nghĩa duy vật kinh tế)"],"a":2},{"n":1169,"q":"Ý nghĩa phương pháp luận của mối quan hệ giữa nội dung và hình thức là gì? Xác định câu trả lời đúng và đầy đủ nhất?","o":["Trong nhận thức và hành động không được tách rời hoặc tuyệt đối hóa một mặt nội dung hay hình thức. Phải coi trọng nội dung đồng thời phải chú trọng thích đáng tới hình thức, bảo đảm cho nội dung có một hình thức phù hợp nhất. Khi một trong chúng đã tỏ ra lỗi thời thì phải thay đổi cho phù hợp","Trong nhận thức và hành động không được tách rời, tuyệt đối hóa một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của hình thức, đồng thời coi trọng nội dung. Khi một trong chúng đã lỗi thời phải thay đổi cho phù hợp, chống chủ nghĩa hình thức","Trong nhận thức và hành động không được tách rời, tuyệt đối hóa một mặt nội dung hay hình thức. Trước hết phải chú trọng vai trò quyết định của nội dung, nhưng phải chú trọng tới hình thức","Trong nhận thức và hành động không thể tuyệt đối hóa một mặt nội dung hay hình thức"],"a":0},{"n":1170,"q":"Quan hệ biện chứng giữa nguyên nhân và kết quả thể hiện như nào? Xác định câu trả lời theo quan điểm siêu hình:","o":["Trong điều kiện xác định, nguyên nhân có sau kết quả. Một nguyên nhân có thể sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hóa cho nhau","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân chi sinh ra một kết quả và ngược lại, nguyên nhân và kết quả không thê chuyển hóa cho nhau","Trong những điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại, nguyên nhân và kết quả có thể chuyển hóa cho nhau","Trong điều kiện xác định, nguyên nhân có trước kết quả, một nguyên nhân sinh ra nhiều kết quả và ngược lại. Nguyên nhân và kết quả có thể chuyển hóa cho nhau trong quá trình vận động"],"a":1},{"n":1171,"q":"Trong mọi thời đại, những tư tưởng của giai cấp thóng trị là những tư tưởng thống nhất xã hội. Luận điểm này thể hiện lập trường triết học nào. Chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy vật tầm thường( chủ nghĩa kinh tế)","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy vật lịch sử"],"a":3},{"n":1172,"q":"Một sinh viên giải thích nguyên tắc thống nhất giữa lý luận và thực tiễn trong hoạt động nhận thức và hoạt động thực tiễn như sau. Phát hiện một giải thích không chính xác?","o":["Thực tiễn mà không có lí luận hướng dẫn thì thành thực tiễn mù quáng","Lý luận mà không liên hệ với thực tiễn là lý luận suông","Lý luận đóng vai trò quyết định trong quan hệ đối với thực tiễn","Thực tiễn là hoạt động vật chất, còn lý luận là hoạt động tinh thần"],"a":2},{"n":1173,"q":"Mọi thuyết đạo đức có từ trước đến nay, xét đến cùng, đều là sản phẩm của tình hình kinh tế lúc bấy giờ. Quan điểm này thuộc lập trường triết học nào? Chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy vật","Nhị nguyên luận"],"a":1},{"n":1174,"q":"Muốn phân tích một hình thái ý thức xã hội nào đó thì phải làm gì? Một sinh viên đã trả lời như sau, hãy chỉ ra một trả lời sai?","o":["Trước hết cần chú ý đến cá điều kiên kinh tế-xã hội đã sinh ra nó","Đồng thời xém xét những yếu tố mà nó kế thừa được trong ý thức của các thời đai trước","Mặt khác cũng phải chú ý đến sự tác động lên nó của các hình thái ý thức xã hội khác","Phải lưu ý rằng tính độc lập của hình thái ý thức xã hội đối với tồn tại xã hội là tuyệt đối"],"a":3},{"n":1175,"q":"Hoạt động của con người khác với động vật là có ý thức, vì thế ý thức của con người quyết định sự tồn tại của họ. Luận điểm này thể hiện lập trường triết học nào? Chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy vật","Chủ nghĩa duy vật lịch sử","Chủ nghĩa duy tâm","Chủ nghĩa duy vật tầm thường( chủ nghĩa kinh tế)"],"a":1},{"n":1176,"q":"Ý nghĩa phương pháp luận của quy luật phủ định của phủ định. Xác định câu trả lời đúng nhất?","o":["Phủ định của phủ định là quá trình cái cũ mất di,cái mới hợp quy luậy ra đời. Cái mới ra đời thường gặp nhiều khó khăn, trở ngại. Cần có thái độ tích cực ủng hộ, giúp đỡ, bảo vệ cái mới và kiên quyết từ bỏ cái cũ lỗi thời","Phủ định của phủ định là quá trình cái mới ra đời. Cần có thái độ giúp đỡ, ủng hộ, bảo vệ cái mới. Vì khi nó ra đời thường xuyên gặp nhiều khó khăn","Phủ định của phủ định là làm cho cái cũ mất đi, cái mới ra đời hợp với quy luật.Cần phải xây dựng thái độ ủng hộ, giúp đỡ, phê phán cái mới","Phủ định của phủ định là quá trình cái cũ mất đi, cái mới ra đời hợp với quy luật. Cần có nhận thức đúng về vai trò của quy luật. cần có nhận thức đúng về vai trò tích cực, tiến bộ của cái mới"],"a":0},{"n":1177,"q":"Phương thức sản xuất đời sống vật chất phụ thuộc vào đời sống chính trị, đời sống xã hội và đời sống tinh thần ní chung. Luận điểm ày đã viết sai cụm từ nào? chọn câu trả lời đúng nhất:","o":["Phụ thuộc","Phương thức sản xuất","Đời sống chính trị","Đời sống tinh thần"],"a":0},{"n":1178,"q":"Có thể tóm tắt mối quan hệ giữa cơ sở hạ tầng với kiến trúc thượng tầng theo mấy điểm sau. Hãy phát hiện một điểm tóm tát trong đó có nội dung sai?","o":["Từ trong toàn bộ các quan hệ hết sức phức tạp Mác đã phân biệt những quan hệ vật chất tạo nên cơ sở hạ tầng của xã hội, với những quan hệ tư tưởng tinh thần tạo nên kiến trúc thượng tầng của xã hội","Cơ sở hạ tầng là toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một xã hội nhất định","Kiến thức thượng tầng là toàn bộ những quan điểm xã hội, những thiết chế tương ứng và những quan hệ nội tại của thượng tầng, hình thành trên một cơ sở hạ tầng nhất định","Cơ sở hạ tầng nào thì sinh ra kiến trúc thượng tầng ấy đồng thời kiến trúc thượng tầng tác động trở lại cơ sở hạ tầng. Bất cứ sự biến đổi nào trong kiến trúc thượng tầng cũng được giải thích chỉ bằng những nguyên nhân kinh tế"],"a":3},{"n":1179,"q":"Có thể tóm tắt nội dung mối quan hệ biện chứng giữa lực lượng sản xuất và quan hệ sản xuất theo các điểm sau đây: Hãy phát hiện một điểm tóm tắt sai nội dung?","o":["Lực lượng sản xuất và quan hệ sản xuất là hai mặt của phương thức sản xuất, tồn tai tách rời nhau","Tác động biện chứng giữa hai mặt đó tạo thành quy luật về sự phù hợp của quan hệ sản xuất với trình độ và tính chất của lực lượng sản xuất","Đó là quy luật xã hội phổ biến của toàn bộ lịch sử loài người","Quy luật này vạch rõ sự phụ thuộc khách quan của quan hệ sản xuất vào sự phát triển của lực lượng sản xuất đồng thời quan hệ sản xuất cũng tác động trở lại lực lượng sản xuất"],"a":0},{"n":1180,"q":"Xã hội là một tổ hợp các bộ phận được cấu thành và biến đổi một cách ngẫu nhiên. quan điểm này thuộc lập trường triết học nào? chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy vật biện chứng lịch sử","Chủ nghĩa duy vật siêu hình trong lịch sử","Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy vật siêu hình"],"a":3},{"n":1181,"q":"Phủ định biện chứng là gì? Chọn câu trả lời đúng nhất và khái quát nhất:","o":["Phủ định biện chứng là sự thủ tiêu hoàn toàn cái cũ do tác động từ bên ngoài vào sự vật","Phủ định biện chứng là phủ định có sự kế thừa, do đó cũng đồng thời là sự khẳng định","Phủ định biện chứng là sự thống nhất giữa loại bỏ và kế thừa để dẫn đến sự ra đời cái mới tiến bộ hơn","Phủ định biện chứng là quá trình tự thân phủ định và là mắt khâu của sự phát triển"],"a":3},{"n":1182,"q":"xã hội là một tổng số các bộ phận được cấu thành và biến đổi tùy theo ý muốn của con người. Quan niệm này thuộc lập trường triết học nào? Chọn câu trra lời đúng nhất:","o":["Chủ nghĩa duy vật biện chứng lịch sử","Chủ nghĩa duy vật biện chứng","Chủ nghĩa duy tâm","Chủ nghĩa duy tâm lịch sử"],"a":3},{"n":1183,"q":"Một sinh viên tóm tắt nội dung quy luật về sự phù hợp giữa QHSX với trình độ của LLXH như sau. Phát hiện câu tóm tắt đúng?","o":["LLSX và QHSX lag hai mặt của PTSX tồn tại tách rời nhau","Quy luật này chỉ tồn tại trong một vài chế độ xã hội","Quy luật này vạch rõ sự phụ thuộc khách quan của LLSX và QHSX","Quy luật về sự phù hợp của LLSX với trình độ của QHSX là quy luật cơ bản của sự phát triểm xã hội loài người"],"a":3},{"n":1184,"q":"Kiến trúc thượng tầng pháp lí và chính trị quyết định cơ cấu kinh tế của xã hội. Quan điểm này thuộc lập trường triết học nào? Chọn câu trra lời đúng nhất:","o":["Chủ nghĩa duy vật lịch sử","Chủ nghãi duy tâm lịch sử","Chủ nghĩa duy tâm","Chủ nghĩa duy vật tầm thường(chủ nghĩa duy vật kinh tế)"],"a":1},{"n":1185,"q":"Chỉ dựa vào các quan hệ kinh tế hiện có cũng có thể giải thích đầy đủ bất kỳ học thuyết chính trị nào. Luận điểm này thuộc lập trường triết học nào? chọn câu trả lời đúng:","o":["chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy vật tầm thường(chủ nghĩa duy vật kinh tế)","Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật siêu hình"],"a":1},{"n":1186,"q":"Chỉ dựa vào các quan hệ kinh tế hiện có cũng có thể giải thích đầy đủ bất kỳ tư tưởng pháp quyền nào. Luận điểm này thuộc lập trường triết học nào? chọn câu trả lời đúng:","o":["Chủ nghĩa duy tâm khách quan","Chủ nghĩa duy vật tầm thường(chủ nghĩa kinh tế)","Chủ nghĩa duy tâm","Chủ nghĩa duy vật lịch sử"],"a":1},{"n":1187,"q":"Khi nghiên cứu phương thức tư bản chủ nghĩa,","o":["Sản xuất của cải vật chất","Lưu thông hàng hoá","Mác bắt đầu từ:","Sản xuất giá trị thặng dư"],"a":2},{"n":1188,"q":"Học thuyết kinh tế nào của","o":["Học thuyết tái sản xuất tư bản xã hội","Học thuyết tích luỹ tư sản","Mác được coi là hòn đá tảng?","Học thuyết giá trị thặng dư"],"a":3},{"n":1189,"q":"Tất cả cái gì thúc đẩy con người hành động đều phải thông qua đầu óc của họ. Vì vậy phải tìm động lực sâu xa của lịch sử ở trong tư tưởng và ý chí của con người. Quan niệm này thuộc lập trường triết học nào? chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy tâm chủ quan","Chủ nghĩa duy vật biện chứng lịc sử","Chủ nghĩa duy vật tầm thường( chủ nghĩa kinh tế)"],"a":0},{"n":1190,"q":"Trong tất cả những chuyển biến về lịch sử thì chuyển biến về chính trị là chuyển biến quan trọng nhất, quyết định sự phát triển của lịch sử. Quan niệm này thuộc lập trường triết học nào? chọn câu trả lời đúng nhất:","o":["Chủ nghĩa duy tâm lịch sử","Chủ nghĩa duy vật tầm thường(chủ nghĩa kinh tế)","Chủ nghĩa duy tâm","Chủ nghĩa duy vật biện chứng lịch sử"],"a":0}];
const L = 'ABCD';
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
let wrong = new Set(store.get('mln_wrong', []));
const saveWrong = () => { store.set('mln_wrong', [...wrong]); $('wc').textContent = wrong.size };
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]] } return a };

// Per-question stats: n -> [correct, wrong, streak]. A question leaves the wrong list after 2 correct in a row.
const stat = store.get('mln_stat', {});
function record(n, ok) {
  const s = stat[n] ??= [0, 0, 0];
  if (ok) { s[0]++; s[2]++; if (s[2] >= 2) wrong.delete(n) } else { s[1]++; s[2] = 0; wrong.add(n) }
}
const saveStats = () => { store.set('mln_stat', stat); saveWrong(); renderSets() };

// Option shuffle. Questions whose options refer to each other ("Cả A và B", "Tất cả các ý trên") keep their order.
const FIXED = /\b[a-d]\s*(,|và|&|hoặc)|cả |tất cả|đều (đúng|sai)|không có|trên\.?$/i;
const view = (q, p) => ({ ...q, p, o: p.map(i => q.o[i]), a: p.indexOf(q.a) });
const prep = (q, mix) => {
  const p = q.o.map((_, i) => i);
  return view(q, mix && !q.o.some(o => FIXED.test(o.trim())) ? shuffle(p) : p);
};

$('total').textContent = Q.length;
saveWrong();

document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('hide', s.id !== b.dataset.tab));
  if (b.dataset.tab === 'wrong') renderWrong();
  if (b.dataset.tab === 'browse') renderBrowse();
});

// Card with instant feedback; onAnswer(correct) called once.
function card(q, onAnswer, picked) {
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = `<div class="qn">Câu ${q.n}</div><div class="q">${esc(q.q)}</div>`;
  const btns = q.o.map((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = `${L[i]}. ${o}`;
    b.onclick = () => reveal(i, true);
    d.appendChild(b);
    return b;
  });
  function reveal(i, fresh) {
    btns.forEach((b, k) => { b.disabled = true; if (k === q.a) b.classList.add('ok'); else if (k === i) b.classList.add('no') });
    if (fresh) onAnswer?.(i);
  }
  if (picked != null) reveal(picked, false);
  return d;
}

// Practice
let pList = [], pIdx = 0, pAns = {};
function pStart(list) {
  pList = list.map(q => prep(q, $('pOpt').checked)); pIdx = 0; pAns = {}; pRender();
}
// Session survives reload: question numbers + option order, position, answers.
const pSave = () => store.set('mln_sess', { l: pList.map(q => [q.n, q.p]), i: pIdx, a: pAns });
function pRender() {
  const box = $('pBox'); box.innerHTML = '';
  if (!pList.length) { $('pStat').textContent = 'Không có câu nào.'; return }
  const q = pList[pIdx];
  box.appendChild(card(q, i => {
    pAns[pIdx] = i;
    record(q.n, i === q.a);
    saveStats(); pStatus(); pSave();
  }, pAns[pIdx]));
  pStatus(); pSave();
}
function pStatus() {
  const done = Object.keys(pAns).length;
  const ok = Object.entries(pAns).filter(([k, v]) => pList[k].a === v).length;
  $('pStat').textContent = `Câu ${pIdx + 1}/${pList.length} · Đúng ${ok}/${done}`;
  $('pBar').style.width = (done / pList.length * 100) + '%';
}
const SET = 50;
function renderSets() {
  const box = $('pSets'); box.innerHTML = '';
  for (let a = 0; a < Q.length; a += SET) {
    const list = Q.slice(a, a + SET);
    const done = list.filter(q => stat[q.n]).length, ok = list.filter(q => stat[q.n]?.[2] > 0).length;
    const b = document.createElement('button'); b.className = 'set';
    b.innerHTML = `<b>${a + 1}–${a + list.length}</b><small>Đã làm ${done}/${list.length} · đúng ${ok}</small><i style="width:${done / list.length * 100}%"></i>`;
    b.onclick = () => pBegin(list);
    box.appendChild(b);
  }
}
const pBegin = list => { pStart($('pShuf').checked ? shuffle(list) : list); $('pPick').open = false };
$('pAll').onclick = () => pBegin(Q);
renderSets();
$('pPrev').onclick = () => { if (pIdx > 0) { pIdx--; pRender() } };
$('pNext').onclick = () => { if (pIdx < pList.length - 1) { pIdx++; pRender() } };
document.addEventListener('keydown', e => {
  if ($('practice').classList.contains('hide') || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') $('pNext').click();
  if (e.key === 'ArrowLeft') $('pPrev').click();
  const k = '1234abcd'.indexOf(e.key.toLowerCase());
  if (k >= 0) $('pBox').querySelectorAll('.opt')[k % 4]?.click();
});
const sess = store.get('mln_sess', null);
if (sess?.l?.length && sess.l.every(([n]) => Q[n - 1])) {
  pList = sess.l.map(([n, p]) => view(Q[n - 1], p)); pIdx = sess.i; pAns = sess.a;
  $('pPick').open = false; pRender();
} else pStart(Q);

// Exam: pick answers silently, grade on submit.
let eList = [], ePick = {}, eTimer = null;
$('eStart').onclick = () => {
  eList = shuffle(Q).slice(0, +$('eN').value).map(q => prep(q, $('eOpt').checked)); ePick = {};
  const box = $('eBox'); box.innerHTML = '';
  eList.forEach((q, qi) => {
    const d = document.createElement('div'); d.className = 'card';
    d.innerHTML = `<div class="qn">Câu ${qi + 1} <span class="stat">(#${q.n})</span></div><div class="q">${esc(q.q)}</div>`;
    q.o.forEach((o, i) => {
      const b = document.createElement('button'); b.className = 'opt'; b.textContent = `${L[i]}. ${o}`;
      b.onclick = () => { ePick[qi] = i; d.querySelectorAll('.opt').forEach((x, k) => x.style.borderColor = k === i ? 'var(--acc)' : '') };
      d.appendChild(b);
    });
    box.appendChild(d);
  });
  $('eSubmitRow').classList.remove('hide');
  clearInterval(eTimer);
  const mins = +$('eT').value;
  if (mins) {
    const end = Date.now() + mins * 60000;
    eTimer = setInterval(() => {
      const s = Math.max(0, (end - Date.now()) / 1000 | 0);
      $('eTimer').textContent = `Còn lại ${s / 60 | 0}:${String(s % 60).padStart(2, '0')}`;
      if (!s) eSubmit();
    }, 500);
  } else $('eTimer').textContent = '';
};
function eSubmit() {
  clearInterval(eTimer);
  let ok = 0;
  $('eBox').querySelectorAll('.card').forEach((d, qi) => {
    const q = eList[qi], p = ePick[qi];
    d.querySelectorAll('.opt').forEach((b, k) => {
      b.disabled = true; b.style.borderColor = '';
      if (k === q.a) b.classList.add('ok'); else if (k === p) b.classList.add('no');
    });
    if (p === q.a) ok++;
    record(q.n, p === q.a);
  });
  saveStats();
  $('eSubmitRow').classList.add('hide');
  $('eTimer').innerHTML = `<div class="card"><div class="big">${ok}/${eList.length}</div>Điểm: ${(ok / eList.length * 10).toFixed(2)} / 10</div>`;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('eSubmit').onclick = () => { if (confirm('Nộp bài?')) eSubmit() };

// Wrong list
function renderWrong() {
  const box = $('wBox'); box.innerHTML = '';
  const list = Q.filter(q => wrong.has(q.n));
  if (!list.length) { box.innerHTML = '<p class="stat">Chưa có câu sai nào. Làm bài ở tab Luyện tập hoặc Thi thử.</p>'; return }
  box.innerHTML = '<p class="stat">Câu chỉ rời danh sách khi trả lời đúng 2 lần liên tiếp.</p>';
  list.forEach(q => box.appendChild(ansCard(q)));
}
$('wStart').onclick = () => {
  const list = shuffle(Q.filter(q => wrong.has(q.n)));
  if (!list.length) return;
  pStart(list);
  document.querySelector('nav button[data-tab=practice]').click();
};
$('wClear').onclick = () => { if (confirm('Xóa toàn bộ danh sách câu sai?')) { wrong.clear(); saveWrong(); renderWrong() } };

// Browse
function ansCard(q) {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<div class="qn">Câu ${q.n}</div><div class="q">${esc(q.q)}</div>` +
    q.o.map((o, i) => `<div class="${i === q.a ? 'ans' : ''}">${L[i]}. ${esc(o)}</div>`).join('');
  return d;
}
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/gi, 'd').toLowerCase();
const QN = Q.map(q => norm(q.q + ' ' + q.o.join(' ')));
function renderBrowse() {
  const k = norm($('bQ').value.trim());
  const list = !k ? Q : /^\d+$/.test(k) ? Q.filter(q => q.n === +k) : Q.filter((q, i) => QN[i].includes(k));
  $('bStat').textContent = `${list.length} kết quả${list.length > 100 ? " (hiện 100 câu đầu, gõ từ khóa để lọc)" : ""}`;
  const box = $('bBox'); box.innerHTML = '';
  list.slice(0, 100).forEach(q => box.appendChild(ansCard(q)));
}
$('bQ').oninput = renderBrowse;
</script>
